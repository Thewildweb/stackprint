- id: apple-mapkit-js
  name: Apple MapKit JS
  vendor: apple
  website: https://developer.apple.com/maps/mapkitjs/
  categories:
  - maps
  signals:
  - type: resource_url
    regex: (?i)/mapkit\.js(?:[?#]|$)
    id: file-0
  - type: js_global
    key: mapkit
    id: global-1
  - type: resource_url
    contains: //cdn.apple-mapkit.com/
    id: host-2
  - id: version-url
    type: resource_url
    regex: cdn\.apple-mapkit\.com/mk/(\d+\.[\d.]+)/
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The x-rid response header is an Apple CDN header, not a separate
      signal. The mapkit.js URL itself uses a floating 5.x.x path with no version. The version appears
      only in asset paths such as the pin images.
    corpus: nl-browser-full-sample
    support: 16
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file mapkit.js
    page:
      url: https://example.test/
      html: <script src="/assets/mapkit.js"></script>
    expect: {}
  - name: global mapkit
    page:
      url: https://example.test/
      js_globals:
        mapkit: ''
    expect: {}
  - name: host cdn.apple-mapkit.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.apple-mapkit.com/x.js"></script>
    expect: {}
