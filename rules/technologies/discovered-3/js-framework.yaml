- id: cakephp
  name: CakePHP
  vendor: cakephp
  website: https://cakephp.org
  categories:
  - js-framework
  signals:
  - type: cookie
    regex: (?i)^cakephp$
    id: cookie-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The category schema has no backend-framework option. 'js-framework'
      is the closest fit, though laravel and codeigniter in the existing rule set are PHP frameworks of
      the same kind. The cookie is the default session name, and sites can rename it.
    corpus: nl-browser-full-sample
    support: 29
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie cakephp
    page:
      url: https://example.test/
      cookies:
      - name: cakephp
    expect: {}
- id: django
  name: Django
  vendor: django-software-foundation
  website: https://www.djangoproject.com
  categories:
  - js-framework
  signals:
  - type: cookie
    regex: (?i)^django_language$
    id: cookie-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The cookie is Django-specific, but it only appears when i18n
      language switching is used, so many Django sites will not be caught. Django is a Python web framework;
      the schema has no web-framework category, so js-framework is the closest fit.
    corpus: nl-browser-full-sample
    support: 10
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie django_language
    page:
      url: https://example.test/
      cookies:
      - name: django_language
    expect: {}
