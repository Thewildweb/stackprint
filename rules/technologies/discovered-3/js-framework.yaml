  vendor: rails
  website: https://guides.rubyonrails.org/active_storage_overview.html
  categories:
  - js-framework
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/rails/active_storage/
    first_party: true
    id: path-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The path is specific to Rails Active Storage and shows the site
      runs on Ruby on Rails. No generic Rails rule exists in the set. The category is a best fit; programming-language
      or js-framework are the nearest options. The co-occurrence with google-tag is incidental.
    corpus: nl-browser-full-sample
    support: 17
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /rails/active_storage/
    page:
      url: https://example.test/
      html: <script src="/rails/active_storage/x.js"></script>
    expect: {}
- id: symfony-ux-stimulus-bundle
  name: Symfony Stimulus Bundle (Symfony UX)
  vendor: symfony
  website: https://symfony.com/bundles/StimulusBundle/current/index.html
  categories:
  - js-framework
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/assets/@symfony/stimulus\-bundle/
    first_party: true
    id: path-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The path /assets/@symfony/ is shared by Symfony UX packages,
      so the stimulus-bundle path is the more precise signal. controllers.js alone is generic. The jspm
      best_label correlation is likely due to importmap usage, since AssetMapper emits importmaps.
    corpus: nl-browser-full-sample
    support: 12
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /assets/@symfony/stimulus-bundle/
    page:
      url: https://example.test/
      html: <script src="/assets/@symfony/stimulus-bundle/x.js"></script>
    expect: {}
