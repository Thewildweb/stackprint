# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: amp-project
  name: AMP (Accelerated Mobile Pages)
  vendor: amp-project
  website: https://amp.dev
  categories:
  - js-framework
  signals:
  - type: js_global
    key: AMP_CONFIG
    id: global-0
  - type: js_global
    key: __AMP_MODE
    id: global-1
  - type: js_global
    key: __AMP_SERVICES
    id: global-2
  - type: js_global
    key: __AMP_TOP
    id: global-3
  - type: resource_url
    contains: //cdn.ampproject.org/
    id: host-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The rtv path segment is a runtime build id, not a clean semantic
      version, so no version regex is given.
    corpus: nl-browser-full-sample
    support: 28
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global AMP_CONFIG
    page:
      url: https://example.test/
      js_globals:
        AMP_CONFIG: ''
    expect: {}
  - name: global __AMP_MODE
    page:
      url: https://example.test/
      js_globals:
        __AMP_MODE: ''
    expect: {}
  - name: global __AMP_SERVICES
    page:
      url: https://example.test/
      js_globals:
        __AMP_SERVICES: ''
    expect: {}
  - name: global __AMP_TOP
    page:
      url: https://example.test/
      js_globals:
        __AMP_TOP: ''
    expect: {}
  - name: host cdn.ampproject.org
    page:
      url: https://example.test/
      html: <script src="https://cdn.ampproject.org/x.js"></script>
    expect: {}
