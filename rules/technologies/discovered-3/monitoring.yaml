- id: synology-active-insight
  name: Synology Active Insight
  vendor: synology
  website: https://www.synology.com/en-global/dsm/feature/active-insight
  categories:
  - monitoring
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/webman/[0-9]+rdparty/activeinsight/
    first_party: true
    id: path-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The /webman/3rdparty/ path is Synology DSM's package web directory,
      and activeinsight is Synology's Active Insight monitoring service. The pages are probably DSM login
      pages. The token appears together with vue-router at 100% precision, which fits a Vue-based DSM
      UI. A detection based on /webman/#rdparty/ alone would indicate Synology DSM generally, but only
      the activeinsight token is in this cand
    corpus: nl-browser-full-sample
    support: 11
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /webman/#rdparty/activeinsight/
    page:
      url: https://example.test/
      html: <script src="/webman/1rdparty/activeinsight/x.js"></script>
    expect: {}
- id: trackjs
  name: TrackJS
  vendor: trackjs
  website: https://trackjs.com
  categories:
  - monitoring
  signals:
  - type: resource_url
    contains: //cdn.trackjs.com/
    id: host-0
  - type: resource_url
    contains: //usage.trackjs.com/
    id: host-1
  - type: resource_url
    contains: //cdn.trackjs.com/agent/
    id: hostdir-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. TrackJS is a JavaScript error monitoring service. The agent
      path contains an API version (v3), not a product version, so no version rule is given.
    corpus: nl-browser-full-sample
    support: 16
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host cdn.trackjs.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.trackjs.com/x.js"></script>
    expect: {}
  - name: host usage.trackjs.com
    page:
      url: https://example.test/
      html: <script src="https://usage.trackjs.com/x.js"></script>
    expect: {}
  - name: hostdir cdn.trackjs.com/agent/
    page:
      url: https://example.test/
      html: <script src="https://cdn.trackjs.com/agent/x.js"></script>
    expect: {}
