- id: optimonk
  name: OptiMonk
  vendor: optimonk
  website: https://www.optimonk.com
  categories:
  - personalisation
  signals:
  - type: cookie
    regex: (?i)^optimonkclientid$
    id: cookie-0
  - type: resource_url
    contains: //cdn-account.optimonk.com/
    id: host-1
  - type: resource_url
    contains: //cdn-asset.optimonk.com/
    id: host-2
  - type: resource_url
    contains: //cdn-limit.optimonk.com/
    id: host-3
  - type: resource_url
    contains: //front.optimonk.com/
    id: host-4
  - type: resource_url
    contains: //onsite.optimonk.com/
    id: host-5
  - type: storage
    regex: (?i)^optimonkshopattributes$
    id: storage-6
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. OptiMonk is a popup/onsite messaging and conversion optimization
      tool, popular on Shopify. Category personalisation chosen as closest fit.
    corpus: nl-browser-full-sample
    support: 11
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie optimonkclientid
    page:
      url: https://example.test/
      cookies:
      - name: optimonkclientid
    expect: {}
  - name: host cdn-account.optimonk.com
    page:
      url: https://example.test/
      html: <script src="https://cdn-account.optimonk.com/x.js"></script>
    expect: {}
  - name: host cdn-asset.optimonk.com
    page:
