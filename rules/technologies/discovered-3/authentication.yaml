# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: adobe-idp-site-verification
  name: Adobe Identity Provider Domain Verification
  vendor: adobe
  website: https://www.adobe.com
  categories:
  - authentication
  signals:
  - type: dns
    key: TXT
    prefix: adobe-idp-site-verification=
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. High co-occurrence with Microsoft 365 is incidental (Microsoft-using
      organisations also use Adobe enterprise SSO). The TXT prefix is Adobe-specific and indicates Adobe
      enterprise/Creative Cloud usage.
    corpus: nl-browser-full-sample
    support: 24
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns txt:adobe-idp-site-verification
    page:
      url: https://example.test/
      dns:
        TXT:
        - adobe-idp-site-verification=abc
    expect: {}
- id: clerk
  name: Clerk
  vendor: clerk
  website: https://clerk.com
  categories:
  - authentication
  signals:
  - type: cookie
    regex: (?i)^__client_uat$
    id: cookie-0
  - type: data_attr
    regex: (?i)^data\-clerk\-js\-script$
    id: data-1
  - type: data_attr
    regex: (?i)^data\-clerk\-publishable\-key$
    id: data-2
  - type: resource_url
    regex: (?i)/clerk\.browser\.js(?:[?#]|$)
    id: file-3
  - type: js_global
    key: Clerk
    id: global-4
  - type: js_global
    key: __clerk_domain
    id: global-5
  - type: js_global
    key: __clerk_internal_navigations
    id: global-6
  - type: js_global
    key: __clerk_proxy_url
    id: global-7
  - type: js_global
    key: __clerk_publishable_key
    id: global-8
  - type: header
    key: x-clerk-auth-reason
    id: header-9
  - type: header
    key: x-clerk-auth-status
    id: header-10
  - type: resource_url
    regex: (?i)^https?://[^/]+/npm/@clerk/clerk\-js@[0-9]+\.[0-9]+\.[0-9]+/dist/
    first_party: true
    id: path-11
  - type: resource_header
    key: clerk-api-version
    id: reshdr-12
  - type: resource_header
    key: x-clerk-auth-reason
    id: reshdr-13
  - type: resource_header
    key: x-clerk-auth-status
    id: reshdr-14
  - type: resource_header
    key: x-clerk-instance-id
    id: reshdr-15
  - type: resource_header
    key: x-clerk-trace-id
    id: reshdr-16
  - type: storage
    regex: (?i)^__clerk_environment$
    id: storage-17
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Tokens are clearly Clerk authentication. x-country and x-cfworker
      are Cloudflare-worker related and omitted. Clerk authentication (commonly with Next.js middleware,
      which explains the co-occurrence with nextjs). Headers are Clerk-specific.
    corpus: nl-browser-full-sample
    support: 35
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie __client_uat
    page:
      url: https://example.test/
      cookies:
      - name: __client_uat
    expect: {}
  - name: data data-clerk-js-script
    page:
      url: https://example.test/
      html: <div data-clerk-js-script="1"></div>
    expect: {}
  - name: data data-clerk-publishable-key
    page:
      url: https://example.test/
      html: <div data-clerk-publishable-key="1"></div>
    expect: {}
  - name: file clerk.browser.js
    page:
      url: https://example.test/
      html: <script src="/assets/clerk.browser.js"></script>
    expect: {}
  - name: global Clerk
    page:
      url: https://example.test/
      js_globals:
        Clerk: ''
    expect: {}
  - name: global __clerk_domain
    page:
      url: https://example.test/
      js_globals:
        __clerk_domain: ''
    expect: {}
  - name: global __clerk_internal_navigations
    page:
      url: https://example.test/
      js_globals:
        __clerk_internal_navigations: ''
    expect: {}
  - name: global __clerk_proxy_url
    page:
      url: https://example.test/
      js_globals:
        __clerk_proxy_url: ''
    expect: {}
  - name: global __clerk_publishable_key
    page:
      url: https://example.test/
      js_globals:
        __clerk_publishable_key: ''
    expect: {}
  - name: header x-clerk-auth-reason
    page:
      url: https://example.test/
      headers:
      - - x-clerk-auth-reason
        - '1'
    expect: {}
  - name: header x-clerk-auth-status
    page:
      url: https://example.test/
      headers:
      - - x-clerk-auth-status
        - '1'
    expect: {}
  - name: path /npm/@clerk/clerk-js@#.#.#/dist/
    page:
      url: https://example.test/
      html: <script src="/npm/@clerk/clerk-js@1.1.1/dist/x.js"></script>
    expect: {}
  - name: reshdr clerk-api-version
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - clerk-api-version
          - '1'
    expect: {}
  - name: reshdr x-clerk-auth-reason
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-clerk-auth-reason
          - '1'
    expect: {}
  - name: reshdr x-clerk-auth-status
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-clerk-auth-status
          - '1'
    expect: {}
  - name: reshdr x-clerk-instance-id
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-clerk-instance-id
          - '1'
    expect: {}
  - name: reshdr x-clerk-trace-id
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-clerk-trace-id
          - '1'
    expect: {}
  - name: storage __clerk_environment
    page:
      url: https://example.test/
      storage:
      - key: __clerk_environment
    expect: {}
