- id: goodreads-widgets
  name: Goodreads Widgets
  vendor: goodreads
  website: https://www.goodreads.com
  categories:
  - social
  signals:
  - type: resource_url
    contains: //www.goodreads.com/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Sample URLs show Goodreads embeddable widgets. The hostdir www.goodreads.com/user/
      is omitted because the samples show review/ and user_challenges/ paths, so it is a weaker signal;
      the host alone suffices.
    corpus: nl-browser-full-sample
    support: 20
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host www.goodreads.com
    page:
      url: https://example.test/
      html: <script src="https://www.goodreads.com/x.js"></script>
    expect: {}
