- id: bluehost-dns
  name: Bluehost DNS
  vendor: bluehost
  website: https://www.bluehost.com
  categories:
  - dns-provider
  signals:
  - type: dns
    key: NS
    regex: (?:^|[ .])bluehost\.com$
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The existing 'bluehost' hosting rule may cover hosting signals,
      but a DNS-specific rule for the nameserver suffix is not in the set. Following the pattern of other
      *-dns entries.
    corpus: nl-browser-full-sample
    support: 26
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns ns:bluehost.com
    page:
      url: https://example.test/
      dns:
        NS:
        - ns1.bluehost.com
    expect: {}
