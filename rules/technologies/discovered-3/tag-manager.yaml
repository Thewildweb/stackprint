# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: cloudflare-zaraz
  name: Cloudflare Zaraz
  vendor: cloudflare
  website: https://www.cloudflare.com/application-services/products/zaraz/
  categories:
  - tag-manager
  signals:
  - type: cookie
    regex: (?i)^cfz_google\-analytics_v[0-9]+$
    id: cookie-0
  - type: cookie
    regex: (?i)^cfzs_google\-analytics_v[0-9]+$
    id: cookie-1
  - type: js_global
    key: zaraz
    id: global-2
  - type: js_global
    key: zarazData
    id: global-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Zaraz is Cloudflare's tag manager, a distinct product from the
      Cloudflare CDN. The tokens co-occur with cloudflare only because Zaraz runs on Cloudflare-proxied
      sites.
    corpus: nl-browser-full-sample
    support: 23
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie cfz_google-analytics_v#
    page:
      url: https://example.test/
      cookies:
      - name: cfz_google-analytics_v1
    expect: {}
  - name: cookie cfzs_google-analytics_v#
    page:
      url: https://example.test/
      cookies:
      - name: cfzs_google-analytics_v1
    expect: {}
  - name: global zaraz
    page:
      url: https://example.test/
      js_globals:
        zaraz: ''
    expect: {}
  - name: global zarazData
    page:
      url: https://example.test/
      js_globals:
        zarazData: ''
    expect: {}
- id: taggingmk
  name: Tagging MK (GTM server-side tagging)
  vendor: taggingmk
  website: https://taggingmk.com
  categories:
  - tag-manager
  signals:
  - type: cookie
    regex: (?i)^_taggingmk$
    id: cookie-0
  - type: js_global
    key: tagging_domain
    id: global-1
  - type: js_global
    key: varGtmTryTagging
    id: global-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Tokens co-occur on WordPress sites (likely a GTM server-side
      tagging plugin/service). The vendor identification is inferred from the cookie name. user-data-minified.js
      is left out as a generic filename. Rejected as a WP plugin is possible, but the cookie suggests
      a standalone service.
    corpus: nl-browser-full-sample
    support: 17
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie _taggingmk
    page:
      url: https://example.test/
      cookies:
      - name: _taggingmk
    expect: {}
  - name: global tagging_domain
    page:
      url: https://example.test/
      js_globals:
        tagging_domain: ''
    expect: {}
  - name: global varGtmTryTagging
    page:
      url: https://example.test/
      js_globals:
        varGtmTryTagging: ''
    expect: {}
