# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: jch-optimize
  name: JCH Optimize
  vendor: jch-optimize
  website: https://www.jch-optimize.net
  categories:
  - cache
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/media/com_jchoptimize/
    first_party: true
    id: path-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. JCH Optimize is a Joomla performance extension (CSS/JS combining
      and minification). Its com_jchoptimize media directory is product-specific. The cache subpaths are
      redundant with the parent path.
    corpus: nl-browser-full-sample
    support: 29
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /media/com_jchoptimize/
    page:
      url: https://example.test/
      html: <script src="/media/com_jchoptimize/x.js"></script>
    expect: {}
- id: phast
  name: Phast
  vendor: kiwi-com
  website: https://github.com/kiwicom/phast
  categories:
  - cache
  signals:
  - type: data_attr
    regex: (?i)^data\-phast\-compiled\-js\-names$
    id: data-0
  - type: data_attr
    regex: (?i)^data\-phast\-no\-defer$
    id: data-1
  - type: data_attr
    regex: (?i)^data\-phast\-original\-src$
    id: data-2
  - type: data_attr
    regex: (?i)^data\-phast\-rewritten$
    id: data-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Phast is a PHP page-optimisation library (kiwicom/phast), commonly
      used via the Phast WordPress plugin or by PageSpeed-style hosts. The data-phast-* attributes are
      unique. Globals like Promise, insertBefore, indexedDB and urlPattern are generic and were left out;
      the more specific injected-script globals (cacheMarker, resourceLoader, loadFiltered, hasCurrentScript,
      didSetTimeout) are probably Phas
    corpus: nl-browser-full-sample
    support: 28
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-phast-compiled-js-names
    page:
      url: https://example.test/
      html: <div data-phast-compiled-js-names="1"></div>
    expect: {}
  - name: data data-phast-no-defer
    page:
      url: https://example.test/
      html: <div data-phast-no-defer="1"></div>
    expect: {}
  - name: data data-phast-original-src
    page:
      url: https://example.test/
      html: <div data-phast-original-src="1"></div>
    expect: {}
  - name: data data-phast-rewritten
    page:
      url: https://example.test/
      html: <div data-phast-rewritten="1"></div>
    expect: {}
