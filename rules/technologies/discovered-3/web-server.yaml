- id: phusion-passenger
  name: Phusion Passenger
  vendor: phusion
  website: https://www.phusionpassenger.com
  categories:
  - web-server
  signals:
  - type: header
    key: x-powered-by
    regex: (?i)^\s*phusion\s+passenger
    id: header-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Passenger is an app server for Ruby/Node/Python that integrates
      with nginx or Apache. The header is specific to it, and 698 sites is solid support. Server header
      normalised to 'nginx phusion' comes from 'nginx/x + Phusion Passenger x'. It signals Passenger is
      deployed with nginx (Ruby/Node/Python apps). Co-occurs with nginx at 100%, but the Passenger component
      is a distinct product.
    corpus: nl-browser-full-sample
    support: 25
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: header x-powered-by=phusion passenger
    page:
      url: https://example.test/
      headers:
      - - x-powered-by
        - phusion passenger
    expect: {}
- id: sw-cp-server
