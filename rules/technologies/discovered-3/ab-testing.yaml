# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: intelligems
  name: Intelligems
  vendor: intelligems
  website: https://www.intelligems.io
  categories:
  - ab-testing
  signals:
  - type: cookie
    regex: (?i)^ig\-location$
    id: cookie-0
  - type: resource_url
    contains: //api.intelligems.io/
    id: host-1
  - type: resource_url
    contains: //cdn.intelligems.io/
    id: host-2
  - type: storage
    regex: (?i)^ig\-id$
    id: storage-3
  - type: storage
    regex: (?i)^ig\-vars$
    id: storage-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Intelligems is a Shopify A/B testing and pricing optimisation
      app. The _template global and data-em-disable are generic or Shopify-related and are left out.
    corpus: nl-browser-full-sample
    support: 12
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie ig-location
    page:
      url: https://example.test/
      cookies:
      - name: ig-location
    expect: {}
  - name: host api.intelligems.io
    page:
      url: https://example.test/
      html: <script src="https://api.intelligems.io/x.js"></script>
    expect: {}
  - name: host cdn.intelligems.io
    page:
      url: https://example.test/
      html: <script src="https://cdn.intelligems.io/x.js"></script>
    expect: {}
  - name: storage ig-id
    page:
      url: https://example.test/
      storage:
      - key: ig-id
    expect: {}
  - name: storage ig-vars
    page:
      url: https://example.test/
      storage:
      - key: ig-vars
    expect: {}
