      js_globals:
        $pagesense: ''
    expect: {}
  - name: global _zps
    page:
      url: https://example.test/
      js_globals:
        _zps: ''
    expect: {}
  - name: global pagesense
    page:
      url: https://example.test/
      js_globals:
        pagesense: ''
    expect: {}
  - name: host cdn-eu.pagesense.io
    page:
      url: https://example.test/
      html: <script src="https://cdn-eu.pagesense.io/x.js"></script>
    expect: {}
  - name: host pagesense-collect.zoho.eu
