- id: zoho-pagesense
  name: Zoho PageSense
  vendor: zoho
  website: https://www.zoho.com/pagesense/
  categories:
  - ab-testing
  signals:
  - type: cookie
    regex: (?i)^zfccn$
    id: cookie-0
  - type: cookie
    regex: (?i)^zft\-sdc$
    id: cookie-1
  - type: cookie
    regex: (?i)^zps\-tgr\-dts$
    id: cookie-2
  - type: js_global
    key: $pagesense
    id: global-3
  - type: js_global
    key: _zps
    id: global-4
  - type: js_global
    key: pagesense
    id: global-5
  - type: resource_url
    contains: //cdn-eu.pagesense.io/
    id: host-6
  - type: resource_url
    contains: //pagesense-collect.zoho.eu/
    id: host-7
  - type: storage
    regex: (?i)^zps\-ft\-details$
    id: storage-8
  - type: storage
    regex: (?i)^zps\-ft\-pghittype\-details$
    id: storage-9
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. Zoho PageSense (A/B testing, analytics). Tokens co-occur
      with google-tag only because sites also use GTM. Omitted generic tokens: optimize, localZepto, zs*,
      zabuserid. The hostdir token duplicates the cdn-eu.pagesense.io host, so only the hosts are listed
      as signals. Other PageSense regions probably use cdn.pagesense.io, but those hosts are not in this
      candidate.'
    corpus: nl-browser-full-sample
    support: 17
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie zfccn
    page:
      url: https://example.test/
      cookies:
      - name: zfccn
    expect: {}
  - name: cookie zft-sdc
