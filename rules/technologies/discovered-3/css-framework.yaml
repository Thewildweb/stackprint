- id: unify-bootstrap-template
  name: Unify Bootstrap Template
  vendor: htmlstream
  website: https://htmlstream.com/preview/unify/
  categories:
  - css-framework
  signals:
  - type: comment
    regex: (?i)^\s*css\s+global\s+compulsory
    id: comment-0
  - type: comment
    regex: (?i)^\s*css\s+implementing\s+plugins
    id: comment-1
  - type: comment
    regex: (?i)^\s*js\s+global\s+compulsory
    id: comment-2
  - type: comment
    regex: (?i)^\s*js\s+implementing\s+plugins
    id: comment-3
  - type: resource_url
    regex: (?i)/line\-icons\.css(?:[?#]|$)
    id: file-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. These comments and files match the Unify Bootstrap template
      by Htmlstream (v1.x/1.9), a commonly reused theme. It is a bundle of Bootstrap, jQuery and plugins,
      so it is only weakly identified by these tokens; the comment tokens (not the generic jquery/owl
      ones) are the most reliable. The category css-framework is the closest fit; a template is not strictly
      a framework.
    corpus: nl-browser-full-sample
    support: 26
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: comment css global compulsory
    page:
      url: https://example.test/
      html: <!-- css global compulsory -->
    expect: {}
  - name: comment css implementing plugins
    page:
      url: https://example.test/
