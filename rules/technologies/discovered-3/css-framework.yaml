  vendor: okler
  website: https://themeforest.net/item/porto-responsive-html5-template/4106987
  categories:
  - css-framework
  signals:
  - type: comment
    regex: (?i)^\s*theme\s+initialization\s+files
    id: comment-0
  - type: resource_url
    regex: (?i)/theme\-blog\.css(?:[?#]|$)
    id: file-1
  - type: resource_url
    regex: (?i)/theme\-elements\.css(?:[?#]|$)
    id: file-2
  - type: resource_url
    regex: (?i)/theme\-shop\.css(?:[?#]|$)
    id: file-3
  - type: js_global
    key: fontSpy
    id: global-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The file names theme-elements.css, theme-blog.css and theme-shop.css,
