- id: w3css
  name: W3.CSS
  vendor: w3schools
  website: https://www.w3schools.com/w3css/
  categories:
  - css-framework
  signals:
  - type: resource_url
    regex: (?i)/w[0-9]+\.css(?:[?#]|$)
    id: file-0
  - type: resource_url
    regex: (?i)//www\.w3schools\.com/w[0-9]+css/
    id: hostdir-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. W3.CSS is a W3Schools CSS framework. The host www.w3schools.com
      is excluded as a signal because it is shared with tutorials and other assets. The x-loc response
      header is unexplained and is not used. The version regex captures only the major version (4 or 5).
    corpus: nl-browser-full-sample
    support: 38
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file w#.css
    page:
      url: https://example.test/
      html: <script src="/assets/w1.css"></script>
    expect: {}
  - name: hostdir www.w3schools.com/w#css/
    page:
      url: https://example.test/
      html: <script src="https://www.w3schools.com/w1css/x.js"></script>
    expect: {}
