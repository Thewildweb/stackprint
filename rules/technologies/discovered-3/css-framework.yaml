# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: canvas-html-template
  name: Canvas HTML Template
  vendor: semicolonweb
  website: https://themeforest.net/item/canvas-the-multipurpose-html5-template/9228123
  categories:
  - css-framework
  signals:
  - type: comment
    regex: (?i)^\s*document\s+wrapper
    id: comment-0
  - type: js_global
    key: SEMICOLON
    id: global-1
  - type: js_global
    key: onScrollSliderParallax
    id: global-2
  - type: js_global
    key: sm_format_twitter
    id: global-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Tokens cluster around the Canvas multipurpose HTML template
      by SemiColonWeb (the SEMICOLON global, sm_format_twitter, onScrollSliderParallax). Generic comments
      like 'go to top' were left out as too common. The requesting/killRequesting globals were also left
      out as too generic.
    corpus: nl-browser-full-sample
    support: 39
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: comment document wrapper
    page:
      url: https://example.test/
      html: <!-- document wrapper -->
    expect: {}
  - name: global SEMICOLON
    page:
      url: https://example.test/
      js_globals:
        SEMICOLON: ''
    expect: {}
  - name: global onScrollSliderParallax
    page:
      url: https://example.test/
      js_globals:
        onScrollSliderParallax: ''
    expect: {}
  - name: global sm_format_twitter
    page:
      url: https://example.test/
      js_globals:
        sm_format_twitter: ''
    expect: {}
- id: flux-ui
  name: Flux UI
  vendor: livewire
  website: https://fluxui.dev
  categories:
  - css-framework
  signals:
  - type: resource_url
    regex: (?i)/flux\.min\.js(?:[?#]|$)
    id: file-0
  - type: resource_url
    regex: (?i)^https?://[^/]+/flux/
    first_party: true
    id: path-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Flux is the official Livewire UI component library (Laravel).
      It co-occurs ~99% with Livewire, as it requires it. Distinct product from Livewire itself, so proposed
      as a new technology rather than being folded into npm/livewire.
    corpus: nl-browser-full-sample
    support: 13
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file flux.min.js
    page:
      url: https://example.test/
      html: <script src="/assets/flux.min.js"></script>
    expect: {}
  - name: path /flux/
    page:
      url: https://example.test/
      html: <script src="/flux/x.js"></script>
    expect: {}
- id: porto-html-template
