# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: medallia-digital
  name: Medallia Digital (Kampyle)
  vendor: medallia
  website: https://www.medallia.com
  categories:
  - survey
  signals:
  - type: cookie
    regex: (?i)^kampyle_userid$
    id: cookie-0
  - type: cookie
    regex: (?i)^kampyleuserpercentile$
    id: cookie-1
  - type: cookie
    regex: (?i)^kampyleusersession$
    id: cookie-2
  - type: js_global
    key: KAMPYLE_CONSTANT
    id: global-3
  - type: js_global
    key: KAMPYLE_EMBED
    id: global-4
  - type: js_global
    key: KAMPYLE_ONSITE_SDK
    id: global-5
  - type: js_global
    key: KAMPYLE_SCREEN_CAPTURE
    id: global-6
  - type: js_global
    key: MDIGITAL_ANALYTICS
    id: global-7
  - type: js_global
    key: MDIGITAL_ELEMENT_BUILDER
    id: global-8
  - type: resource_url
    contains: //analytics-fe.digital-cloud-west.medallia.com/
    id: host-9
  - type: resource_url
    contains: //resources.digital-cloud-west.medallia.com/
    id: host-10
  - type: storage
    regex: (?i)^kampyle_userid$
    id: storage-11
  - type: storage
    regex: (?i)^kampylesessionpagecounter$
    id: storage-12
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Kampyle was acquired by Medallia and is now Medallia Digital
      Experience Analytics; the generi*.js file name is too generic to use as a signal. Co-occurrence
      with google-tag is incidental, since the Kampyle snippet is typically deployed via a tag manager.
      Medallia Digital (formerly Kampyle/Medallia Experience Cloud) feedback survey embed; the west-region
      cloud hosts. Other regions would use differe
    corpus: nl-browser-full-sample
    support: 25
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie kampyle_userid
    page:
      url: https://example.test/
      cookies:
      - name: kampyle_userid
    expect: {}
  - name: cookie kampyleuserpercentile
    page:
      url: https://example.test/
      cookies:
      - name: kampyleuserpercentile
    expect: {}
  - name: cookie kampyleusersession
    page:
      url: https://example.test/
      cookies:
      - name: kampyleusersession
    expect: {}
  - name: global KAMPYLE_CONSTANT
    page:
      url: https://example.test/
      js_globals:
        KAMPYLE_CONSTANT: ''
    expect: {}
  - name: global KAMPYLE_EMBED
    page:
      url: https://example.test/
      js_globals:
        KAMPYLE_EMBED: ''
    expect: {}
  - name: global KAMPYLE_ONSITE_SDK
    page:
      url: https://example.test/
      js_globals:
        KAMPYLE_ONSITE_SDK: ''
    expect: {}
  - name: global KAMPYLE_SCREEN_CAPTURE
    page:
      url: https://example.test/
      js_globals:
        KAMPYLE_SCREEN_CAPTURE: ''
    expect: {}
  - name: global MDIGITAL_ANALYTICS
    page:
      url: https://example.test/
      js_globals:
        MDIGITAL_ANALYTICS: ''
    expect: {}
  - name: global MDIGITAL_ELEMENT_BUILDER
    page:
      url: https://example.test/
      js_globals:
        MDIGITAL_ELEMENT_BUILDER: ''
    expect: {}
  - name: host analytics-fe.digital-cloud-west.medallia.com
    page:
      url: https://example.test/
      html: <script src="https://analytics-fe.digital-cloud-west.medallia.com/x.js"></script>
    expect: {}
  - name: host resources.digital-cloud-west.medallia.com
    page:
      url: https://example.test/
      html: <script src="https://resources.digital-cloud-west.medallia.com/x.js"></script>
    expect: {}
  - name: storage kampyle_userid
    page:
      url: https://example.test/
      storage:
      - key: kampyle_userid
    expect: {}
  - name: storage kampylesessionpagecounter
    page:
      url: https://example.test/
      storage:
      - key: kampylesessionpagecounter
    expect: {}
- id: qualtrics-website-feedback
  name: Qualtrics Website Feedback
  vendor: qualtrics
  website: https://www.qualtrics.com
  categories:
  - survey
  signals:
  - type: js_global
    key: WAFQualtricsWebpackJsonP-cloud-2.56.0-0
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. WAF = Website App Feedback, the Qualtrics intercept snippet.
      The global name embeds a build version (cloud-2.56.0-0), so exact-match may drift across releases.
      A prefix match on WAFQualtricsWebpackJsonP would be more robust. Only the listed token is used as
      a signal here.
    corpus: nl-browser-full-sample
    support: 9
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global WAFQualtricsWebpackJsonP-cloud-2.56.0-0
    page:
      url: https://example.test/
      js_globals:
        WAFQualtricsWebpackJsonP-cloud-2.56.0-0: ''
    expect: {}
