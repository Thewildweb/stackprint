- id: npm/boxicons
  name: Boxicons
  vendor: atisawd
  website: https://boxicons.com
  categories:
  - font
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/assets/vendor/boxicons/css/
    first_party: true
    id: path-0
  - type: resource_url
    regex: (?i)^https?://[^/]+/assets/vendor/boxicons/fonts/
    first_party: true
    id: path-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Boxicons is an npm package (boxicons). The paths are first-party
      copies commonly seen in BootstrapMade templates; co-occurrence with Bootstrap is due to those templates.
      The path is fairly specific to the library name.
    corpus: nl-browser-full-sample
    support: 24
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /assets/vendor/boxicons/css/
    page:
      url: https://example.test/
      html: <script src="/assets/vendor/boxicons/css/x.js"></script>
    expect: {}
  - name: path /assets/vendor/boxicons/fonts/
    page:
      url: https://example.test/
      html: <script src="/assets/vendor/boxicons/fonts/x.js"></script>
    expect: {}
