- id: fontshare
  name: Fontshare
  vendor: indian-type-foundry
  website: https://www.fontshare.com
  categories:
  - font
  signals:
  - type: resource_url
    contains: //api.fontshare.com/
    id: host-0
  - type: resource_url
    contains: //cdn.fontshare.com/
    id: host-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Fontshare is a free font service by Indian Type Foundry. The
      hostdir tokens are redundant with the host tokens, so only the hosts are used.
    corpus: nl-browser-full-sample
    support: 30
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host api.fontshare.com
    page:
      url: https://example.test/
      html: <script src="https://api.fontshare.com/x.js"></script>
    expect: {}
  - name: host cdn.fontshare.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.fontshare.com/x.js"></script>
    expect: {}
