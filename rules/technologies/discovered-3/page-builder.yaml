# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: ecomposer
  name: EComposer
  vendor: ecomposer
  website: https://ecomposer.io
  categories:
  - page-builder
  signals:
  - type: comment
    regex: (?i)^\s*ecomposer\s+config\s+script
    id: comment-0
  - type: resource_url
    regex: (?i)/ecom\-swiper@[0-9]+\.[0-9]+\.[0-9]+\.js(?:[?#]|$)
    id: file-1
  - type: resource_url
    regex: (?i)/ecom_modal\.js(?:[?#]|$)
    id: file-2
  - type: resource_url
    regex: (?i)/ecom_popup\.js(?:[?#]|$)
    id: file-3
  - type: resource_url
    contains: //cdn.ecomposer.app/
    id: host-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. EComposer is a Shopify page builder app. Tokens co-occur with
      Shopify only because it runs on Shopify. Generic comments such as 'global css' and 'dns prefetch
      preconnect' were left out as too generic.
    corpus: nl-browser-full-sample
    support: 12
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: comment ecomposer config script
    page:
      url: https://example.test/
      html: <!-- ecomposer config script -->
    expect: {}
  - name: file ecom-swiper@#.#.#.js
    page:
      url: https://example.test/
      html: <script src="/assets/ecom-swiper@1.1.1.js"></script>
    expect: {}
  - name: file ecom_modal.js
    page:
      url: https://example.test/
      html: <script src="/assets/ecom_modal.js"></script>
    expect: {}
  - name: file ecom_popup.js
    page:
      url: https://example.test/
      html: <script src="/assets/ecom_popup.js"></script>
    expect: {}
  - name: host cdn.ecomposer.app
    page:
      url: https://example.test/
      html: <script src="https://cdn.ecomposer.app/x.js"></script>
    expect: {}
- id: pagefly-shopify
  name: PageFly Page Builder (Shopify)
  vendor: pagefly
  website: https://pagefly.io
  categories:
  - page-builder
  signals:
  - type: js_global
    key: _pf_convertSchemaToHtml
    id: global-0
  - type: js_global
    key: _pf_getOriginalSrc
    id: global-1
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. The existing rule ''pagefly'' (PageFly) likely covers
      this; the _pf_ prefix matches PageFly''s Shopify page builder. Should be merged into existing_tech_id
      pagefly. The existing rule ''pagefly'' (PageFly) is already in the rule set, so this global most
      likely belongs to it. Verdict should be existing: pagefly. The _pf_ prefix is PageFly''s, co-occurring
      only with Shopify.'
    corpus: nl-browser-full-sample
    support: 17
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global _pf_convertSchemaToHtml
    page:
      url: https://example.test/
      js_globals:
        _pf_convertSchemaToHtml: ''
    expect: {}
  - name: global _pf_getOriginalSrc
    page:
      url: https://example.test/
      js_globals:
        _pf_getOriginalSrc: ''
    expect: {}
