# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: domainrecover
  name: DomainRecover
  vendor: domainrecover
  website: https://domainrecover.com
  categories:
  - domain-parking
  signals:
  - type: js_global
    key: url_checkin
    id: global-0
  - type: js_global
    key: url_stat_server
    id: global-1
  - type: js_global
    key: url_whoami
    id: global-2
  - type: resource_url
    contains: //bid-api-h3.domainrecover.com/
    id: host-3
  - type: resource_url
    contains: //stat-api.domainrecover.com/
    id: host-4
  - type: resource_url
    contains: //stat.domainrecover.com/
    id: host-5
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Domain-for-sale/recovery landing pages loading domainrecover.com
      APIs across ~406 sites. Category chosen as domain-parking. The 'nui' cookie and obfuscated globals
      (_0x...) are generic or unreliable, so they are omitted.
    corpus: nl-browser-full-sample
    support: 17
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global url_checkin
    page:
      url: https://example.test/
      js_globals:
        url_checkin: ''
    expect: {}
  - name: global url_stat_server
    page:
      url: https://example.test/
      js_globals:
        url_stat_server: ''
    expect: {}
  - name: global url_whoami
    page:
      url: https://example.test/
      js_globals:
        url_whoami: ''
    expect: {}
  - name: host bid-api-h3.domainrecover.com
    page:
      url: https://example.test/
      html: <script src="https://bid-api-h3.domainrecover.com/x.js"></script>
    expect: {}
  - name: host stat-api.domainrecover.com
    page:
      url: https://example.test/
      html: <script src="https://stat-api.domainrecover.com/x.js"></script>
    expect: {}
  - name: host stat.domainrecover.com
    page:
      url: https://example.test/
      html: <script src="https://stat.domainrecover.com/x.js"></script>
    expect: {}
