# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: leaseweb-mailfilter
  name: Leaseweb Mail Filter
  vendor: leaseweb
  website: https://www.leaseweb.com
  categories:
  - email-security
  signals:
  - type: dns
    key: MX
    regex: (?:^|[ .])mailfilter1\.leaseweb\.com$
    id: dns-0
  - type: dns
    key: MX
    regex: (?:^|[ .])mailfilter2\.leaseweb\.com$
    id: dns-1
  - type: dns
    key: MX
    regex: (?:^|[ .])mailfilter3\.leaseweb\.com$
    id: dns-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The MX records point at Leaseweb's mailfilter cluster, which
      is an email security (spam filtering) service. It is distinct from the existing leaseweb-dns rule,
      which covers nameservers. The co-occurrence with leaseweb-dns is expected because the same customers
      use both.
    corpus: nl-browser-full-sample
    support: 9
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns mx:mailfilter1.leaseweb.com
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mailfilter1.leaseweb.com
    expect: {}
  - name: dns mx:mailfilter2.leaseweb.com
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mailfilter2.leaseweb.com
    expect: {}
  - name: dns mx:mailfilter3.leaseweb.com
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mailfilter3.leaseweb.com
    expect: {}
- id: mailspamprotection
  name: MailSpamProtection (SpamExperts-based email filtering)
  vendor: mailspamprotection
  website: https://www.mailspamprotection.com
  categories:
  - email-security
  signals:
  - type: dns
    key: TXT
    contains: include:_spf.mailspamprotection.com
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. mailspamprotection.com is a white-label email spam filtering
      service (SpamExperts-style) bundled by hosts such as Hostinger/Namecheap-type resellers. Not in
      the rule set (spamexperts exists but the SPF domain is distinct). Medium confidence on the vendor
      identity.
    corpus: nl-browser-full-sample
    support: 27
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns spf-include:_spf.mailspamprotection.com
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:_spf.mailspamprotection.com ~all
    expect: {}
