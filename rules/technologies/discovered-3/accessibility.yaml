# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: accessibe
  name: accessiBe
  vendor: accessibe
  website: https://accessibe.com
  categories:
  - accessibility
  signals:
  - type: data_attr
    regex: (?i)^data\-acsb$
    id: data-0
  - type: data_attr
    regex: (?i)^data\-acsb\-sr\-only$
    id: data-1
  - type: js_global
    key: AccessiBe
    id: global-2
  - type: js_global
    key: acsb
    id: global-3
  - type: js_global
    key: acsbJS
    id: global-4
  - type: resource_url
    contains: //acsbapp.com/
    id: host-5
  - type: resource_url
    contains: //cdn.acsbapp.com/
    id: host-6
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. webpackChunkwidget and pure_* globals are generic or ambiguous,
      so they are left out. accessWidget is also omitted as it is not clearly unique.
    corpus: nl-browser-full-sample
    support: 20
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-acsb
    page:
      url: https://example.test/
      html: <div data-acsb="1"></div>
    expect: {}
  - name: data data-acsb-sr-only
    page:
      url: https://example.test/
      html: <div data-acsb-sr-only="1"></div>
    expect: {}
  - name: global AccessiBe
    page:
      url: https://example.test/
      js_globals:
        AccessiBe: ''
    expect: {}
  - name: global acsb
    page:
      url: https://example.test/
      js_globals:
        acsb: ''
    expect: {}
  - name: global acsbJS
    page:
      url: https://example.test/
      js_globals:
        acsbJS: ''
    expect: {}
  - name: host acsbapp.com
    page:
      url: https://example.test/
      html: <script src="https://acsbapp.com/x.js"></script>
    expect: {}
  - name: host cdn.acsbapp.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.acsbapp.com/x.js"></script>
    expect: {}
- id: userway
  name: UserWay
  vendor: userway
  website: https://userway.org
  categories:
  - accessibility
  signals:
  - type: resource_url
    contains: //api.userway.org/
    id: host-0
  - type: resource_url
    contains: //cdn.userway.org/
    id: host-1
  - type: resource_url
    contains: //cdn.userway.org/widgetapp/
    id: hostdir-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. UserWay accessibility overlay widget, widely recognized; tokens
      all vendor-specific. High co-occurrence with google-tag is incidental. The UserWay accessibility
      widget. The 'messageStream' global is generic and left out.
    corpus: nl-browser-full-sample
    support: 26
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host api.userway.org
    page:
      url: https://example.test/
      html: <script src="https://api.userway.org/x.js"></script>
    expect: {}
  - name: host cdn.userway.org
    page:
      url: https://example.test/
      html: <script src="https://cdn.userway.org/x.js"></script>
    expect: {}
  - name: hostdir cdn.userway.org/widgetapp/
    page:
      url: https://example.test/
      html: <script src="https://cdn.userway.org/widgetapp/x.js"></script>
    expect: {}
