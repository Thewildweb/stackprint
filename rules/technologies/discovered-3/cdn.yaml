# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: esm-sh
  name: esm.sh
  vendor: esm-sh
  website: https://esm.sh
  categories:
  - cdn
  signals:
  - type: resource_url
    contains: //esm.sh/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The sample URLs carry versions of the packages being served
      (e.g. docx@8.5.0), not the esm.sh version, so no version regex is given. The co-occurrence with
      google-fonts (0.801) looks incidental.
    corpus: nl-browser-full-sample
    support: 20
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host esm.sh
    page:
      url: https://example.test/
      html: <script src="https://esm.sh/x.js"></script>
    expect: {}
- id: f5-distributed-cloud
  name: F5 Distributed Cloud (Volterra)
  vendor: f5
  website: https://www.f5.com/cloud
  categories:
  - cdn
  signals:
  - type: header
    key: server
    regex: (?i)^\s*volt\-adc
    id: header-0
  - type: header
    key: x-volterra-location
    id: header-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. These are sub-resource response headers, so they show a third-party
      asset served via F5 Distributed Cloud. This is typically Google Tag Manager-related resources fronted
      by Volterra, which explains the high co-occurrence with google-tag. It identifies the vendor serving
      the asset, not the site's own infrastructure. Both tokens appear on the same 430 sites, which fits
      one edge platform. The high co
    corpus: nl-browser-full-sample
    support: 15
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: header server=volt-adc
    page:
      url: https://example.test/
      headers:
      - - server
        - volt-adc
    expect: {}
  - name: header x-volterra-location
    page:
      url: https://example.test/
      headers:
      - - x-volterra-location
        - '1'
    expect: {}
- id: npmcdn
  name: npmcdn (unpkg legacy domain)
  vendor: unpkg
  website: https://unpkg.com
  categories:
  - cdn
  signals:
  - type: resource_url
    contains: //npmcdn.com/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. npmcdn.com was renamed to unpkg.com and redirects there. The
      existing rule set has jspm and cdnjs but no unpkg/npmcdn rule. Version in the URL belongs to the
      loaded package, not to the CDN, so no version is extracted.
    corpus: nl-browser-full-sample
    support: 14
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host npmcdn.com
    page:
      url: https://example.test/
      html: <script src="https://npmcdn.com/x.js"></script>
    expect: {}
- id: quic-cloud
  name: QUIC.cloud CDN
  vendor: litespeed-technologies
  website: https://www.quic.cloud
  categories:
  - cdn
  signals:
  - type: header
    key: x-qc-cache
    id: header-0
  - type: header
    key: x-qc-pop
    id: header-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. x-qc-pop and x-qc-cache are QUIC.cloud (LiteSpeed's CDN) headers,
      commonly used with the LiteSpeed Cache WordPress plugin. The co-occurrence with litespeed and wordpress
      is expected.
    corpus: nl-browser-full-sample
    support: 31
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: header x-qc-cache
    page:
      url: https://example.test/
      headers:
      - - x-qc-cache
        - '1'
    expect: {}
  - name: header x-qc-pop
    page:
      url: https://example.test/
      headers:
      - - x-qc-pop
        - '1'
    expect: {}
- id: rawgit
  name: RawGit
  vendor: rawgit
  website: https://rawgit.com
  categories:
  - cdn
  signals:
  - type: resource_url
    contains: //cdn.rawgit.com/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. RawGit was a free CDN-style proxy for GitHub files and was retired
      in 2019. Sites still reference cdn.rawgit.com, so the host is a clear marker of the service. The
      0.903 co-occurrence with jQuery only reflects that the loaded libraries are jQuery plugins.
    corpus: nl-browser-full-sample
    support: 21
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host cdn.rawgit.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.rawgit.com/x.js"></script>
    expect: {}
