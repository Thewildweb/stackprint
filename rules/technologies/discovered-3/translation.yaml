# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: langify
  name: Langify
  vendor: langify
  website: https://langify-app.com
  categories:
  - translation
  signals:
  - type: data_attr
    regex: (?i)^data\-ly\-locked$
    id: data-0
  - type: js_global
    key: langify
    id: global-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Langify is a Shopify app for store translation. The tokens hostBegin,
      hostEnd, afterHost and customContents are likely part of its language-switcher configuration, but
      they are generic enough that they were left out. data-dropup is a generic Bootstrap-style attribute.
    corpus: nl-browser-full-sample
    support: 24
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-ly-locked
    page:
      url: https://example.test/
      html: <div data-ly-locked="1"></div>
    expect: {}
  - name: global langify
    page:
      url: https://example.test/
      js_globals:
        langify: ''
    expect: {}
- id: langshop
  name: Langshop
  vendor: langshop
  website: https://langshop.io
  categories:
  - translation
  signals:
  - type: js_global
    key: LangShopConfig
    id: global-0
  - type: resource_url
    contains: //cdn.langshop.app/
    id: host-1
  - type: storage
    regex: (?i)^ls\-default\-locale$
    id: storage-2
  - type: storage
    regex: (?i)^ls\-state\-session$
    id: storage-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Langshop is a Shopify translation and localization app. The
      'begin app snippet config' comment is a generic Shopify app-snippet marker, so it is left out. The
      generic ls-locale and ls-currency storage keys are also left out.
    corpus: nl-browser-full-sample
    support: 14
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global LangShopConfig
    page:
      url: https://example.test/
      js_globals:
        LangShopConfig: ''
