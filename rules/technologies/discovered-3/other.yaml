# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: home-assistant
  name: Home Assistant
  vendor: home-assistant
  website: https://www.home-assistant.io
  categories: []
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/frontend_es[0-9]+/
    first_party: true
    id: path-0
  - type: resource_url
    regex: (?i)^https?://[^/]+/frontend_latest/
    first_party: true
    id: path-1
  - type: resource_url
    regex: (?i)^https?://[^/]+/hacsfiles/
    first_party: true
    id: path-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Cluster is the Home Assistant login/authorize page (about 1,000
      self-hosted instances). The frontend_latest, frontend_es5, static/translations, polyfills and locale-data
      paths plus the latestJS/providersPromise globals are specific to its frontend. The category enum
      has no fitting value (closest is 'cms' or home automation), so it is left empty. The lit-polyfill-support.js
      and iconset.js files are
    corpus: nl-browser-full-sample
    support: 34
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /frontend_es#/
    page:
      url: https://example.test/
      html: <script src="/frontend_es1/x.js"></script>
    expect: {}
  - name: path /frontend_latest/
    page:
      url: https://example.test/
      html: <script src="/frontend_latest/x.js"></script>
    expect: {}
  - name: path /hacsfiles/
    page:
      url: https://example.test/
      html: <script src="/hacsfiles/x.js"></script>
    expect: {}
- id: porto-magento-theme
  name: Porto (Magento theme)
  vendor: smartwave
  website: https://themeforest.net/item/porto-ultimate-responsive-magento-theme/9725864
  categories: []
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/media/porto/configed_css/
    first_party: true
    id: path-0
  - type: resource_url
    regex: (?i)^https?://[^/]+/media/porto/web/css/
    first_party: true
    id: path-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The Porto paths are product-specific to the Porto Magento theme.
      The comments 'ko i#n items' and 'ko i#n my cart' are Knockout.js virtual-element comments from Magento
      core and are generic. The files type#.css and animate.optimized.css are generic. The category is
      left empty because no listed category fits a Magento theme (wp-theme is WordPress-only).
    corpus: nl-browser-full-sample
    support: 22
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /media/porto/configed_css/
    page:
      url: https://example.test/
      html: <script src="/media/porto/configed_css/x.js"></script>
    expect: {}
  - name: path /media/porto/web/css/
    page:
      url: https://example.test/
      html: <script src="/media/porto/web/css/x.js"></script>
    expect: {}
- id: wombat-web-archive
  name: Wombat (Web Archive replay)
  vendor: webrecorder
  website: https://github.com/webrecorder/wombat
  categories: []
  signals:
  - type: js_global
    key: __WB_pmw
    id: global-0
  - type: js_global
    key: _____WB$wombat$assign$function_____
    id: global-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. These globals indicate the page is an archived replay (Internet
      Archive Wayback Machine or pywb), not a live site's own technology. Category left empty because
      no category fits an archive replay tool. Co-occurrence with cloudflare is incidental.
    corpus: nl-browser-full-sample
    support: 27
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global __WB_pmw
    page:
      url: https://example.test/
      js_globals:
        __WB_pmw: ''
    expect: {}
  - name: global _____WB$wombat$assign$function_____
    page:
      url: https://example.test/
      js_globals:
        _____WB$wombat$assign$function_____: ''
    expect: {}
