# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: enter-system-mail
  name: Enter System Mail
  vendor: enter-system
  website: https://www.enter-system.com
  categories:
  - email-provider
  signals:
  - type: dns
    key: MX
    regex: (?:^|[ .])mailme\-backup\.enter\-system\.com$
    id: dns-0
  - type: dns
    key: MX
    regex: (?:^|[ .])mailme\.enter\-system\.com$
    id: dns-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The existing rule 'enter-system' is a hosting entry for the
      same vendor, but the MX tokens are a mail-hosting signal and are submitted as a separate email-provider
      technology. They could instead be merged into the hosting rule. The best_label npm/jquery.easing
      with 0.991 precision is a spurious co-occurrence, probably from a shared website platform.
    corpus: nl-browser-full-sample
    support: 19
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns mx:mailme-backup.enter-system.com
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mailme-backup.enter-system.com
    expect: {}
  - name: dns mx:mailme.enter-system.com
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mailme.enter-system.com
    expect: {}
- id: infomaniak-mail
  name: Infomaniak Mail
  vendor: infomaniak
  website: https://www.infomaniak.com
  categories:
  - email-provider
  signals:
  - type: dns
    key: MX
    regex: (?:^|[ .])mta\-gw\.infomaniak\.ch$
    id: dns-0
  - type: dns
    key: TXT
    contains: include:spf.infomaniak.ch
    id: dns-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The existing infomaniak-dns and infomaniak (hosting) rules cover
      other Infomaniak services. No Infomaniak email rule is in the rule set, so this is added as a separate
      email-provider technology. Existing rules include infomaniak (hosting) and infomaniak-dns, but none
      for email; the SPF include is Infomaniak's mail infrastructure, so a distinct email-provider entry
      fits.
    corpus: nl-browser-full-sample
    support: 29
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns mx:mta-gw.infomaniak.ch
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mta-gw.infomaniak.ch
    expect: {}
  - name: dns spf-include:spf.infomaniak.ch
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:spf.infomaniak.ch ~all
    expect: {}
