# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: google-cast-sender
  name: Google Cast Sender SDK
  vendor: google
  website: https://developers.google.com/cast
  categories:
  - video
  signals:
  - type: js_global
    key: __onGCastApiAvailable
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The global is the documented Cast sender API-available callback.
      The co-occurrence with google-tag is incidental, since Cast is commonly embedded in video players
      (YouTube embeds, JW Player, etc.).
    corpus: nl-browser-full-sample
    support: 13
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global __onGCastApiAvailable
    page:
      url: https://example.test/
      js_globals:
        __onGCastApiAvailable: ''
    expect: {}
- id: iplayerhd
  name: iPlayerHD
  vendor: iplayerhd
  website: https://iplayerhd.com
  categories:
  - video
  signals:
  - type: resource_url
    contains: //iplayerhd.com/
    id: host-0
  - type: resource_url
    contains: //iplayerhd.com/player/
    id: hostdir-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. iPlayerHD is a video hosting/player platform with a Wix integration;
      the correlation with React is incidental (Wix sites).
    corpus: nl-browser-full-sample
    support: 10
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
