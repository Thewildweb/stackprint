  - name: hostdir iplayerhd.com/player/
    page:
      url: https://example.test/
      html: <script src="https://iplayerhd.com/player/x.js"></script>
    expect: {}
- id: jitsi-meet
  name: Jitsi Meet
  vendor: jitsi
  website: https://jitsi.org
  categories:
  - video
  signals:
  - type: resource_url
    regex: (?i)/external_api\.js(?:[?#]|$)
    id: file-0
  - type: js_global
    key: JitsiMeetExternalAPI
    id: global-1
  - type: js_global
    key: JitsiMeetJS
    id: global-2
  - type: resource_url
    contains: //meet.jit.si/
    id: host-3
  - type: resource_header
    key: x-jitsi-region
    id: reshdr-4
  - type: resource_header
    key: x-jitsi-release
    id: reshdr-5
  - type: resource_header
    key: x-jitsi-shard
    id: reshdr-6
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The tokens evo_general_params (a WordPress theme/plugin global)
      and x-proxy-host/x-proxy-region are unrelated or generic, so they are left out. The high WordPress
      co-occurrence is explained by the Jitsi embed WP plugin or users embedding the widget in WordPress
      sites.
    corpus: nl-browser-full-sample
    support: 33
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file external_api.js
    page:
      url: https://example.test/
      html: <script src="/assets/external_api.js"></script>
    expect: {}
  - name: global JitsiMeetExternalAPI
    page:
      url: https://example.test/
      js_globals:
        JitsiMeetExternalAPI: ''
    expect: {}
  - name: global JitsiMeetJS
    page:
      url: https://example.test/
      js_globals:
        JitsiMeetJS: ''
    expect: {}
  - name: host meet.jit.si
    page:
      url: https://example.test/
      html: <script src="https://meet.jit.si/x.js"></script>
    expect: {}
  - name: reshdr x-jitsi-region
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-jitsi-region
          - '1'
    expect: {}
  - name: reshdr x-jitsi-release
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-jitsi-release
          - '1'
    expect: {}
  - name: reshdr x-jitsi-shard
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-jitsi-shard
          - '1'
    expect: {}
