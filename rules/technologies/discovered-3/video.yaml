- id: npm/react-player
  name: ReactPlayer
  vendor: cookpete
  website: https://github.com/cookpete/react-player
  categories:
  - video
  signals:
  - type: js_global
    key: ReactPlayer
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The progallery_* chunk files belong to Wix Pro Gallery, which
      Wix already covers, so I left them out. The ReactPlayer global shows up mostly on Wix sites via
      the Pro Gallery's video player, but the library is a real npm package and the global is a distinctive
      name.
    corpus: nl-browser-full-sample
    support: 27
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global ReactPlayer
    page:
      url: https://example.test/
      js_globals:
        ReactPlayer: ''
    expect: {}
