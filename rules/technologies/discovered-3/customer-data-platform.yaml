# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: elevar
  name: Elevar
  vendor: elevar
  website: https://www.getelevar.com
  categories:
  - customer-data-platform
  signals:
  - type: resource_url
    contains: //shopify-gtm-suite.getelevar.com/
    id: host-0
  - type: resource_url
    regex: (?i)^https?://[^/]+/a/elevar/static/
    first_party: true
    id: path-1
  - type: storage
    regex: (?i)^___elevar_gtm_suite\-\-lastdlpushtimestamp$
    id: storage-2
  - type: storage
    regex: (?i)^___elevar_gtm_suite\-\-sessionid$
    id: storage-3
  - type: storage
    regex: (?i)^___elevar_gtm_suite\-\-userid$
    id: storage-4
  - id: version-url
    type: resource_url
    regex: /getelevar/([0-9.]+)/
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Elevar is a Shopify server-side tracking / data layer app for
      GTM. Skipped the generic global configUrl.
    corpus: nl-browser-full-sample
    support: 13
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host shopify-gtm-suite.getelevar.com
    page:
      url: https://example.test/
      html: <script src="https://shopify-gtm-suite.getelevar.com/x.js"></script>
    expect: {}
  - name: path /a/elevar/static/
    page:
      url: https://example.test/
      html: <script src="/a/elevar/static/x.js"></script>
    expect: {}
  - name: storage ___elevar_gtm_suite--lastdlpushtimestamp
    page:
      url: https://example.test/
      storage:
      - key: ___elevar_gtm_suite--lastdlpushtimestamp
    expect: {}
  - name: storage ___elevar_gtm_suite--sessionid
    page:
      url: https://example.test/
      storage:
      - key: ___elevar_gtm_suite--sessionid
    expect: {}
  - name: storage ___elevar_gtm_suite--userid
    page:
      url: https://example.test/
      storage:
      - key: ___elevar_gtm_suite--userid
    expect: {}
- id: npm/@segment/analytics-next
  name: Segment Analytics.js (analytics-next)
  vendor: twilio-segment
  website: https://segment.com
  categories:
  - customer-data-platform
  signals:
  - type: js_global
    key: AnalyticsNext
    id: global-0
  - type: js_global
    key: __SEGMENT_INSPECTOR__
    id: global-1
  - type: js_global
    key: analyticsWriteKey
    id: global-2
  - type: js_global
    key: webpackChunk_segment_analytics_next
    id: global-3
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. All four globals come from Segment''s Analytics.js 2.0
      (@segment/analytics-next). The high co-occurrence with google-tag is incidental: sites that use
      Segment also tend to load gtag.'
    corpus: nl-browser-full-sample
    support: 32
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global AnalyticsNext
    page:
      url: https://example.test/
      js_globals:
        AnalyticsNext: ''
    expect: {}
  - name: global __SEGMENT_INSPECTOR__
    page:
      url: https://example.test/
      js_globals:
        __SEGMENT_INSPECTOR__: ''
    expect: {}
  - name: global analyticsWriteKey
    page:
      url: https://example.test/
      js_globals:
        analyticsWriteKey: ''
    expect: {}
  - name: global webpackChunk_segment_analytics_next
    page:
      url: https://example.test/
      js_globals:
        webpackChunk_segment_analytics_next: ''
    expect: {}
- id: rudderstack
  name: RudderStack
  vendor: rudderstack
  website: https://www.rudderstack.com
  categories:
  - customer-data-platform
  signals:
  - type: cookie
    regex: (?i)^rl_anonymous_id$
    id: cookie-0
  - type: cookie
    regex: (?i)^rl_page_init_referrer$
    id: cookie-1
  - type: cookie
    regex: (?i)^rl_session$
    id: cookie-2
  - type: js_global
    key: rudderanalytics
    id: global-3
  - type: resource_url
    contains: //api.rudderstack.com/
    id: host-4
  - type: resource_url
    contains: //cdn.rudderlabs.com/
    id: host-5
  - id: version-url
    type: resource_url
    regex: cdn\.rudderlabs\.com/(\d+\.\d+\.\d+)/
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. RudderStack JavaScript SDK (rudder-analytics). The rsa-plugins-*
      file names are SDK plugin chunks; sdkBaseUrl is fairly generic so lower weight.
    corpus: nl-browser-full-sample
    support: 19
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie rl_anonymous_id
    page:
      url: https://example.test/
      cookies:
      - name: rl_anonymous_id
    expect: {}
  - name: cookie rl_page_init_referrer
    page:
      url: https://example.test/
      cookies:
      - name: rl_page_init_referrer
    expect: {}
  - name: cookie rl_session
    page:
      url: https://example.test/
      cookies:
