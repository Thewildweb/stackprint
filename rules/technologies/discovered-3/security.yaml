# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: 1password
  name: 1Password
  vendor: 1password
  website: https://1password.com
  categories:
  - security
  signals:
  - type: dns
    key: TXT
    prefix: 1password-site-verification=
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The co-occurrence with microsoft-365 is incidental, since many
      businesses use both. The TXT record shows the domain owner uses 1Password; it does not show anything
      about the site itself.
    corpus: nl-browser-full-sample
    support: 27
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns txt:1password-site-verification
    page:
      url: https://example.test/
      dns:
        TXT:
        - 1password-site-verification=abc
    expect: {}
- id: anubis
  name: Anubis
  vendor: techaro
  website: https://anubis.techaro.lol
  categories:
  - security
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/\.within\.website/x/
    first_party: true
    id: path-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Anubis is an AI-scraper protection proof-of-work proxy. The
      path is unique to it, but only one token was observed and no sample URLs, so the identification
      rests on my knowledge of the product.
    corpus: nl-browser-full-sample
    support: 11
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /.within.website/x/
    page:
      url: https://example.test/
      html: <script src="/.within.website/x/x.js"></script>
    expect: {}
- id: blockify-fraud-filter
  name: Blockify Fraud Filter (Shopify app)
  vendor: blockify
  website: https://blockifyapp.com
  categories:
  - security
  signals:
  - type: cookie
    regex: (?i)^__blockify::analyzer$
    id: cookie-0
  - type: cookie
    regex: (?i)^__blockify::first\-access\-url$
    id: cookie-1
  - type: cookie
    regex: (?i)^__blockify::fpinfo$
    id: cookie-2
  - type: resource_url
    contains: //fraud.blockifyapp.com/
    id: host-3
  - type: storage
    regex: (?i)^__blockify::fpinfo$
    id: storage-4
  - type: storage
    regex: (?i)^__blockify::overlay_shown$
    id: storage-5
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Blockify is a Shopify app for IP/country blocking and fraud
      filtering. The Cloudflare Radar host (ip-check-perf.radar.cloudflare.com) is a shared third-party
      service and is excluded from the signals.
    corpus: nl-browser-full-sample
    support: 25
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie __blockify::analyzer
    page:
      url: https://example.test/
      cookies:
      - name: __blockify::analyzer
    expect: {}
  - name: cookie __blockify::first-access-url
    page:
      url: https://example.test/
      cookies:
      - name: __blockify::first-access-url
    expect: {}
  - name: cookie __blockify::fpinfo
    page:
      url: https://example.test/
      cookies:
      - name: __blockify::fpinfo
    expect: {}
  - name: host fraud.blockifyapp.com
    page:
      url: https://example.test/
      html: <script src="https://fraud.blockifyapp.com/x.js"></script>
    expect: {}
  - name: storage __blockify::fpinfo
    page:
      url: https://example.test/
      storage:
      - key: __blockify::fpinfo
    expect: {}
  - name: storage __blockify::overlay_shown
    page:
      url: https://example.test/
      storage:
      - key: __blockify::overlay_shown
    expect: {}
