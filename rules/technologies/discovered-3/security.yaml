- id: sucuri
  name: Sucuri Website Firewall
  vendor: sucuri
  website: https://sucuri.net
  categories:
  - security
  signals:
  - type: resource_header
    key: x-sucuri-cache
    id: reshdr-0
  - type: resource_header
    key: x-sucuri-id
    id: reshdr-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. These are reshdr tokens, meaning a sub-resource loaded by the
      page carried them. They show the asset host sits behind Sucuri, which is likely but not certain
      to be the site's own proxy. Header names are unique to Sucuri, so identification is clear. The co-occurrence
      with npm/jquery is probably because jQuery is loaded from a Sucuri-fronted host or the sites commonly
      use jQuery. Treat as a sub-reso
    corpus: nl-browser-full-sample
    support: 34
    mined_run: review-2026-11-3
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-sucuri-cache
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-sucuri-cache
          - '1'
    expect: {}
  - name: reshdr x-sucuri-id
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-sucuri-id
          - '1'
    expect: {}
