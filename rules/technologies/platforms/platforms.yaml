- id: php
  name: PHP
  vendor: php-group
  website: https://www.php.net
  categories: [programming-language]
  identifiers:
    cpe: ["cpe:2.3:a:php:php"]
  signals:
    - id: powered-by
      type: header
      key: x-powered-by
      regex: '^PHP(?:/([0-9]+\.[0-9]+(?:\.[0-9]+)?))?'
      version: '\1'
      version_confidence: high
    - id: session-cookie
      type: cookie
      key: PHPSESSID
      confidence: 80
  provenance:
    method: convention
    basis: PHP announces itself in X-Powered-By (expose_php) and names its default session cookie PHPSESSID.
  tests:
    - name: powered-by header
      page:
        url: https://example.test/
        headers: [["X-Powered-By", "PHP/8.2.18"]]
      expect: {version: 8.2.18}

- id: nginx
  name: Nginx
  vendor: f5
  website: https://nginx.org
  categories: [web-server, reverse-proxy]
  identifiers:
    cpe: ["cpe:2.3:a:f5:nginx"]
  signals:
    - id: server
      type: header
      key: server
      regex: '^nginx(?:/([0-9]+\.[0-9]+\.[0-9]+))?'
      version: '\1'
      version_confidence: high
  provenance:
    method: convention
    basis: 'Nginx sends "Server: nginx[/<version>]" by default.'
  tests:
    - name: server with version
      page:
        url: https://example.test/
        headers: [["Server", "nginx/1.24.0"]]
      expect: {version: 1.24.0}

