# SAP products, curated. Signals carry a confidence: 100 = strong evidence on its own,
# below 80 = weak (e.g. a bare 'sap' host label, a Gigya preconnect); weak signals add up.
# cert_host values are the part of a certificate host name below the registrable domain.
- id: sap-erp
  name: SAP ERP (ECC, S/4HANA, BW)
  vendor: sap
  website: https://www.sap.com/products/erp.html
  categories:
  - erp
  signals:
  - type: cert_host
    regex: (?:^|\.)sap(?:[0-9]+|-[a-z0-9_-]+)(?:\.|$)
    confidence: 100
    id: ct-sap-n
  - type: cert_host
    regex: (?:^|\.)[a-z0-9_-]+-sap(?:-[a-z0-9_-]+)?(?:\.|$)
    confidence: 100
    id: ct-x-sap
  - type: cert_host
    regex: (?:^|\.)sap(?:prd|prod|qas|dev|tst|test|acc|ecc|erp|bw|crm|srm|gw|fiori|s4|hana|bo|mii|ewm|ep|cloud|sf|connect|portal|login|sso|app|apps|router|wd|wdisp|webdisp|web|gui|jam|cdc|cpi|btp|api|grc|gts|bi|isu|solman|sbx|sandbox|qa|uat|ers|demo|db|disp|ds|byd|bydesign)(?:prd|prod|qas|dev|tst|test|acc|ecc|erp|bw|crm|srm|gw|fiori|s4|hana|bo|mii|ewm|ep|cloud|sf|connect|portal|login|sso|app|apps|router|wd|wdisp|webdisp|web|gui|jam|cdc|cpi|btp|api|grc|gts|bi|isu|solman|sbx|sandbox|qa|uat|ers|demo|db|disp|ds|byd|bydesign|p|q|d|po|pas|aas|ci|hdb|scs|ascs|int|beta|odata|development|apac|[0-9])*(?:-[a-z0-9_-]+)?(?:\.|$)
    confidence: 100
    id: ct-sap-role
  - type: cert_host
    regex: (?:^|\.)sap(?:p|q|d|po|pi)(?:[0-9]+|-[a-z0-9_-]+)(?:\.|$)
    confidence: 100
    id: ct-sap-short
  - type: cert_host
    regex: (?:^|\.)(?:webdispatcher|solman|bw4hana)[a-z0-9_-]*(?:\.|$)
    confidence: 100
    id: ct-infra
  - type: cert_host
    regex: (?:^|\.)rise\.sap(?:\.|$)
    confidence: 100
    id: ct-rise
  - type: cert_host
    regex: (?:^|\.)sap(?:\.|$)
    confidence: 40
    id: ct-sap-bare
  provenance:
    method: manual
    basis: 'Certificate-transparency host names below an organisation''s own domain. Hand check of strong-label hits on Dutch
      company domains: SAP evidence 19 of 20, right company 17 of 20. Labels without an SAP token (s4., bw., hana.) were right
      2 of 20 and are left out; erp.* 0 of 20. A bare ''sap'' label is kept as a weak signal: on arbitrary domains it is often
      unrelated.'
    reviewed_by: llm + corpus replay; maintainer decision 2026-11-25
