    key: MX
    regex: (?:^|[ .])park\-mx\.above\.com$
    id: dns-0
  - type: dns
    key: NS
    regex: (?:^|[ .])abovedomains\.com$
    id: dns-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Above.com is a domain registrar and parking provider. Customer
      sites look like parked or low-content domains, which fits the parking category.
    corpus: nl-dns-full
    support: 91
    mined_run: review-2026-11-dns
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns mx:park-mx.above.com
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.park-mx.above.com
    expect: {}
  - name: dns ns:abovedomains.com
    page:
      url: https://example.test/
      dns:
        NS:
        - ns1.abovedomains.com
    expect: {}
