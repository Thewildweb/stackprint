# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: online-activity
  name: Online Activity (OA)
  vendor: online-activity
  website: https://onlineactivity.nl
  categories:
  - affiliate
  signals:
  - type: dns
    key: MX
    regex: (?:^|[ .])powermta\.onlineactivity\.nl$
    id: dns-0
  - type: dns
    key: TXT
    contains: include:_netblocks_ipv4.onlineactivity.nl
    id: dns-1
  - type: dns
    key: TXT
    contains: include:_netblocks_ipv6.onlineactivity.nl
    id: dns-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Online Activity is an affiliate network, and customer sites
      look like cashback and affiliate publishers. The SPF and MX records point to its mail infrastructure,
      so the tokens identify its affiliate platform. mx:cb-cron2.onlineactivity.nl is left out because
      it looks like an individual server host with low support.
    corpus: nl-dns-full
    support: 46
    mined_run: review-2026-11-dns
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns mx:powermta.onlineactivity.nl
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.powermta.onlineactivity.nl
    expect: {}
  - name: dns spf-include:_netblocks_ipv4.onlineactivity.nl
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:_netblocks_ipv4.onlineactivity.nl ~all
    expect: {}
  - name: dns spf-include:_netblocks_ipv6.onlineactivity.nl
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:_netblocks_ipv6.onlineactivity.nl ~all
    expect: {}
