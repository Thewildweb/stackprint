# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: signhost
  name: Signhost
  vendor: signhost
  website: https://www.signhost.com
  categories:
  - authentication
  signals:
  - type: dns
    key: TXT
    contains: include:spf.signhost.com
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Signhost (Dutch digital signing and identity verification, part
      of Entrust). The SPF include shows the domain uses it to send signing request emails. The category
      is a best fit; no dedicated e-signature category exists.
    corpus: nl-dns-full
    support: 79
    mined_run: review-2026-11-dns
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns spf-include:spf.signhost.com
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:spf.signhost.com ~all
    expect: {}
