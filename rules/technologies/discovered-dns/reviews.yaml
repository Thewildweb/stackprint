# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: trustpilot-invitations
  name: Trustpilot Invitations (email sending)
  vendor: trustpilot
  website: https://www.trustpilot.com
  categories:
  - reviews
  signals:
  - type: dns
    key: TXT
    contains: include:trustpilotservice.com
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Existing rule trustpilot-widget covers the front-end widget;
      this SPF include indicates the site uses Trustpilot invitation emails. Could alternatively be merged
      into trustpilot-widget, but it is a distinct DNS signal.
    corpus: nl-dns-full
    support: 404
    mined_run: review-2026-11-dns
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns spf-include:trustpilotservice.com
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:trustpilotservice.com ~all
    expect: {}
