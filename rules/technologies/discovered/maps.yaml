    contains: //cdn.osmbuildings.org/
    id: host-0
  - id: version-url
    type: resource_url
    regex: cdn\.osmbuildings\.org/(?:classic/)?(\d+(?:\.\d+)*[a-z]?)/
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The host is the official OSM Buildings CDN. The version is in
      the path for both the 4.x and classic builds. Its co-occurrence with google-fonts is probably incidental.
    corpus: browser, static
    support: 237
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host cdn.osmbuildings.org
    page:
      url: https://example.test/
      html: <script src="https://cdn.osmbuildings.org/x.js"></script>
    expect: {}
