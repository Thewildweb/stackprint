# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: google-maps
  name: Google Maps
  vendor: google
  website: https://developers.google.com/maps
  categories:
  - maps
  signals:
  - type: js_global
    key: _xdc_
    id: global-0
  - type: resource_url
    contains: //maps.google.com/
    id: host-1
  - type: resource_url
    contains: //maps.googleapis.com/
    id: host-2
  - type: resource_url
    contains: //maps.gstatic.com/
    id: host-3
  - type: resource_url
    contains: //maps.googleapis.com/$rpc/
    id: hostdir-4
  - type: resource_url
    regex: (?i)//maps\.googleapis\.com/maps\-api\-v[0-9]+/
    id: hostdir-5
  - type: resource_url
    contains: //maps.googleapis.com/maps/
    id: hostdir-6
  - type: resource_url
    contains: //maps.gstatic.com/mapfiles/
    id: hostdir-7
  - type: resource_url
    regex: (?i)//maps\.gstatic\.com/maps\-api\-v[0-9]+/
    id: hostdir-8
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The server=scaffolding on header is Google's generic frontend
      server value shared across Google services, so it is excluded. The version number 66 in the sample
      URLs is the Maps API build, not a product version, so it is not extracted. The 66/3d path segment
      in maps-api-v3 is an API build number, not a stable product version, so no version regex is given.
      Other Google Maps hosts (maps.googleapis.c
    corpus: browser, static
    support: 2048
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global _xdc_
    page:
      url: https://example.test/
      js_globals:
        _xdc_: ''
    expect: {}
  - name: host maps.google.com
    page:
      url: https://example.test/
      html: <script src="https://maps.google.com/x.js"></script>
    expect: {}
  - name: host maps.googleapis.com
    page:
      url: https://example.test/
      html: <script src="https://maps.googleapis.com/x.js"></script>
    expect: {}
  - name: host maps.gstatic.com
    page:
      url: https://example.test/
      html: <script src="https://maps.gstatic.com/x.js"></script>
    expect: {}
  - name: hostdir maps.googleapis.com/$rpc/
    page:
      url: https://example.test/
      html: <script src="https://maps.googleapis.com/$rpc/x.js"></script>
    expect: {}
  - name: hostdir maps.googleapis.com/maps-api-v#/
    page:
      url: https://example.test/
      html: <script src="https://maps.googleapis.com/maps-api-v1/x.js"></script>
    expect: {}
  - name: hostdir maps.googleapis.com/maps/
    page:
      url: https://example.test/
      html: <script src="https://maps.googleapis.com/maps/x.js"></script>
    expect: {}
  - name: hostdir maps.gstatic.com/mapfiles/
    page:
      url: https://example.test/
      html: <script src="https://maps.gstatic.com/mapfiles/x.js"></script>
    expect: {}
  - name: hostdir maps.gstatic.com/maps-api-v#/
    page:
      url: https://example.test/
      html: <script src="https://maps.gstatic.com/maps-api-v1/x.js"></script>
    expect: {}
