- id: openstreetmap
  name: OpenStreetMap
  vendor: openstreetmap-foundation
  website: https://www.openstreetmap.org
  categories:
  - maps
  signals:
  - type: resource_url
    contains: //a.tile.openstreetmap.org/
    id: host-0
  - type: resource_url
    contains: //b.tile.openstreetmap.org/
    id: host-1
  - type: resource_url
    contains: //c.tile.openstreetmap.org/
    id: host-2
  - type: resource_header
    key: x-tilerender
    id: reshdr-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Tile hosts are owned by OpenStreetMap. The x-totp headers are
      likely also from tile servers but are less clearly named, so they are omitted. Co-occurrence with
      google-fonts is incidental.
    corpus: browser, static
    support: 62
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host a.tile.openstreetmap.org
    page:
      url: https://example.test/
      html: <script src="https://a.tile.openstreetmap.org/x.js"></script>
    expect: {}
  - name: host b.tile.openstreetmap.org
    page:
      url: https://example.test/
      html: <script src="https://b.tile.openstreetmap.org/x.js"></script>
    expect: {}
  - name: host c.tile.openstreetmap.org
    page:
      url: https://example.test/
      html: <script src="https://c.tile.openstreetmap.org/x.js"></script>
    expect: {}
  - name: reshdr x-tilerender
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-tilerender
          - '1'
    expect: {}
- id: osm-buildings
  name: OSM Buildings
  vendor: osmbuildings
  website: https://osmbuildings.org
  categories:
  - maps
  signals:
