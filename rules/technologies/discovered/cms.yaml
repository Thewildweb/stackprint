- id: hubspot-cms
  name: HubSpot CMS Hub
  vendor: hubspot
  website: https://www.hubspot.com/products/cms
  categories:
  - cms
  signals:
  - type: resource_header
    key: x-hs-cache-status
    id: reshdr-0
  - type: resource_header
    key: x-hs-target-asset
    id: reshdr-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. x-hs-* headers are HubSpot-specific, but as sub-resource headers
      they show the site loads HubSpot-served assets (forms, tracking, CMS files), not necessarily that
      the site runs on HubSpot CMS. A broader 'hubspot' entry may fit better if one exists. Co-occurrence
      with google-tag is incidental.
    corpus: browser, static
    support: 193
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-hs-cache-status
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-hs-cache-status
          - '1'
    expect: {}
  - name: reshdr x-hs-target-asset
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-hs-target-asset
          - '1'
    expect: {}
