      url: https://example.test/
      html: <script src="https://webapps.group-cdn.one/cdn-one/x.js"></script>
    expect: {}
- id: jspm
  name: JSPM CDN
  vendor: jspm
  website: https://jspm.org
  categories:
  - cdn
  signals:
  - type: resource_url
    contains: //ga.jspm.io/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The ga.jspm.io host is the JSPM CDN, used with import maps.
      The x-cf*/cf-age/cf-ttl/server=cfs reshdr tokens look like a different CDN's response headers, and
      the cluster pairs them only by co-occurrence, so they were left out. They may belong to a separate
      vendor and need their own review. The fortawesome hostdir is just a package served via JSPM and
      is not a JSPM signal. Version is not tracked b
    corpus: browser, static
    support: 83
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host ga.jspm.io
    page:
      url: https://example.test/
      html: <script src="https://ga.jspm.io/x.js"></script>
    expect: {}
