# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: bootstrapcdn
  name: BootstrapCDN
  vendor: stackpath
  website: https://www.bootstrapcdn.com
  categories:
  - cdn
  signals:
  - type: resource_url
    contains: //maxcdn.bootstrapcdn.com/
    id: host-0
  - type: resource_url
    contains: //netdna.bootstrapcdn.com/
    id: host-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The host serves several libraries, so versions differ per library
      and no single product version is captured. The font-awesome hostdir is not used as a signal because
      it identifies Font Awesome, not BootstrapCDN. Font Awesome could be added as a separate technology.
      The host serves several libraries (Font Awesome in samples). The version in the URL belongs to the
      library, not the CDN, so no version
    corpus: browser, static
    support: 902
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host maxcdn.bootstrapcdn.com
    page:
      url: https://example.test/
      html: <script src="https://maxcdn.bootstrapcdn.com/x.js"></script>
    expect: {}
  - name: host netdna.bootstrapcdn.com
    page:
      url: https://example.test/
      html: <script src="https://netdna.bootstrapcdn.com/x.js"></script>
    expect: {}
- id: cloudflare-rocket-loader
  name: Cloudflare Rocket Loader
  vendor: cloudflare
  website: https://developers.cloudflare.com/speed/optimization/content/rocket-loader/
  categories:
  - cdn
  signals:
  - type: js_global
    key: __cfRLUnblockHandlers
    id: global-0
  - type: js_global
    key: __rocketLoaderEventCtor
    id: global-1
  - type: js_global
    key: __rocketLoaderLoadProgressSimulator
    id: global-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Rocket Loader is a distinct Cloudflare feature (JS deferral).
      __cfQR is the Cloudflare QR/challenge-related global, omitted as less specific. Co-occurs with Cloudflare,
      so it is a sub-feature rather than a replacement for the existing cloudflare rule.
    corpus: browser, static
    support: 53
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global __cfRLUnblockHandlers
    page:
      url: https://example.test/
      js_globals:
        __cfRLUnblockHandlers: ''
    expect: {}
  - name: global __rocketLoaderEventCtor
    page:
      url: https://example.test/
      js_globals:
        __rocketLoaderEventCtor: ''
    expect: {}
  - name: global __rocketLoaderLoadProgressSimulator
    page:
      url: https://example.test/
      js_globals:
        __rocketLoaderLoadProgressSimulator: ''
    expect: {}
- id: group-one-webapps
