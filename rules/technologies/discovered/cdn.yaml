    contains: //webapps.group-cdn.one/
    id: host-0
  - type: resource_url
    contains: //webapps.group-cdn.one/cdn-one/
    id: hostdir-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
