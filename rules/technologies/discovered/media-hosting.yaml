# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: spotify-embed
  name: Spotify Embed
  vendor: spotify
  website: https://developer.spotify.com/documentation/embeds
  categories:
  - media-hosting
  signals:
  - type: resource_url
    contains: //open.spotify.com/
    id: host-0
  - type: resource_url
    contains: //open.spotify.com/embed/
    id: hostdir-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Cookies sp_t, sp_landing, encore.scdn.co fonts and reshdr tokens
      come from the embedded Spotify iframe responses, not the host site; only the embed path is a reliable
      signal. Plain open.spotify.com links may be just hyperlinks, so the embed hostdir is the primary
      signal.
    corpus: browser, static
    support: 116
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host open.spotify.com
    page:
      url: https://example.test/
      html: <script src="https://open.spotify.com/x.js"></script>
    expect: {}
  - name: hostdir open.spotify.com/embed/
    page:
      url: https://example.test/
      html: <script src="https://open.spotify.com/embed/x.js"></script>
    expect: {}
