# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: google-sign-in
  name: Google Sign-In (Google Identity Services)
  vendor: google
  website: https://developers.google.com/identity/gsi/web
  categories:
  - authentication
  signals:
  - type: js_global
    key: _F_toggles_default_gsi
    id: global-0
  - type: js_global
    key: default_gsi
    id: global-1
  - type: resource_url
    contains: //accounts.google.com/gsi/
    id: hostdir-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The bare host accounts.google.com is also used for generic Google
      login redirects and OAuth links, so it is left out. The gsi/ directory and the gsi globals are specific
      to Sign in with Google.
    corpus: browser, static
    support: 91
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global _F_toggles_default_gsi
    page:
      url: https://example.test/
      js_globals:
        _F_toggles_default_gsi: ''
    expect: {}
  - name: global default_gsi
    page:
      url: https://example.test/
      js_globals:
        default_gsi: ''
    expect: {}
  - name: hostdir accounts.google.com/gsi/
    page:
      url: https://example.test/
      html: <script src="https://accounts.google.com/gsi/x.js"></script>
    expect: {}
