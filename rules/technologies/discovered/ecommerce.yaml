# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: lightspeed-ecom
  name: Lightspeed eCom (C-Series)
  vendor: lightspeed
  website: https://www.lightspeedhq.com/ecommerce/
  categories:
  - ecommerce
  signals:
  - type: dns
    key: CNAME
    regex: (?:^|[ .])shops\.webshopapp\.com$
    id: dns-0
  - type: resource_url
    contains: //cdn.webshopapp.com/
    id: host-1
  - type: resource_url
    contains: //cdn.webshopapp.com/shops/
    id: hostdir-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Lightspeed eCom (formerly SEOshop/Webshopapp) shops; Rain template
      comments and webshopapp.com CDN are distinctive.
    corpus: browser, static
    support: 88
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns cname:shops.webshopapp.com
    page:
      url: https://example.test/
      dns:
        CNAME:
        - x.shops.webshopapp.com
    expect: {}
  - name: host cdn.webshopapp.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.webshopapp.com/x.js"></script>
    expect: {}
  - name: hostdir cdn.webshopapp.com/shops/
    page:
      url: https://example.test/
      html: <script src="https://cdn.webshopapp.com/shops/x.js"></script>
    expect: {}
