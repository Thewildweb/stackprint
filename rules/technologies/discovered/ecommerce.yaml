- id: myonlinestore
  name: MyOnlineStore
  vendor: myonlinestore
  website: https://www.myonlinestore.com
  categories:
  - ecommerce
  signals:
  - type: dns
    key: CNAME
    regex: (?:^|[ .])stores\.myonlinestore\.com$
    id: dns-0
  - type: dns
    key: MX
    regex: (?:^|[ .])mail1\.myonlinestore\.com$
    id: dns-1
  - type: dns
    key: MX
    regex: (?:^|[ .])mail2\.myonlinestore\.com$
    id: dns-2
  - type: dns
    key: TXT
    contains: include:spf.myonlinestore.com
    id: dns-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. MyOnlineStore is a Dutch hosted e-commerce platform. The tokens
      are all on the vendor's own domain and appear on 66-73 sites. The existing labels in the cluster
      (rollbar, cloudflare-dns, GTM) are incidental co-occurrences. MyOnlineStore is a Dutch hosted e-commerce
      platform. The SPF include is vendor-owned and seen on 52 sites. It is the only token in the cluster,
      so there is no corroborating sign
    corpus: browser, static
    support: 80
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns cname:stores.myonlinestore.com
    page:
      url: https://example.test/
      dns:
        CNAME:
        - x.stores.myonlinestore.com
    expect: {}
  - name: dns mx:mail1.myonlinestore.com
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mail1.myonlinestore.com
    expect: {}
  - name: dns mx:mail2.myonlinestore.com
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mail2.myonlinestore.com
    expect: {}
  - name: dns spf-include:spf.myonlinestore.com
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:spf.myonlinestore.com ~all
    expect: {}
