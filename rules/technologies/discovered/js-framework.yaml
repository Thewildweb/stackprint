    id: global-1
  - type: js_global
    key: __TSS_START_OPTIONS__
    id: global-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The __TSR_ROUTER__ and __TSS_START_OPTIONS__ globals indicate
      TanStack Router and Start SSR. The id uses the npm scope form but the exact package (@tanstack/react-start
