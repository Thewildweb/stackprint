# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: codeigniter
  name: CodeIgniter
  vendor: codeigniter
  website: https://codeigniter.com
  categories:
  - js-framework
  signals:
  - type: cookie
    regex: (?i)^ci_session$
    id: cookie-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. CodeIgniter is a PHP backend framework; the schema has no backend
      framework category, so js-framework is the closest fit. The cookie name is customizable, but ci_session
      is the documented default. The co-occurrence with google-fonts is incidental.
    corpus: browser, static
    support: 63
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie ci_session
    page:
      url: https://example.test/
      cookies:
      - name: ci_session
    expect: {}
