- id: npm/astro
  name: Astro
  vendor: astro
  website: https://astro.build
  categories:
  - js-framework
  signals:
  - type: js_global
    key: Astro
    id: global-0
  - type: meta
    key: generator
    regex: (?i)^\s*astro
    id: meta-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Astro static site generator/framework; the generator meta tag
      is its own default output. The co-occurrence with google-fonts is incidental. Single global token
      with 47 sites; co-occurrence with Cloudflare (Pages hosting) is plausible and does not indicate
      that the token belongs to Cloudflare. Astro is published on npm as 'astro'.
    corpus: browser, static
    support: 118
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global Astro
    page:
      url: https://example.test/
      js_globals:
        Astro: ''
    expect: {}
  - name: meta generator=astro
    page:
      url: https://example.test/
      html: <meta name="generator" content="astro">
    expect: {}
