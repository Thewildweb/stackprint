- id: caddy
  name: Caddy
  vendor: caddy
  website: https://caddyserver.com
  categories:
  - web-server
  signals:
  - type: header
    key: server
    regex: (?i)^\s*caddy
    id: header-0
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. Caddy is not in the rule set. The Via header with the
      value caddy is typically emitted when Caddy proxies a request. The co-occurrence with umami is likely
      incidental because many self-hosted Umami deployments sit behind Caddy. The server=caddy header
      would be a stronger signal but is not in this candidate. Server header value is exactly the product
      name. Strong co-occurrence with lets-encrypt is '
    corpus: browser, static
    support: 142
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: header server=caddy
    page:
      url: https://example.test/
      headers:
      - - server
        - caddy
    expect: {}
