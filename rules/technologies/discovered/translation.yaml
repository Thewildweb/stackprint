# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: google-translate
  name: Google Translate
  vendor: google
  website: https://translate.google.com/
  categories:
  - translation
  signals:
  - type: js_global
    key: googleTranslateElementInit
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The co-occurrence with google-fonts is likely incidental because
      both are Google-served assets. The global is the standard documented callback for the Google Translate
      element.
    corpus: browser, static
    support: 100
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global googleTranslateElementInit
    page:
      url: https://example.test/
      js_globals:
        googleTranslateElementInit: ''
    expect: {}
- id: google-translate-widget
  name: Google Website Translator
  vendor: google
  website: https://translate.google.com/manager/website/
  categories:
  - translation
  signals:
  - type: js_global
    key: _F_toggles_default_tr
    id: global-0
  - type: resource_url
    contains: //translate.googleapis.com/
    id: host-1
  - type: resource_url
    contains: //translate.google.com/translate_a/
    id: hostdir-2
  - type: resource_url
    contains: //translate.googleapis.com/_/
    id: hostdir-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The bare host translate.google.com is left out because other
      Google features could use it; the translate_a/ hostdir is specific to the embeddable translate element.
      The widget is loaded by translate.google.com/translate_a/element.js, which then pulls the bundle
      from translate.googleapis.com. The global 'default_tr' is too generic on its own, so it is left
      out; '_F_toggles_default_tr' is kept.
    corpus: browser, static
    support: 425
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global _F_toggles_default_tr
    page:
      url: https://example.test/
      js_globals:
        _F_toggles_default_tr: ''
    expect: {}
  - name: host translate.googleapis.com
    page:
      url: https://example.test/
      html: <script src="https://translate.googleapis.com/x.js"></script>
    expect: {}
  - name: hostdir translate.google.com/translate_a/
    page:
      url: https://example.test/
      html: <script src="https://translate.google.com/translate_a/x.js"></script>
    expect: {}
  - name: hostdir translate.googleapis.com/_/
    page:
      url: https://example.test/
      html: <script src="https://translate.googleapis.com/_/x.js"></script>
    expect: {}
- id: gtranslate
  name: GTranslate
  vendor: gtranslate
  website: https://gtranslate.com
  categories:
  - translation
  signals:
  - type: data_attr
    regex: (?i)^data\-gt\-lang$
    id: data-0
  - type: data_attr
    regex: (?i)^data\-gt\-orig\-domain$
    id: data-1
  - type: data_attr
    regex: (?i)^data\-gt\-orig\-url$
    id: data-2
  - type: data_attr
    regex: (?i)^data\-gt\-widget\-id$
    id: data-3
  - type: js_global
    key: doGTranslate
    id: global-4
  - type: js_global
    key: gtranslateSettings
    id: global-5
  - type: resource_url
    contains: //cdn.gtranslate.net/
    id: host-6
  - type: resource_url
    contains: //cdn.gtranslate.net/widgets/
    id: hostdir-7
  - type: storage
    regex: (?i)^gt_autoswitch$
    id: storage-8
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. googleTranslateElementInit2 is excluded as a signal because
      it is a Google Translate callback that other integrations could also define, though it appears alongside
      GTranslate here. The widget is commonly installed via a WordPress plugin but is also available as
      a standalone script, so it is treated as a general technology. gt_autoswitch is used by GTranslate's
      language auto-switch feature. Co-occ
    corpus: browser, static
    support: 332
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-gt-lang
    page:
      url: https://example.test/
      html: <div data-gt-lang="1"></div>
    expect: {}
  - name: data data-gt-orig-domain
    page:
      url: https://example.test/
      html: <div data-gt-orig-domain="1"></div>
    expect: {}
  - name: data data-gt-orig-url
    page:
      url: https://example.test/
      html: <div data-gt-orig-url="1"></div>
    expect: {}
  - name: data data-gt-widget-id
    page:
      url: https://example.test/
      html: <div data-gt-widget-id="1"></div>
    expect: {}
  - name: global doGTranslate
    page:
      url: https://example.test/
      js_globals:
        doGTranslate: ''
    expect: {}
  - name: global gtranslateSettings
    page:
      url: https://example.test/
      js_globals:
        gtranslateSettings: ''
    expect: {}
  - name: host cdn.gtranslate.net
    page:
      url: https://example.test/
      html: <script src="https://cdn.gtranslate.net/x.js"></script>
    expect: {}
  - name: hostdir cdn.gtranslate.net/widgets/
    page:
      url: https://example.test/
      html: <script src="https://cdn.gtranslate.net/widgets/x.js"></script>
    expect: {}
  - name: storage gt_autoswitch
    page:
      url: https://example.test/
      storage:
      - key: gt_autoswitch
    expect: {}
