# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: paymill
  name: PAYMILL
  vendor: paymill
  website: https://www.paymill.com
  categories:
  - payment
  signals:
  - type: js_global
    key: PAYMILL_PUBLIC_KEY
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. PAYMILL is a German payment service provider. The global PAYMILL_PUBLIC_KEY
      is the documented config variable for its client-side integration. The co-occurrence with cloudflare
      is likely incidental (many sites are behind Cloudflare).
    corpus: browser, static
    support: 114
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global PAYMILL_PUBLIC_KEY
    page:
      url: https://example.test/
      js_globals:
        PAYMILL_PUBLIC_KEY: ''
    expect: {}
- id: stripe
  name: Stripe
  vendor: stripe
  website: https://stripe.com
  categories:
  - payment
  signals:
  - type: cookie
    regex: (?i)^__stripe_mid$
    id: cookie-0
  - type: cookie
    regex: (?i)^__stripe_sid$
    id: cookie-1
  - type: js_global
    key: Stripe
    id: global-2
  - type: js_global
    key: webpackChunkStripeJSouter
    id: global-3
  - type: resource_url
    contains: //js.stripe.com/
    id: host-4
  - type: resource_url
    contains: //m.stripe.com/
    id: host-5
  - type: resource_url
    contains: //m.stripe.network/
    id: host-6
  - type: resource_url
    regex: (?i)//js\.stripe\.com/v[0-9]+/
    id: hostdir-7
  - type: resource_header
    key: x-stripe-proxy-response
    id: reshdr-8
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The v3 in the path is the API major version of Stripe.js, not
      a product version, so no version regex. The co-occurrence with google-fonts is incidental.
    corpus: browser, static
    support: 116
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie __stripe_mid
    page:
      url: https://example.test/
      cookies:
      - name: __stripe_mid
    expect: {}
  - name: cookie __stripe_sid
    page:
      url: https://example.test/
      cookies:
      - name: __stripe_sid
    expect: {}
  - name: global Stripe
    page:
      url: https://example.test/
      js_globals:
        Stripe: ''
    expect: {}
  - name: global webpackChunkStripeJSouter
    page:
      url: https://example.test/
      js_globals:
        webpackChunkStripeJSouter: ''
    expect: {}
  - name: host js.stripe.com
    page:
      url: https://example.test/
      html: <script src="https://js.stripe.com/x.js"></script>
    expect: {}
  - name: host m.stripe.com
    page:
      url: https://example.test/
      html: <script src="https://m.stripe.com/x.js"></script>
    expect: {}
  - name: host m.stripe.network
    page:
      url: https://example.test/
      html: <script src="https://m.stripe.network/x.js"></script>
    expect: {}
  - name: hostdir js.stripe.com/v#/
    page:
      url: https://example.test/
      html: <script src="https://js.stripe.com/v1/x.js"></script>
    expect: {}
  - name: reshdr x-stripe-proxy-response
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-stripe-proxy-response
          - '1'
    expect: {}
