# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: cloudflare-turnstile
  name: Cloudflare Turnstile
  vendor: cloudflare
  website: https://www.cloudflare.com/application-services/products/turnstile/
  categories:
  - captcha
  signals:
  - type: js_global
    key: turnstile
    id: global-0
  - type: resource_url
    contains: //challenges.cloudflare.com/turnstile/
    id: hostdir-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The turnstile path identifies Turnstile, a CAPTCHA alternative.
      The cdn-cgi/challenge-platform hosts, cf-chl-gen, www-authenticate and critical-ch relate to Cloudflare's
      bot/challenge platform and the Cloudflare proxy generally, so they are left out (they belong to
      the existing cloudflare rule). The bare host challenges.cloudflare.com is shared by challenge pages
      and is not used. The global 'turns
    corpus: browser, static
    support: 466
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global turnstile
    page:
      url: https://example.test/
      js_globals:
        turnstile: ''
    expect: {}
  - name: hostdir challenges.cloudflare.com/turnstile/
    page:
      url: https://example.test/
      html: <script src="https://challenges.cloudflare.com/turnstile/x.js"></script>
    expect: {}
- id: google-recaptcha
  name: Google reCAPTCHA
  vendor: google
  website: https://www.google.com/recaptcha/
  categories:
  - captcha
  signals:
  - type: cookie
    regex: (?i)^_grecaptcha$
    id: cookie-0
  - type: js_global
    key: ___grecaptcha_cfg
    id: global-1
  - type: js_global
    key: __google_recaptcha_client
    id: global-2
  - type: js_global
    key: grecaptcha
    id: global-3
  - type: resource_url
    contains: //www.google.com/recaptcha/
    id: hostdir-4
  - type: resource_url
    contains: //www.gstatic.com/recaptcha/
    id: hostdir-5
  - type: storage
    regex: (?i)^_grecaptcha$
    id: storage-6
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The generic host www.gstatic.com is shared by many Google products,
      so it was left out; the recaptcha directory and globals are specific. The release ID in the URL
      is a build hash, not a product version. The _grecaptcha cookie and storage key are well known to
      be created by Google reCAPTCHA. The high co-occurrence with jQuery is incidental, because jQuery
      is common on sites that use reCAPTCHA.
    corpus: browser, static
    support: 5064
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie _grecaptcha
    page:
      url: https://example.test/
      cookies:
      - name: _grecaptcha
    expect: {}
  - name: global ___grecaptcha_cfg
    page:
      url: https://example.test/
      js_globals:
        ___grecaptcha_cfg: ''
    expect: {}
  - name: global __google_recaptcha_client
    page:
      url: https://example.test/
      js_globals:
        __google_recaptcha_client: ''
    expect: {}
  - name: global grecaptcha
    page:
      url: https://example.test/
      js_globals:
        grecaptcha: ''
    expect: {}
  - name: hostdir www.google.com/recaptcha/
    page:
      url: https://example.test/
      html: <script src="https://www.google.com/recaptcha/x.js"></script>
    expect: {}
  - name: hostdir www.gstatic.com/recaptcha/
    page:
      url: https://example.test/
      html: <script src="https://www.gstatic.com/recaptcha/x.js"></script>
    expect: {}
  - name: storage _grecaptcha
    page:
      url: https://example.test/
      storage:
      - key: _grecaptcha
    expect: {}
- id: hcaptcha
  name: hCaptcha
  vendor: intuition-machines
  website: https://www.hcaptcha.com
  categories:
  - captcha
  signals:
  - type: data_attr
    regex: (?i)^data\-hcaptcha\-response$
    id: data-0
  - type: data_attr
    regex: (?i)^data\-hcaptcha\-widget\-id$
    id: data-1
  - type: js_global
    key: hcaptcha
    id: global-2
  - type: resource_url
    contains: //api.hcaptcha.com/
    id: host-3
  - type: resource_url
    contains: //js.hcaptcha.com/
    id: host-4
  - type: resource_url
    contains: //newassets.hcaptcha.com/
    id: host-5
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The Raven global is Sentry's legacy client, which hCaptcha loads
      inside its frame; it is generic, so it is left out. The high co-occurrence with google-tag is incidental.
    corpus: browser, static
    support: 506
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-hcaptcha-response
    page:
      url: https://example.test/
      html: <div data-hcaptcha-response="1"></div>
    expect: {}
  - name: data data-hcaptcha-widget-id
    page:
      url: https://example.test/
      html: <div data-hcaptcha-widget-id="1"></div>
    expect: {}
  - name: global hcaptcha
    page:
      url: https://example.test/
      js_globals:
        hcaptcha: ''
    expect: {}
  - name: host api.hcaptcha.com
    page:
      url: https://example.test/
      html: <script src="https://api.hcaptcha.com/x.js"></script>
    expect: {}
  - name: host js.hcaptcha.com
    page:
      url: https://example.test/
      html: <script src="https://js.hcaptcha.com/x.js"></script>
    expect: {}
  - name: host newassets.hcaptcha.com
    page:
      url: https://example.test/
      html: <script src="https://newassets.hcaptcha.com/x.js"></script>
    expect: {}
