# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: aws-waf
  name: AWS WAF
  vendor: amazon
  website: https://aws.amazon.com/waf/
  categories:
  - security
  signals:
  - type: resource_header
    key: x-amzn-waf-challenge-id
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The header appears on sub-resources served behind AWS WAF (e.g.
      jQuery loaded from a WAF-protected host), so it describes the asset host, not necessarily the page
      itself. The high co-occurrence with npm/jquery likely reflects a script being fetched through the
      WAF challenge. It is a single-token cluster.
    corpus: browser, static
    support: 65
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-amzn-waf-challenge-id
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-amzn-waf-challenge-id
          - '1'
    expect: {}
- id: bitninja
  name: BitNinja
  vendor: bitninja
  website: https://bitninja.io
  categories:
  - security
  signals:
  - type: header
    key: server
    regex: (?i)^\s*bitninja\-wafpro
    id: header-0
  - type: header
    key: x-powered-by
    regex: (?i)^\s*bitninja
    id: header-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. BitNinja is a server-side security suite (WAF, bot protection)
      for hosting providers. The correlation with Let's Encrypt is incidental to the hosting environments
      that use it. The token is a reshdr, so it only shows the third party serving an asset (likely a
      host protected by BitNinja), not necessarily the site itself. The high co-occurrence with jQuery
      probably reflects jQuery files served from B
    corpus: browser, static
    support: 84
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: header server=bitninja-wafpro
    page:
      url: https://example.test/
      headers:
      - - server
        - bitninja-wafpro
    expect: {}
  - name: header x-powered-by=bitninja
    page:
      url: https://example.test/
      headers:
      - - x-powered-by
        - bitninja
    expect: {}
- id: cleantalk
  name: CleanTalk Anti-Spam
  vendor: cleantalk
  website: https://cleantalk.org
  categories:
  - security
  signals:
  - type: js_global
    key: BOT_DETECTOR_LOADED
    id: global-0
  - type: resource_url
    contains: //fd-api.cleantalk.org/
    id: host-1
  - type: resource_url
    contains: //fd.cleantalk.org/
    id: host-2
  - type: resource_url
    contains: //fd-api.cleantalk.org/frontend_data/
    id: hostdir-3
  - type: storage
    regex: (?i)^bot_detector_headless$
    id: storage-4
  - type: storage
    regex: (?i)^bot_detector_page_hits$
    id: storage-5
  - type: storage
    regex: (?i)^bot_detector_prev_dto$
    id: storage-6
  - id: version-url
    type: resource_url
    regex: fd\.cleantalk\.org/([0-9]+\.[0-9]+\.[0-9]+)/ct-bot-detector
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. CleanTalk anti-spam bot detector, commonly loaded by the WordPress
      plugin but also used on other CMSs, so it is tracked as a vendor product. The version is in the
      script path. The cleantalk.org host is the vendor's own domain. The globals bdInit, bdScheduleCron
      and bdScheduleWhenIdle and the storage key come from the bot-detector script, but they are not verified
      as CleanTalk-only, so only the hos
    corpus: browser, static
    support: 112
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global BOT_DETECTOR_LOADED
    page:
      url: https://example.test/
      js_globals:
        BOT_DETECTOR_LOADED: ''
    expect: {}
  - name: host fd-api.cleantalk.org
    page:
      url: https://example.test/
      html: <script src="https://fd-api.cleantalk.org/x.js"></script>
    expect: {}
  - name: host fd.cleantalk.org
    page:
      url: https://example.test/
      html: <script src="https://fd.cleantalk.org/x.js"></script>
    expect: {}
  - name: hostdir fd-api.cleantalk.org/frontend_data/
    page:
      url: https://example.test/
      html: <script src="https://fd-api.cleantalk.org/frontend_data/x.js"></script>
    expect: {}
  - name: storage bot_detector_headless
    page:
      url: https://example.test/
      storage:
      - key: bot_detector_headless
    expect: {}
  - name: storage bot_detector_page_hits
    page:
      url: https://example.test/
      storage:
      - key: bot_detector_page_hits
    expect: {}
  - name: storage bot_detector_prev_dto
    page:
      url: https://example.test/
      storage:
      - key: bot_detector_prev_dto
    expect: {}
