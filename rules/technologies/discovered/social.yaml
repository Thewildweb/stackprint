- id: facebook-sdk
  name: Facebook SDK (Social Plugins)
  vendor: meta
  website: https://developers.facebook.com/docs/javascript
  categories:
  - social
  signals:
  - type: data_attr
    regex: (?i)^data\-adapt\-container\-width$
    id: data-0
  - type: data_attr
    regex: (?i)^data\-fbcssmodules$
    id: data-1
  - type: data_attr
    regex: (?i)^data\-hide\-cover$
    id: data-2
  - type: data_attr
    regex: (?i)^data\-show\-facepile$
    id: data-3
  - type: js_global
    key: FB_LOCAL_GLOBAL
    id: global-4
  - type: js_global
    key: fbAsyncInit
    id: global-5
  - type: resource_url
    contains: //connect.facebook.net/rsrc.php/
    id: hostdir-6
  - type: resource_header
    regex: (?i)^x\-fb\-content\-md[0-9]+$
    id: reshdr-7
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Facebook SDK / social plugins (Page plugin, Like button). Distinct
      from meta-pixel, which uses connect.facebook.net/en_US/fbevents.js. Generic tokens such as data-tabs,
      __DEV__, __buffer, document-policy and origin-agent-cluster were excluded as ambiguous. fbAsyncInit
      is defined by sites to initialise the Facebook JS SDK (connect.facebook.net/sdk.js). It is separate
      from Meta Pixel (fbq). Co-occur
    corpus: browser, static
    support: 628
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-adapt-container-width
    page:
      url: https://example.test/
      html: <div data-adapt-container-width="1"></div>
    expect: {}
  - name: data data-fbcssmodules
    page:
      url: https://example.test/
      html: <div data-fbcssmodules="1"></div>
    expect: {}
  - name: data data-hide-cover
    page:
      url: https://example.test/
      html: <div data-hide-cover="1"></div>
    expect: {}
  - name: data data-show-facepile
    page:
      url: https://example.test/
      html: <div data-show-facepile="1"></div>
    expect: {}
  - name: global FB_LOCAL_GLOBAL
    page:
      url: https://example.test/
      js_globals:
        FB_LOCAL_GLOBAL: ''
    expect: {}
  - name: global fbAsyncInit
    page:
      url: https://example.test/
      js_globals:
        fbAsyncInit: ''
    expect: {}
  - name: hostdir connect.facebook.net/rsrc.php/
    page:
      url: https://example.test/
      html: <script src="https://connect.facebook.net/rsrc.php/x.js"></script>
    expect: {}
  - name: reshdr x-fb-content-md#
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-fb-content-md1
          - '1'
    expect: {}
