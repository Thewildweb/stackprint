- id: addthis
  name: AddThis
  vendor: oracle
  website: https://www.addthis.com
  categories:
  - social
  signals:
  - type: js_global
    key: addthis_share
    id: global-0
  - type: resource_url
    contains: //s7.addthis.com/
    id: host-1
  - type: resource_url
    contains: //s7.addthis.com/js/
    id: hostdir-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The addthis_share global is a documented AddThis configuration
      variable. The co-occurrence with WordPress at 100% precision is likely due to many WordPress sites
      using AddThis plugins, so it is not a WordPress-specific signal. The /js/300/ path is an API generation
      number, not a product version, so no version is extracted.
    corpus: browser, static
    support: 146
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global addthis_share
    page:
      url: https://example.test/
      js_globals:
        addthis_share: ''
    expect: {}
  - name: host s7.addthis.com
    page:
      url: https://example.test/
      html: <script src="https://s7.addthis.com/x.js"></script>
    expect: {}
  - name: hostdir s7.addthis.com/js/
    page:
      url: https://example.test/
      html: <script src="https://s7.addthis.com/js/x.js"></script>
    expect: {}
