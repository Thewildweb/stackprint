- id: freshchat
  name: Freshchat
  vendor: freshworks
  website: https://www.freshworks.com/live-chat-software/
  categories:
  - live-chat
  signals:
  - type: js_global
    key: fcWidget
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. fcWidget is Freshchat's JS API. The x-server, x-fw-ratelimiting-managed
      and x-ratelimit headers look like Freshworks API response headers, co-occurring on the same sites,
      but they are less certain and generic, so only the global is used.
    corpus: browser, static
    support: 45
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global fcWidget
    page:
      url: https://example.test/
      js_globals:
        fcWidget: ''
    expect: {}
