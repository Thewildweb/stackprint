# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: matomo-tag-manager
  name: Matomo Tag Manager
  vendor: matomo
  website: https://matomo.org/tag-manager/
  categories:
  - tag-manager
  signals:
  - type: js_global
    key: _mtm
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The overlap with google-tag-manager (0.519) is likely because
      sites often run both. _mtm is the documented Matomo Tag Manager data layer name, and it is distinct
      from GTM's dataLayer.
    corpus: browser, static
    support: 54
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global _mtm
    page:
      url: https://example.test/
      js_globals:
        _mtm: ''
    expect: {}
- id: taggrs
  name: Taggrs
  vendor: taggrs
  website: https://taggrs.io
  categories:
  - tag-manager
  signals:
  - type: resource_url
    contains: //api.taggrs.io/
    id: host-0
  - type: resource_url
    contains: //api.taggrs.io/api/
    id: hostdir-1
  - type: resource_header
    key: x-tags-server
    id: reshdr-2
  - type: resource_header
    key: x-tags-webhook
    id: reshdr-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Taggrs is a server-side GTM/tagging service; api.taggrs.io is
      its own domain. The x-primary-domain and x-site-domain headers are generic-sounding so were left
      out; the x-tags-* headers co-occur with the same 74 sites and are plausibly Taggrs-specific.
    corpus: browser, static
    support: 85
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host api.taggrs.io
    page:
      url: https://example.test/
      html: <script src="https://api.taggrs.io/x.js"></script>
    expect: {}
  - name: hostdir api.taggrs.io/api/
    page:
      url: https://example.test/
      html: <script src="https://api.taggrs.io/api/x.js"></script>
    expect: {}
  - name: reshdr x-tags-server
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-tags-server
          - '1'
    expect: {}
  - name: reshdr x-tags-webhook
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-tags-webhook
          - '1'
    expect: {}
- id: tealium-iq
  name: Tealium iQ
  vendor: tealium
  website: https://tealium.com
  categories:
  - tag-manager
  signals:
  - type: js_global
    key: utag_data
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The co-occurrence with Cloudflare is incidental (CDN fronting).
      utag_data is Tealium's documented data layer global. Other Tealium signals like utag hosts (tags.tiqcdn.com)
      are not in this candidate.
    corpus: browser, static
    support: 182
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global utag_data
    page:
      url: https://example.test/
      js_globals:
        utag_data: ''
    expect: {}
