- id: sentry
  name: Sentry
  vendor: sentry
  website: https://sentry.io
  categories:
  - monitoring
  signals:
  - type: js_global
    key: SENTRY_RELEASE
    id: global-0
  - type: js_global
    key: __SENTRY__
    id: global-1
  - type: js_global
    key: __sentry_instrumentation_handlers__
    id: global-2
  - type: js_global
    key: _sentryDebugIdIdentifier
    id: global-3
  - type: js_global
    key: _sentryDebugIds
    id: global-4
  - type: js_global
    key: _sentryRouteManifest
    id: global-5
  - type: js_global
    key: _sentryWrappedDepth
    id: global-6
  - type: resource_url
    contains: //browser.sentry-cdn.com/
    id: host-7
  - type: resource_url
    contains: //sentry.io/
    id: host-8
  - id: version-url
    type: resource_url
    regex: browser\.sentry-cdn\.com/([0-9]+\.[0-9]+\.[0-9]+)/
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Co-occurrence with Wix (66%) is because Wix sites embed Sentry
      for their own error reporting; the global still identifies Sentry SDK presence. Sentry error monitoring
      browser SDK served from sentry-cdn.com; version is in the first path directory. The high co-occurrence
      with Wix is because Wix sites load Sentry. The hostdir token is omitted because it is a normalised
      version directory, not a produc
    corpus: browser, static
    support: 1881
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
