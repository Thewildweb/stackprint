# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: new-relic
  name: New Relic Browser
  vendor: new-relic
  website: https://newrelic.com
  categories:
  - monitoring
  signals:
  - type: js_global
    key: NREUM
    id: global-0
  - type: js_global
    key: newrelic
    id: global-1
  - type: resource_url
    contains: //bam.nr-data.net/
    id: host-2
  - type: resource_url
    contains: //js-agent.newrelic.com/
    id: host-3
  - type: storage
    regex: (?i)^nrba_session::[0-9a-f]+$
    id: storage-4
  - id: version-url
    type: resource_url
    regex: js-agent\.newrelic\.com/nr-(?:spa|full|rum|loader-spa|loader-rum)?-?(\d+\.\d+\.\d+)(?:\.min)?\.js
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Reshdr nr-rate-limited omitted as less certain; it's served
      by the bam.nr-data.net collector. Version appears in loader filenames like nr-spa-1.321.0.min.js.
    corpus: browser, static
    support: 107
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global NREUM
    page:
      url: https://example.test/
      js_globals:
        NREUM: ''
    expect: {}
  - name: global newrelic
    page:
      url: https://example.test/
      js_globals:
        newrelic: ''
    expect: {}
  - name: host bam.nr-data.net
    page:
      url: https://example.test/
      html: <script src="https://bam.nr-data.net/x.js"></script>
    expect: {}
  - name: host js-agent.newrelic.com
    page:
      url: https://example.test/
      html: <script src="https://js-agent.newrelic.com/x.js"></script>
    expect: {}
  - name: storage nrba_session::*
    page:
      url: https://example.test/
      storage:
      - key: nrba_session::abcdef12
    expect: {}
- id: rollbar
  name: Rollbar
  vendor: rollbar
  website: https://rollbar.com
  categories:
  - monitoring
  signals:
  - type: js_global
    key: Rollbar
    id: global-0
  - type: js_global
    key: _rollbarConfig
    id: global-1
  - type: js_global
    key: _rollbarDidLoad
    id: global-2
  - type: js_global
    key: _rollbarInitialized
    id: global-3
  - type: js_global
    key: _rollbarShims
    id: global-4
  - type: js_global
    key: _rollbarStartTime
    id: global-5
  - type: js_global
    key: _rollbarWrappedError
    id: global-6
  - type: js_global
    key: rollbar
    id: global-7
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Rollbar is an error-monitoring service. The _rollbarDidLoad
      and _rollbarStartTime globals are characteristic of its snippet. The bare 'rollbar' global is also
      Rollbar's, but sites can rename it, so it is weaker than the other two. Rollbar error monitoring.
      The existing cdnjs/rollbar.js label only covers the CDN-hosted library, while these globals identify
      the product regardless of how it is loaded
    corpus: browser, static
    support: 107
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
