# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: vwo
  name: VWO
  vendor: wingify
  website: https://vwo.com
  categories:
  - ab-testing
  signals:
  - type: js_global
    key: _vwo_code
    id: global-0
  - type: js_global
    key: _vwo_settings_timer
    id: global-1
  - type: resource_url
    contains: //dev.visualwebsiteoptimizer.com/
    id: host-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. VWO (Visual Website Optimizer) by Wingify is an A/B testing
      and experimentation platform. It is often loaded through Google Tag Manager, which explains the
      co-occurrence.
    corpus: browser, static
    support: 61
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global _vwo_code
    page:
      url: https://example.test/
      js_globals:
        _vwo_code: ''
    expect: {}
  - name: global _vwo_settings_timer
    page:
      url: https://example.test/
      js_globals:
        _vwo_settings_timer: ''
    expect: {}
  - name: host dev.visualwebsiteoptimizer.com
    page:
      url: https://example.test/
      html: <script src="https://dev.visualwebsiteoptimizer.com/x.js"></script>
    expect: {}
