- id: tailwind-play-cdn
  name: Tailwind CSS (Play CDN)
  vendor: tailwindlabs
  website: https://tailwindcss.com
  categories:
  - css-framework
  signals:
  - type: js_global
    key: tailwind
    id: global-0
  - type: resource_url
    contains: //cdn.tailwindcss.com/
    id: host-1
  - id: version-url
    type: resource_url
    regex: cdn\.tailwindcss\.com/(\d+\.\d+\.\d+)
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The '/template.html' global is page-specific and was left out.
      The version appears in the URL path only for pinned versions.
    corpus: browser, static
    support: 107
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global tailwind
    page:
      url: https://example.test/
      js_globals:
        tailwind: ''
    expect: {}
  - name: host cdn.tailwindcss.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.tailwindcss.com/x.js"></script>
    expect: {}
