- id: antispamcloud
  name: SpamExperts (Antispamcloud)
  vendor: spamexperts
  website: https://www.spamexperts.com
  categories:
  - email-security
  signals:
  - type: dns
    key: TXT
    contains: include:spf.antispamcloud.com
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. antispamcloud.com is the SpamExperts hosted spam-filtering service
      domain, widely used by hosting providers. Single DNS token with 58 sites; the jQuery co-occurrence
      is incidental.
    corpus: browser, static
    support: 114
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns spf-include:spf.antispamcloud.com
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:spf.antispamcloud.com ~all
    expect: {}
