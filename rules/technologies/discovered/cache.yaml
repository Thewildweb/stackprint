# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: varnish
  name: Varnish Cache
  vendor: varnish-software
  website: https://varnish-cache.org
  categories:
  - cache
  signals:
  - type: header
    key: x-varnish
    id: header-0
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. The high co-occurrence with lets-encrypt is incidental
      (TLS cert issuer commonly used on Varnish-fronted sites), not a relationship. Via: 1.1 varnish (Varnish)
      is the standard header from Varnish Cache; also emitted by Fastly and other Varnish-based CDNs,
      so it indicates Varnish in the stack, not necessarily self-hosted. Co-occurrence with jQuery is
      incidental. Varnish is not in the rule set. The '
    corpus: browser, static
    support: 2232
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: header x-varnish
    page:
      url: https://example.test/
      headers:
      - - x-varnish
        - '1'
    expect: {}
