# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: adobe-fonts
  name: Adobe Fonts (Typekit)
  vendor: adobe
  website: https://fonts.adobe.com
  categories:
  - font
  signals:
  - type: js_global
    key: Typekit
    id: global-0
  - type: resource_url
    contains: //p.typekit.net/
    id: host-1
  - type: resource_url
    contains: //use.typekit.net/
    id: host-2
  - type: resource_url
    contains: //use.typekit.net/af/
    id: hostdir-3
  - type: resource_url
    contains: //use.typekit.net/ik/
    id: hostdir-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The akamai-grn reshdr is just Akamai's header on typekit assets,
      so it is not specific to Adobe Fonts and was left out. Adobe Fonts (formerly Typekit) is not in
      the rule set. Its co-occurrence with Squarespace is because Squarespace offers Adobe Fonts, not
      because the tokens belong to it.
    corpus: browser, static
    support: 1411
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global Typekit
    page:
      url: https://example.test/
      js_globals:
        Typekit: ''
    expect: {}
  - name: host p.typekit.net
    page:
      url: https://example.test/
      html: <script src="https://p.typekit.net/x.js"></script>
    expect: {}
  - name: host use.typekit.net
    page:
      url: https://example.test/
      html: <script src="https://use.typekit.net/x.js"></script>
    expect: {}
  - name: hostdir use.typekit.net/af/
    page:
      url: https://example.test/
      html: <script src="https://use.typekit.net/af/x.js"></script>
    expect: {}
  - name: hostdir use.typekit.net/ik/
    page:
      url: https://example.test/
      html: <script src="https://use.typekit.net/ik/x.js"></script>
    expect: {}
- id: font-awesome
  name: Font Awesome
  vendor: fonticons
  website: https://fontawesome.com
  categories:
  - font
  signals:
  - type: data_attr
    regex: (?i)^data\-fa\-i[0-9]+svg$
    id: data-0
  - type: js_global
    key: FontAwesome
    id: global-1
  - type: js_global
    key: FontAwesomeConfig
    id: global-2
  - type: js_global
    key: ___FONT_AWESOME___
    id: global-3
  - type: resource_url
    contains: //use.fontawesome.com/
    id: host-4
  - type: resource_url
    contains: //use.fontawesome.com/releases/
    id: hostdir-5
  - id: version-url
    type: resource_url
    regex: use\.fontawesome\.com/releases/v([0-9]+\.[0-9]+\.[0-9]+)/
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. fontawesome-free-shims is mostly WordPress-specific (a plugin/theme
      inline script id), so it was left out. Font Awesome could also be an npm package, but no sample
      URLs were given. Font Awesome is not in the rule set. Kit URLs (use.fontawesome.com/<hash>.js) carry
      no version, but the releases path does.
    corpus: browser, static
    support: 1868
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-fa-i#svg
    page:
      url: https://example.test/
      html: <div data-fa-i1svg="1"></div>
    expect: {}
  - name: global FontAwesome
    page:
      url: https://example.test/
      js_globals:
        FontAwesome: ''
    expect: {}
  - name: global FontAwesomeConfig
    page:
      url: https://example.test/
      js_globals:
        FontAwesomeConfig: ''
    expect: {}
  - name: global ___FONT_AWESOME___
    page:
      url: https://example.test/
      js_globals:
        ___FONT_AWESOME___: ''
    expect: {}
  - name: host use.fontawesome.com
    page:
      url: https://example.test/
      html: <script src="https://use.fontawesome.com/x.js"></script>
    expect: {}
  - name: hostdir use.fontawesome.com/releases/
    page:
      url: https://example.test/
      html: <script src="https://use.fontawesome.com/releases/x.js"></script>
    expect: {}
