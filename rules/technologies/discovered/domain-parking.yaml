- id: godaddy-domain-parking
  name: GoDaddy Domain Parking
  vendor: godaddy
  website: https://www.godaddy.com
  categories:
  - domain-parking
  signals:
  - type: cookie
    regex: (?i)^caf_ipaddr$
    id: cookie-0
  - type: cookie
    regex: (?i)^lander_type$
    id: cookie-1
  - type: cookie
    regex: (?i)^pvisitor$
    id: cookie-2
  - type: js_global
    key: LANDER_SYSTEM
    id: global-3
  - type: resource_url
    contains: //api.aws.parking.godaddy.com/
    id: host-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. These tokens are misattributed to godaddy-website-builder but
      are for GoDaddy parked-domain pages. The generic cookies 'country' and 'city' are left out as too
      ambiguous.
    corpus: browser, static
    support: 152
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie caf_ipaddr
    page:
      url: https://example.test/
      cookies:
      - name: caf_ipaddr
    expect: {}
  - name: cookie lander_type
    page:
      url: https://example.test/
      cookies:
      - name: lander_type
    expect: {}
  - name: cookie pvisitor
    page:
      url: https://example.test/
      cookies:
      - name: pvisitor
    expect: {}
  - name: global LANDER_SYSTEM
    page:
      url: https://example.test/
      js_globals:
        LANDER_SYSTEM: ''
    expect: {}
  - name: host api.aws.parking.godaddy.com
    page:
      url: https://example.test/
      html: <script src="https://api.aws.parking.godaddy.com/x.js"></script>
    expect: {}
- id: namecheap-parking
  name: Namecheap Parking Page
  vendor: namecheap
  website: https://www.namecheap.com
  categories:
  - domain-parking
  signals:
  - type: dns
    key: CNAME
    regex: (?:^|[ .])d\.parity\.domains$
    id: dns-0
  - type: dns
    key: CNAME
    regex: (?:^|[ .])parkingpage\.namecheap\.com$
    id: dns-1
  - type: resource_url
    contains: //lander.parity.domains/
    id: host-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Parity (parity.domains) appears to power Namecheap's parking
      pages; the CNAME to parkingpage.namecheap.com ties it to Namecheap. Could be split into a generic
      Parity parking tech, but the Namecheap CNAME co-occurs on 100 of 106 sites.
    corpus: browser, static
    support: 121
    mined_run: review-2026-11
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns cname:d.parity.domains
    page:
      url: https://example.test/
      dns:
        CNAME:
        - x.d.parity.domains
    expect: {}
  - name: dns cname:parkingpage.namecheap.com
    page:
      url: https://example.test/
      dns:
        CNAME:
        - x.parkingpage.namecheap.com
    expect: {}
  - name: host lander.parity.domains
    page:
      url: https://example.test/
      html: <script src="https://lander.parity.domains/x.js"></script>
    expect: {}
