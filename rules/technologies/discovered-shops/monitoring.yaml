# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: datadog-logs
  name: Datadog Browser Logs
  vendor: datadog
  website: https://www.datadoghq.com
  categories:
  - monitoring
  signals:
  - type: js_global
    key: DD_LOGS
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. DD_LOGS is the Datadog browser logs SDK global. Separate from
      datadog-rum, which covers DD_RUM. The contrast lift for webshops is likely incidental, since many
      shop platforms ship Datadog.
    corpus: nl-webshops, nl-browser-full-sample
    support: 82
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global DD_LOGS
    page:
      url: https://example.test/
      js_globals:
        DD_LOGS: ''
    expect: {}
- id: noibu
  name: Noibu
  vendor: noibu
  website: https://www.noibu.com
  categories:
  - monitoring
  signals:
  - type: js_global
    key: NOIBUJS_CONFIG
    id: global-0
  - type: js_global
    key: NOIBUJS_DOCUMENT_READY_PROMISE
    id: global-1
  - type: js_global
    key: noibuJSLoaded
    id: global-2
  - type: resource_url
    contains: //cdn.noibu.com/
    id: host-3
  - type: storage
    regex: (?i)^noibu_page_groups$
    id: storage-4
  - type: storage
    regex: (?i)^noibu_tab_id$
    id: storage-5
  - type: storage
    regex: (?i)^noibu_url$
    id: storage-6
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Noibu is an ecommerce error and performance monitoring/session
      replay tool. Generic tokens like collect-worker.js and n_browser_data omitted as not clearly unique.
    corpus: nl-webshops, nl-browser-full-sample
    support: 16
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global NOIBUJS_CONFIG
    page:
      url: https://example.test/
      js_globals:
        NOIBUJS_CONFIG: ''
    expect: {}
  - name: global NOIBUJS_DOCUMENT_READY_PROMISE
    page:
      url: https://example.test/
      js_globals:
        NOIBUJS_DOCUMENT_READY_PROMISE: ''
    expect: {}
  - name: global noibuJSLoaded
    page:
      url: https://example.test/
      js_globals:
        noibuJSLoaded: ''
    expect: {}
  - name: host cdn.noibu.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.noibu.com/x.js"></script>
    expect: {}
  - name: storage noibu_page_groups
    page:
      url: https://example.test/
      storage:
      - key: noibu_page_groups
    expect: {}
  - name: storage noibu_tab_id
    page:
      url: https://example.test/
      storage:
      - key: noibu_tab_id
    expect: {}
  - name: storage noibu_url
    page:
      url: https://example.test/
      storage:
      - key: noibu_url
    expect: {}
- id: npm/@grafana/faro-web-sdk
  name: Grafana Faro Web SDK
  vendor: grafana-labs
  website: https://grafana.com/oss/faro/
  categories:
  - monitoring
  signals:
  - type: js_global
    key: _faroInternal
    id: global-0
  - type: js_global
    key: faro
    id: global-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Grafana Faro is a frontend observability/RUM SDK; window.faro
      and window.__faroInternal are its documented globals. Over-representation on NL webshops is likely
      due to a shared platform embedding it, but the globals identify Faro itself.
    corpus: nl-webshops, nl-browser-full-sample
    support: 16
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global _faroInternal
    page:
      url: https://example.test/
      js_globals:
        _faroInternal: ''
    expect: {}
  - name: global faro
    page:
      url: https://example.test/
      js_globals:
        faro: ''
    expect: {}
