  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Bazaarvoice is a ratings and reviews platform. The generic file
      names (bv.js, api-config.js) were left out because other products could produce them. bv-analytics.js
      is also left out as it is covered by the host and globals.
