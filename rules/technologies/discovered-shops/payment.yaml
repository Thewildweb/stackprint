# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: amazon-pay
  name: Amazon Pay
  vendor: amazon
  website: https://pay.amazon.com
  categories:
  - payment
  signals:
  - type: cookie
    regex: (?i)^apay\-session\-set$
    id: cookie-0
  - type: cookie
    regex: (?i)^session\-id\-apay$
    id: cookie-1
  - type: js_global
    key: amazonPayInterface
    id: global-2
  - type: js_global
    key: lpaOnAmazonPayReadyFired
    id: global-3
  - type: js_global
    key: onAmazonPayReady
    id: global-4
  - type: resource_url
    contains: //static-eu.payments-amazon.com/
    id: host-5
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The 'amazon' global is likely generic (the Amazon Pay namespace
      object) but is left out as ambiguous. The __post_robot global is a shared cross-domain messaging
      library used by PayPal and others, so it is excluded. The path /plugins/s#_amazonpay_shop#/ and
      lpa.min.css point to the JTL-Shop Amazon Pay plugin, so the signals are specific to the Amazon Pay
      integration. session-token and session-id-ti
    corpus: nl-webshops, nl-browser-full-sample
    support: 27
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie apay-session-set
    page:
      url: https://example.test/
      cookies:
      - name: apay-session-set
    expect: {}
  - name: cookie session-id-apay
    page:
      url: https://example.test/
      cookies:
      - name: session-id-apay
    expect: {}
  - name: global amazonPayInterface
    page:
      url: https://example.test/
      js_globals:
        amazonPayInterface: ''
    expect: {}
  - name: global lpaOnAmazonPayReadyFired
    page:
      url: https://example.test/
      js_globals:
        lpaOnAmazonPayReadyFired: ''
    expect: {}
  - name: global onAmazonPayReady
    page:
      url: https://example.test/
      js_globals:
        onAmazonPayReady: ''
    expect: {}
  - name: host static-eu.payments-amazon.com
    page:
      url: https://example.test/
      html: <script src="https://static-eu.payments-amazon.com/x.js"></script>
    expect: {}
- id: apple-pay-js
  name: Apple Pay JS
  vendor: apple
  website: https://developer.apple.com/apple-pay/
  categories:
  - payment
  signals:
  - type: resource_url
    regex: (?i)/apple\-pay\-sdk\.js(?:[?#]|$)
    id: file-0
  - type: resource_url
    contains: //applepay.cdn-apple.com/
    id: host-1
  - type: resource_url
    contains: //applepay.cdn-apple.com/jsapi/
    id: hostdir-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Apple Pay button/SDK loaded from applepay.cdn-apple.com. The
      Google Pay globals (gpay button config, getGooglePaymentsClient) likely belong to a separate Google
      Pay technology and were left out. The apple-* reshdr tokens are response headers from Apple's CDN
      and add nothing beyond the host.
    corpus: nl-webshops, nl-browser-full-sample
    support: 32
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
