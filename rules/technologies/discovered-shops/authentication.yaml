- id: npm/@nuxtjs/auth
  name: Nuxt Auth Module
  vendor: nuxt
  website: https://auth.nuxtjs.org
  categories:
  - authentication
  signals:
  - type: cookie
    regex: (?i)^auth\.strategy$
    id: cookie-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The cookie auth.strategy is the default of the Nuxt auth module.
      It is sold as an auth library rather than a shop platform. Lift is 19.5 in webshops without a detected
      platform, so many Dutch headless shops likely use Nuxt with this module.
    corpus: nl-webshops, nl-browser-full-sample
    support: 10
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie auth.strategy
    page:
      url: https://example.test/
      cookies:
      - name: auth.strategy
    expect: {}
- id: npm/next-auth
  name: NextAuth.js (Auth.js)
  vendor: authjs
  website: https://authjs.dev
  categories:
  - authentication
  signals:
  - type: cookie
    regex: (?i)^__host\-authjs\.csrf\-token$
    id: cookie-0
  - type: cookie
    regex: (?i)^__host\-next\-auth\.csrf\-token$
    id: cookie-1
  - type: cookie
    regex: (?i)^__secure\-authjs\.callback\-url$
    id: cookie-2
  - type: cookie
    regex: (?i)^__secure\-next\-auth\.callback\-url$
    id: cookie-3
  - type: storage
    regex: (?i)^nextauth\.message$
    id: storage-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. These are NextAuth.js (next-auth) default cookie and storage
      names. Likely used by a shared webshop platform built on Next.js. The authjs.* cookie names are
      the Auth.js v5 defaults (v4 used next-auth.*). They indicate Auth.js is in use, typically on Next.js
      sites, and are not specific to any shop platform. The lift on Dutch webshops is probably because
      a shared frontend or agency stack uses Auth.j
    corpus: nl-webshops, nl-browser-full-sample
    support: 127
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie __host-authjs.csrf-token
    page:
      url: https://example.test/
      cookies:
      - name: __host-authjs.csrf-token
    expect: {}
  - name: cookie __host-next-auth.csrf-token
    page:
      url: https://example.test/
      cookies:
      - name: __host-next-auth.csrf-token
    expect: {}
  - name: cookie __secure-authjs.callback-url
    page:
      url: https://example.test/
      cookies:
      - name: __secure-authjs.callback-url
    expect: {}
  - name: cookie __secure-next-auth.callback-url
    page:
      url: https://example.test/
      cookies:
      - name: __secure-next-auth.callback-url
    expect: {}
  - name: storage nextauth.message
    page:
      url: https://example.test/
      storage:
      - key: nextauth.message
    expect: {}
