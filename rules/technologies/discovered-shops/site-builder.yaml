# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: lodgify
  name: Lodgify
  vendor: lodgify
  website: https://www.lodgify.com
  categories:
  - site-builder
  signals:
  - type: resource_url
    contains: //checkout.lodgify.com/
    id: host-0
  - type: resource_url
    contains: //gfonts.lodgify.com/
    id: host-1
  - type: resource_url
    contains: //websites-static.lodgify.com/
    id: host-2
  - type: resource_url
    contains: //websiteserver.lodgify.com/
    id: host-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Lodgify is a vacation rental website builder and booking platform.
      All tokens cluster on lodgify.com hosts; the cdbcdn.com hosts are likely its CDN/image infrastructure,
      with high lift in the contrast set.
    corpus: nl-webshops, nl-browser-full-sample
    support: 66
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host checkout.lodgify.com
    page:
      url: https://example.test/
      html: <script src="https://checkout.lodgify.com/x.js"></script>
    expect: {}
  - name: host gfonts.lodgify.com
    page:
      url: https://example.test/
      html: <script src="https://gfonts.lodgify.com/x.js"></script>
    expect: {}
  - name: host websites-static.lodgify.com
    page:
      url: https://example.test/
      html: <script src="https://websites-static.lodgify.com/x.js"></script>
    expect: {}
  - name: host websiteserver.lodgify.com
    page:
      url: https://example.test/
      html: <script src="https://websiteserver.lodgify.com/x.js"></script>
    expect: {}
- id: manus
  name: Manus
  vendor: manus
  website: https://manus.im
  categories:
  - site-builder
  signals:
  - type: js_global
    key: __MANUS_HOST_DEV__
    id: global-0
  - type: js_global
    key: __WOUTER_ROUTES__
    id: global-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. __MANUS_HOST_DEV__ co-occurs with the wouter routes global and
      react.dev (the React error-decoder link in the production bundle), which points to Manus AI generated
      React/Vite sites. react.dev and ErrorEvent are generic and left out.
    corpus: nl-webshops, nl-browser-full-sample
    support: 24
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global __MANUS_HOST_DEV__
    page:
      url: https://example.test/
      js_globals:
        __MANUS_HOST_DEV__: ''
    expect: {}
  - name: global __WOUTER_ROUTES__
    page:
      url: https://example.test/
      js_globals:
        __WOUTER_ROUTES__: ''
    expect: {}
