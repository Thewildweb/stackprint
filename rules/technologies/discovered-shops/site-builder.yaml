- id: strikingly
  name: Strikingly
  vendor: strikingly
  website: https://www.strikingly.com
  categories:
  - site-builder
  signals:
  - type: dns
    key: CNAME
    regex: (?:^|[ .])s\.strikinglydns\.com$
    id: dns-0
  - type: resource_url
    contains: //static-assets.strikinglycdn.com/
    id: host-1
  - type: resource_url
    contains: //static-fonts-css.strikinglycdn.com/
    id: host-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The strikinglycdn.com hosts and the bobcat_monorepo global clearly
      identify Strikingly, a website builder. The cloudfront hosts are unattributed shared-CDN hosts,
      so they were left out of the signals. strikinglydns.com is Strikingly's DNS domain for custom domains
      on its website builder and includes simple ecommerce. 399 corpus sites with a 10x lift among Dutch
      webshops with no detected platform f
    corpus: nl-webshops, nl-browser-full-sample
    support: 32
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns cname:s.strikinglydns.com
    page:
      url: https://example.test/
      dns:
        CNAME:
        - x.s.strikinglydns.com
    expect: {}
  - name: host static-assets.strikinglycdn.com
    page:
      url: https://example.test/
      html: <script src="https://static-assets.strikinglycdn.com/x.js"></script>
    expect: {}
  - name: host static-fonts-css.strikinglycdn.com
    page:
      url: https://example.test/
      html: <script src="https://static-fonts-css.strikinglycdn.com/x.js"></script>
    expect: {}
