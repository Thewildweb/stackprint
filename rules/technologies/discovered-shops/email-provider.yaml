# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: gandi-mail
  name: Gandi Mail
  vendor: gandi
  website: https://www.gandi.net
  categories:
  - email-provider
  signals:
  - type: dns
    key: MX
    regex: (?:^|[ .])mail\.gandi\.net$
    id: dns-0
  - type: dns
    key: TXT
    contains: include:_mailcust.gandi.net
    id: dns-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Gandi DNS exists as gandi-dns, but there is no mail entry. The
      MX token identifies Gandi Mail specifically. The high lift on Dutch webshops with no detected platform
      is incidental and not evidence of a shared platform. gandi-dns exists for nameservers, but this
      SPF include marks Gandi's mail service, so it is a separate technology. The high lift on Dutch webshops
      without a platform is likely drive
    corpus: nl-webshops, nl-browser-full-sample
    support: 62
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns mx:mail.gandi.net
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mail.gandi.net
    expect: {}
  - name: dns spf-include:_mailcust.gandi.net
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:_mailcust.gandi.net ~all
    expect: {}
