# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: coldfusion
  name: Adobe ColdFusion
  vendor: adobe
  website: https://www.adobe.com/products/coldfusion-family.html
  categories:
  - programming-language
  signals:
  - type: cookie
    regex: (?i)^cfid$
    id: cookie-0
  - type: cookie
    regex: (?i)^cftoken$
    id: cookie-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. CFID/CFTOKEN cookies are the classic CFML session cookies. They
      could also come from Lucee or other CFML engines, so the rule is named ColdFusion/CFML generically.
      Both tokens have identical support (63 sites), which is consistent with a single product setting
      them together.
    corpus: nl-webshops, nl-browser-full-sample
    support: 80
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie cfid
    page:
      url: https://example.test/
      cookies:
      - name: cfid
    expect: {}
  - name: cookie cftoken
    page:
      url: https://example.test/
      cookies:
      - name: cftoken
    expect: {}
