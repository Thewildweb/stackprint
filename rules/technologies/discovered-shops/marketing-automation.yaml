- id: emarsys-web-extend
  name: Emarsys Web Extend (Scarab)
  vendor: emarsys
  website: https://emarsys.com
  categories:
  - marketing-automation
  signals:
  - type: cookie
    regex: (?i)^scarab\.visitor$
    id: cookie-0
  - type: storage
    regex: (?i)^scarab\.visitor$
    id: storage-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. scarab.visitor is Emarsys' Scarab Research (predict) visitor
      identifier. The 'cdv' cookie is short and ambiguous, so it is left out as a signal despite co-occurring
      on the same sites.
    corpus: nl-webshops, nl-browser-full-sample
