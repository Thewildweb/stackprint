- id: actito
  name: Actito
  vendor: actito
  website: https://www.actito.com
  categories:
  - marketing-automation
  signals:
  - type: js_global
    key: _actGoal
    id: global-0
  - type: resource_url
    contains: //cdn.actito.be/
    id: host-1
  - type: resource_url
    contains: //www.actito.be/
    id: host-2
  - type: resource_url
    contains: //cdn.actito.be/actito-goal/
    id: hostdir-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Actito is a Belgian marketing automation / customer data platform;
      goal.js tracking is its site tracking script. The generic file name goal.js is left out.
    corpus: nl-webshops, nl-browser-full-sample
    support: 14
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global _actGoal
    page:
      url: https://example.test/
      js_globals:
        _actGoal: ''
    expect: {}
  - name: host cdn.actito.be
    page:
      url: https://example.test/
      html: <script src="https://cdn.actito.be/x.js"></script>
    expect: {}
  - name: host www.actito.be
    page:
      url: https://example.test/
      html: <script src="https://www.actito.be/x.js"></script>
    expect: {}
  - name: hostdir cdn.actito.be/actito-goal/
    page:
      url: https://example.test/
