- id: fraud-blocker
  name: Fraud Blocker
  vendor: fraud-blocker
  website: https://fraudblocker.com
  categories:
  - advertising
  signals:
  - type: resource_url
    regex: (?i)/fbt\.js(?:[?#]|$)
    id: file-0
  - type: js_global
    key: FBTrackConversion
    id: global-1
  - type: js_global
    key: fbt_boot
    id: global-2
  - type: resource_url
    contains: //monitor.fraudblocker.com/
    id: host-3
  - type: resource_header
    key: x-fbc-status
    id: reshdr-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Fraud Blocker is a click-fraud protection tool for Google Ads.
      The tokens fbt_boot, FBTrackConversion, fbt.js and monitor.fraudblocker.com all share the same 9-site
      support. The generic p.js, b.js and parcelRequiref28a tokens were left out because other products
      can produce them.
    corpus: nl-webshops, nl-browser-full-sample
    support: 22
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file fbt.js
    page:
      url: https://example.test/
      html: <script src="/assets/fbt.js"></script>
    expect: {}
  - name: global FBTrackConversion
    page:
      url: https://example.test/
      js_globals:
        FBTrackConversion: ''
    expect: {}
  - name: global fbt_boot
    page:
      url: https://example.test/
      js_globals:
        fbt_boot: ''
    expect: {}
  - name: host monitor.fraudblocker.com
    page:
      url: https://example.test/
      html: <script src="https://monitor.fraudblocker.com/x.js"></script>
    expect: {}
  - name: reshdr x-fbc-status
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-fbc-status
          - '1'
    expect: {}
