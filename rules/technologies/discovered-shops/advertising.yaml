# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: adsdefender
  name: AdsDefender
  vendor: adsdefender
  website: https://adsdefender.com
  categories:
  - advertising
  signals:
  - type: cookie
    regex: (?i)^_hc_v[0-9]+$
    id: cookie-0
  - type: js_global
    key: hc_tm
    id: global-1
  - type: js_global
    key: hc_uei
    id: global-2
  - type: resource_url
    contains: //cdn.adsdefender.com/
    id: host-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Cluster is concentrated on Dutch webshops and all tokens co-occur.
      AdsDefender looks like an ad-fraud or click protection service, which fits the advertising category,
      but the vendor identification is inferred from the host name rather than known. The file names oti.js
      and ivy.js are too generic, so they are excluded.
    corpus: nl-webshops, nl-browser-full-sample
    support: 20
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie _hc_v#
    page:
      url: https://example.test/
      cookies:
      - name: _hc_v1
    expect: {}
  - name: global hc_tm
    page:
      url: https://example.test/
      js_globals:
        hc_tm: ''
    expect: {}
  - name: global hc_uei
    page:
      url: https://example.test/
      js_globals:
        hc_uei: ''
    expect: {}
  - name: host cdn.adsdefender.com
    page:
      url: https://example.test/
      html: <script src="https://cdn.adsdefender.com/x.js"></script>
    expect: {}
- id: beslist-conversion-tracking
  name: Beslist.nl Conversion Tracking
  vendor: beslist
  website: https://www.beslist.nl
  categories:
  - advertising
  signals:
  - type: resource_url
    contains: //ct.beslist.nl/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. ct.beslist.nl is the conversion tracking endpoint for Beslist.nl,
      a Dutch price comparison site. It appears on 1006 sites in the corpus and is strongly over-represented
      on Dutch webshops (lift 27.4). I identified it from the hostname, since no sample URLs were provided.
    corpus: nl-webshops, nl-browser-full-sample
    support: 368
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host ct.beslist.nl
    page:
      url: https://example.test/
      html: <script src="https://ct.beslist.nl/x.js"></script>
    expect: {}
