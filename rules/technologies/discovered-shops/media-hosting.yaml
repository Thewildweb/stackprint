# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: adobe-dynamic-media
  name: Adobe Dynamic Media (Scene7 Smart Imaging)
  vendor: adobe
  website: https://business.adobe.com/products/experience-manager/assets/dynamic-media.html
  categories:
  - media-hosting
  signals:
  - type: resource_header
    key: x-adobe-smart-imaging
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. x-adobe-smart-imaging is the Adobe Dynamic Media Smart Imaging
      header, so the image assets are served from it. The Akamai headers (akamai-cache-status, x-akamai-cache)
      and server=unknown are generic Akamai delivery and were left out. Adobe Dynamic Media is delivered
      via Akamai, which explains the co-occurrence.
    corpus: nl-webshops, nl-browser-full-sample
    support: 16
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-adobe-smart-imaging
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-adobe-smart-imaging
          - '1'
    expect: {}
- id: cloudimage
  name: Cloudimage
  vendor: scaleflex
  website: https://www.cloudimage.io
  categories:
  - media-hosting
  signals:
  - type: resource_header
    key: x-cloudimg-traceid
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. x-cloudimg-traceid points to Cloudimage, an image CDN/optimization
      service. The x-hexa-* and x-resource-status headers co-occur on the same assets and likely come
      from the same service, but only the Cloudimg header is clearly vendor-named, so only it is used
      as a signal. The cluster is over-represented in Dutch webshops without a detected platform, which
      fits an image CDN used by a shared platform
    corpus: nl-webshops, nl-browser-full-sample
    support: 113
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-cloudimg-traceid
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-cloudimg-traceid
          - '1'
    expect: {}
