- id: npm/ipx
  name: IPX
  vendor: unjs
  website: https://github.com/unjs/ipx
  categories:
  - media-hosting
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/_ipx/w_[0-9]+/
    first_party: true
    id: path-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The /_ipx/ path is the default endpoint of the unjs IPX image
      proxy, used by @nuxt/image and similar tools. The framework is not necessarily Nuxt, so the signal
      identifies the image service only. Support is small (8 sites), but the lift is strong at 56.5x on
      Dutch webshops.
    corpus: nl-webshops, nl-browser-full-sample
    support: 11
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /_ipx/w_#/
    page:
      url: https://example.test/
      html: <script src="/_ipx/w_1/x.js"></script>
    expect: {}
- id: slir
  name: SLIR (Smart Lencioni Image Resizer)
  vendor: slir
  website: https://github.com/lencioni/SLIR
  categories:
  - media-hosting
  signals:
  - type: resource_header
    key: x-content-slir
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The X-Content-SLIR header is the signature of the SLIR PHP image
      resizing library, which is widely bundled in Dutch webshop software (over-represented on NL webshops
      without detected platform). The category is a best fit; there is no image-processing category, so
      media-hosting was chosen.
    corpus: nl-webshops, nl-browser-full-sample
    support: 49
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-content-slir
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-content-slir
          - '1'
    expect: {}
