# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: stape
  name: Stape
  vendor: stape
  website: https://stape.io
  categories:
  - tag-manager
  signals:
  - type: resource_header
    key: x-stape-version
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Stape hosts server-side Google Tag Manager; x-stape-version
      header appears on resources served by Stape-hosted tagging servers. There is an existing stape-io-udc
      entry (Stape UDC, a JS library), but this header identifies the Stape hosting/server-side tagging
      service, which is distinct. Over-represented on Dutch webshops, consistent with server-side tracking
      use.
    corpus: nl-webshops, nl-browser-full-sample
    support: 170
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-stape-version
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-stape-version
          - '1'
    expect: {}
- id: stape-data-tag
  name: Stape Data Tag
  vendor: stape
  website: https://stape.io
  categories:
  - tag-manager
  signals:
  - type: js_global
    key: dataTagGetData
    id: global-0
  - type: js_global
    key: dataTagParseResponse
    id: global-1
  - type: js_global
    key: dataTagSendData
    id: global-2
  - type: resource_url
    contains: //stapecdn.com/
    id: host-3
  - type: resource_url
    contains: //stapecdn.com/dtag/
    id: hostdir-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. stapecdn.com is Stape's CDN. Stape provides server-side GTM
      hosting and tags, and the dtag directory with dataTag* globals matches the Stape Data Tag/Data Client.
      The existing stape-io-udc entry is a different Stape product (UDC), so this is kept as a separate
      technology.
    corpus: nl-webshops, nl-browser-full-sample
    support: 62
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global dataTagGetData
    page:
      url: https://example.test/
      js_globals:
        dataTagGetData: ''
    expect: {}
  - name: global dataTagParseResponse
    page:
      url: https://example.test/
      js_globals:
        dataTagParseResponse: ''
    expect: {}
  - name: global dataTagSendData
    page:
      url: https://example.test/
      js_globals:
        dataTagSendData: ''
    expect: {}
  - name: host stapecdn.com
    page:
      url: https://example.test/
      html: <script src="https://stapecdn.com/x.js"></script>
    expect: {}
  - name: hostdir stapecdn.com/dtag/
    page:
      url: https://example.test/
      html: <script src="https://stapecdn.com/dtag/x.js"></script>
    expect: {}
- id: trytagging
  name: TryTagging
  vendor: trytagging
  website: https://www.trytagging.com
  categories:
  - tag-manager
  signals:
  - type: cookie
    regex: (?i)^trytagging_snapshot$
    id: cookie-0
  - type: cookie
    regex: (?i)^trytagging_user_id$
    id: cookie-1
  - type: js_global
    key: taggingHelpers
    id: global-2
  - type: js_global
    key: tagging_has_consent_ready
    id: global-3
  - type: js_global
    key: trytagging_current_snap_shot
    id: global-4
  - type: storage
    regex: (?i)^trytagging_gcs$
    id: storage-5
  - type: storage
    regex: (?i)^trytagging_generated_ga$
    id: storage-6
  - type: storage
    regex: (?i)^trytagging_marketing_data$
    id: storage-7
  - type: storage
    regex: (?i)^trytagging_sessionid$
    id: storage-8
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Server-side tagging / tracking data layer used on Dutch webshops.
      The category is a best guess, and the vendor website was not observed in the tokens. TryTagging
      appears to be a server-side tagging / Google Tag Manager hosting service. The storage key carries
      the vendor name, so it is a clear product signal. The candidate has only one token, so the product
      identification rests on the name alone.
    corpus: nl-webshops, nl-browser-full-sample
    support: 168
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie trytagging_snapshot
    page:
      url: https://example.test/
      cookies:
      - name: trytagging_snapshot
    expect: {}
  - name: cookie trytagging_user_id
    page:
      url: https://example.test/
      cookies:
      - name: trytagging_user_id
    expect: {}
  - name: global taggingHelpers
    page:
      url: https://example.test/
      js_globals:
        taggingHelpers: ''
    expect: {}
  - name: global tagging_has_consent_ready
    page:
      url: https://example.test/
      js_globals:
        tagging_has_consent_ready: ''
    expect: {}
  - name: global trytagging_current_snap_shot
    page:
      url: https://example.test/
      js_globals:
        trytagging_current_snap_shot: ''
    expect: {}
  - name: storage trytagging_gcs
    page:
      url: https://example.test/
      storage:
      - key: trytagging_gcs
    expect: {}
  - name: storage trytagging_generated_ga
    page:
      url: https://example.test/
      storage:
      - key: trytagging_generated_ga
    expect: {}
  - name: storage trytagging_marketing_data
    page:
      url: https://example.test/
      storage:
      - key: trytagging_marketing_data
    expect: {}
  - name: storage trytagging_sessionid
    page:
      url: https://example.test/
      storage:
      - key: trytagging_sessionid
    expect: {}
