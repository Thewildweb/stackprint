# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: globalsign
  name: GlobalSign
  vendor: globalsign
  website: https://www.globalsign.com
  categories:
  - security
  signals:
  - type: dns
    key: TXT
    prefix: globalsign-domain-verification=
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The TXT record shows the domain has been validated with GlobalSign,
      usually for certificate issuance. It does not prove the certificate is currently in use. Category
      'security' is the closest fit, since no certificate-authority category exists.
    corpus: nl-webshops, nl-browser-full-sample
    support: 29
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns txt:globalsign-domain-verification
    page:
      url: https://example.test/
      dns:
        TXT:
        - globalsign-domain-verification=abc
    expect: {}
- id: humansecurity-perimeterx
  name: HUMAN Security (PerimeterX) Bot Defender
  vendor: humansecurity
  website: https://www.humansecurity.com
  categories:
  - security
  signals:
  - type: cookie
    regex: (?i)^_pxvid$
    id: cookie-0
  - type: cookie
    regex: (?i)^pxcts$
    id: cookie-1
  - type: js_global
    key: _pxAppId
    id: global-2
  - type: resource_url
    contains: //ift.px-cloud.net/
    id: host-3
  - type: storage
    regex: (?i)^pxsid$
    id: storage-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The quantummetric tokens (cdn.quantummetric.com, qscripts) form
      a separate product (Quantum Metric analytics) that merely co-occurs on large retailers; it should
      be a separate candidate. getCurrentUrl, _AutofillCallbackHandler, __pwClock and active-cdn are generic
      or ambiguous and were left out.
    corpus: nl-webshops, nl-browser-full-sample
    support: 26
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie _pxvid
    page:
      url: https://example.test/
      cookies:
      - name: _pxvid
    expect: {}
  - name: cookie pxcts
    page:
      url: https://example.test/
      cookies:
      - name: pxcts
    expect: {}
  - name: global _pxAppId
    page:
      url: https://example.test/
      js_globals:
        _pxAppId: ''
    expect: {}
  - name: host ift.px-cloud.net
    page:
      url: https://example.test/
      html: <script src="https://ift.px-cloud.net/x.js"></script>
    expect: {}
  - name: storage pxsid
    page:
      url: https://example.test/
      storage:
      - key: pxsid
    expect: {}
