- id: flowbox
  name: Flowbox
  vendor: flowbox
  website: https://getflowbox.com
  categories:
  - social
  signals:
  - type: resource_url
    regex: (?i)/flowbox\-flow\-embed\.js(?:[?#]|$)
    id: file-0
  - type: resource_url
    regex: (?i)/flowbox\.js(?:[?#]|$)
    id: file-1
  - type: js_global
    key: flowbox
    id: global-2
  - type: resource_url
    contains: //connect.getflowbox.com/
    id: host-3
  - type: resource_url
    contains: //gateway.getflowbox.com/
    id: host-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Flowbox is a social media feed / UGC gallery embed platform.
      All tokens are vendor-owned (getflowbox.com).
    corpus: nl-webshops, nl-browser-full-sample
    support: 61
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file flowbox-flow-embed.js
    page:
      url: https://example.test/
      html: <script src="/assets/flowbox-flow-embed.js"></script>
    expect: {}
  - name: file flowbox.js
    page:
      url: https://example.test/
      html: <script src="/assets/flowbox.js"></script>
    expect: {}
  - name: global flowbox
    page:
      url: https://example.test/
      js_globals:
        flowbox: ''
    expect: {}
  - name: host connect.getflowbox.com
    page:
      url: https://example.test/
      html: <script src="https://connect.getflowbox.com/x.js"></script>
    expect: {}
  - name: host gateway.getflowbox.com
    page:
      url: https://example.test/
      html: <script src="https://gateway.getflowbox.com/x.js"></script>
    expect: {}
