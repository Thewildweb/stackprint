    expect: {}
  - name: global TradedoublerSDK
    page:
      url: https://example.test/
      js_globals:
        TradedoublerSDK: ''
    expect: {}
  - name: global tdconv
    page:
      url: https://example.test/
      js_globals:
        tdconv: ''
    expect: {}
  - name: global tdconvObj
    page:
      url: https://example.test/
      js_globals:
        tdconvObj: ''
    expect: {}
  - name: host svht.tradedoubler.com
    page:
      url: https://example.test/
      html: <script src="https://svht.tradedoubler.com/x.js"></script>
    expect: {}
  - name: host swrap.tradedoubler.com
    page:
      url: https://example.test/
      html: <script src="https://swrap.tradedoubler.com/x.js"></script>
    expect: {}
