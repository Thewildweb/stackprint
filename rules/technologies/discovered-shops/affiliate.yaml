# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: adcell
  name: ADCELL
  vendor: adcell
  website: https://www.adcell.com
  categories:
  - affiliate
  signals:
  - type: js_global
    key: Adcell
    id: global-0
  - type: resource_url
    contains: //t.adcell.com/
    id: host-1
  - type: resource_url
    contains: //t.adcell.com/js/
    id: hostdir-2
  - type: resource_url
    contains: //t.adcell.com/retargeting/
    id: hostdir-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The cluster is ADCELL, a German affiliate network. The myracloud
      server header is Myra Security (a separate CDN/WAF) and is incidental to this cluster, so I left
      it out of the signals. It could be a separate candidate.
    corpus: nl-webshops, nl-browser-full-sample
    support: 42
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global Adcell
    page:
      url: https://example.test/
      js_globals:
        Adcell: ''
    expect: {}
  - name: host t.adcell.com
    page:
      url: https://example.test/
      html: <script src="https://t.adcell.com/x.js"></script>
    expect: {}
  - name: hostdir t.adcell.com/js/
    page:
      url: https://example.test/
      html: <script src="https://t.adcell.com/js/x.js"></script>
    expect: {}
  - name: hostdir t.adcell.com/retargeting/
    page:
      url: https://example.test/
      html: <script src="https://t.adcell.com/retargeting/x.js"></script>
    expect: {}
- id: cj-affiliate-tracking
  name: CJ Affiliate Tracking (Commission Junction)
  vendor: cj
  website: https://www.cj.com
  categories:
  - affiliate
  signals:
  - type: cookie
    regex: (?i)^cjconsent$
    id: cookie-0
  - type: js_global
    key: CJApi
    id: global-1
  - type: js_global
    key: cjApi
    id: global-2
  - type: resource_url
    contains: //www.mczbf.com/
    id: host-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. cjApi, CJApi and cjconsent co-occur on the same 13 sites and
      match CJ Affiliate's (Commission Junction) site tracking tag. www.mczbf.com is believed to be a
      CJ domain, but that rests on recall rather than on anything in the observations. The hostdir tokens
      were left out because they duplicate the host.
    corpus: nl-webshops, nl-browser-full-sample
    support: 32
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie cjconsent
    page:
      url: https://example.test/
      cookies:
      - name: cjconsent
    expect: {}
  - name: global CJApi
    page:
      url: https://example.test/
      js_globals:
        CJApi: ''
    expect: {}
  - name: global cjApi
    page:
      url: https://example.test/
      js_globals:
        cjApi: ''
    expect: {}
  - name: host www.mczbf.com
    page:
      url: https://example.test/
      html: <script src="https://www.mczbf.com/x.js"></script>
    expect: {}
- id: tradedoubler
  name: Tradedoubler
  vendor: tradedoubler
  website: https://www.tradedoubler.com
  categories:
  - affiliate
  signals:
  - type: cookie
    regex: (?i)^_tdbu$
    id: cookie-0
  - type: cookie
    regex: (?i)^_tdid$
    id: cookie-1
  - type: resource_url
    regex: (?i)/tr_sdk\.js(?:[?#]|$)
    id: file-2
  - type: js_global
    key: TDConversionObject
    id: global-3
  - type: js_global
    key: TradedoublerSDK
    id: global-4
  - type: js_global
    key: tdconv
    id: global-5
  - type: js_global
    key: tdconvObj
    id: global-6
  - type: resource_url
    contains: //svht.tradedoubler.com/
    id: host-7
  - type: resource_url
    contains: //swrap.tradedoubler.com/
    id: host-8
  - type: storage
    regex: (?i)^td_datalayer_events_to_process$
    id: storage-9
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. The Server header txserverhttp on sub-resources is likely
      Tradedoubler''s own server, but it is omitted as a signal because it is too uncertain as a site-level
      identifier. The td_/_td prefixes and the over-representation on Dutch webshops fit Tradedoubler''s
      affiliate tracking. I left out the _db1 global and the anonymous_id cookie because they are generic
      or ambiguous. No hosts or sample URLs were '
    corpus: nl-webshops, nl-browser-full-sample
    support: 70
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
