- extends: yisual-activeview
  signals:
  - type: js_global
    key: ysa_collectAllowedCookies
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. This is an inference from the prefix and the Dutch concentration
      (lift 47.4 on nl-webshops-no-platform). The only evidence is one global with no sample URLs, so
      the attribution to Yisual ActiveView is unverified.
    corpus: nl-webshops, nl-browser-full-sample
    support: 40
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global ysa_collectAllowedCookies
    page:
      url: https://example.test/
      js_globals:
        ysa_collectAllowedCookies: ''
    expect: {}
- extends: ziggy
  signals:
  - type: js_global
    key: Ziggy
    id: global-0
  - type: js_global
    key: route
    id: global-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The ziggy rule already exists. Add the global 'Ziggy' if it
      is missing, and 'route' as a weaker companion signal. 'route' alone is generic, so use it only together
      with Ziggy.
    corpus: nl-webshops, nl-browser-full-sample
    support: 99
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global Ziggy
    page:
      url: https://example.test/
      js_globals:
        Ziggy: ''
    expect: {}
  - name: global route
    page:
      url: https://example.test/
      js_globals:
        route: ''
    expect: {}
- extends: zoho-mail
  signals:
  - type: dns
    key: TXT
    contains: include:eu.transmail.net
    id: dns-0
  - type: dns
    key: TXT
    contains: include:spf.zoho.eu
    id: dns-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. spf.zoho.eu is Zoho's EU SPF include and belongs to the existing
      zoho-mail rule (zoho/zoho-mail may only cover .com). eu.transmail.net is Zoho ZeptoMail's EU sending
      domain; could alternatively be added to zoho-zeptomail. Both existing rules cover Zoho; the EU variants
      should be added.
    corpus: nl-webshops, nl-browser-full-sample
    support: 31
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns spf-include:eu.transmail.net
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:eu.transmail.net ~all
    expect: {}
  - name: dns spf-include:spf.zoho.eu
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:spf.zoho.eu ~all
    expect: {}
