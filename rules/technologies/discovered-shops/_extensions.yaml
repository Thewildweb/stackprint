- extends: uppromote
  signals:
  - type: js_global
    key: upAttribution
    id: global-0
  - type: js_global
    key: upDecorateUrl
    id: global-1
  - type: js_global
    key: upGtagConfig
    id: global-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. All three globals appear together on 43 sites, with a lift of
      about 246 on NL webshops where no platform was detected. The 'up' prefix and the attribution and
      URL-decoration functions fit UpPromote, but I did not confirm it from the tokens alone, so this
      is an educated match.
    corpus: nl-webshops, nl-browser-full-sample
    support: 43
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global upAttribution
    page:
      url: https://example.test/
      js_globals:
        upAttribution: ''
    expect: {}
  - name: global upDecorateUrl
    page:
      url: https://example.test/
      js_globals:
        upDecorateUrl: ''
    expect: {}
  - name: global upGtagConfig
    page:
      url: https://example.test/
      js_globals:
        upGtagConfig: ''
    expect: {}
