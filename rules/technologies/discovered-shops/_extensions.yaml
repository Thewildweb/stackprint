    key: __TRSTD_KEYCLOAK__
    id: global-2
  - type: js_global
    key: __trustbadgePrepare
    id: global-3
  - type: js_global
    key: trustbadge
    id: global-4
  - type: resource_url
    contains: //www.trustedshops.be/
    id: host-5
  - type: resource_url
    contains: //www.trustedshops.de/
    id: host-6
  - type: resource_url
    contains: //www.trustedshops.eu/
