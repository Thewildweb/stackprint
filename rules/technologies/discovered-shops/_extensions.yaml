    contains: //www.trustedshops.de/bewertung/
    id: hostdir-10
  - type: resource_url
    contains: //www.trustedshops.eu/buyerrating/
    id: hostdir-11
  - type: resource_url
    contains: //www.trustedshops.nl/verkopersbeoordeling/
    id: hostdir-12
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Tokens belong to the Trusted Shops Trustbadge. apigw-requestid
      is a generic AWS API Gateway header and data-aphrodite is ambiguous, so both are left out. Trusted
      Shops is already in the rule set as trusted-shops (Trusted Shops Trustbadge); these hosts can be
      added to that rule. Trusted Shops is already in the rule set as trusted-shops; the .be domain should
      be added to its host signals. Trusted Sh
    corpus: nl-webshops, nl-browser-full-sample
    support: 27
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
