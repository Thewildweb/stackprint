# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: fastly
  name: Fastly
  vendor: fastly
  website: https://www.fastly.com
  categories:
  - cdn
  signals:
  - type: dns
    key: CNAME
    regex: (?:^|[ .])global\.fastly\.net$
    id: dns-0
  - type: header
    key: server
    regex: (?i)^\s*fastly
    id: header-1
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. Fastly is not in the rule set. The server=fastly header
      on the page itself identifies the CDN, so it is a clear signal. Its high lift among webshops with
      no detected platform probably reflects that Fastly fronts several Dutch shop platforms. Fastly is
      not in the rule set. The CNAME is vendor-owned and specific. Over-representation on NL webshops
      without a detected platform fits custom or headless '
    corpus: nl-webshops, nl-browser-full-sample
    support: 314
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns cname:global.fastly.net
    page:
      url: https://example.test/
      dns:
        CNAME:
        - x.global.fastly.net
    expect: {}
  - name: header server=fastly
    page:
      url: https://example.test/
      headers:
      - - server
        - fastly
    expect: {}
