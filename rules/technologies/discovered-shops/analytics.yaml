- id: vp-conversion-tracking
  name: VP Conversion Tracking
  vendor: virtueplanet
  website: https://www.virtueplanet.com
  categories:
  - analytics
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/media/plg_vpconversiontracking/
    first_party: true
    id: path-0
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. The plg_ prefix means a Joomla plugin; it is likely VirtuePlanet''s
      VP Conversion Tracking for VirtueMart. It is a Joomla extension, not a WordPress plugin, so it is
      in scope. The path is first-party and product-specific, and 29 corpus sites show it with high lift
      among Dutch webshops with no detected platform. A better fit might be the VirtueMart platform itself,
      but this path identifies only the '
    corpus: nl-webshops, nl-browser-full-sample
    support: 11
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /media/plg_vpconversiontracking/
    page:
      url: https://example.test/
      html: <script src="/media/plg_vpconversiontracking/x.js"></script>
    expect: {}
