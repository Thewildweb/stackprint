# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: billypix
  name: BillyPix
  vendor: billypix
  website: https://billypix.com
  categories:
  - analytics
  signals:
  - type: cookie
    regex: (?i)^__billypix_session_id$
    id: cookie-0
  - type: cookie
    regex: (?i)^__billypix_sid$
    id: cookie-1
  - type: cookie
    regex: (?i)^__billypix_uid$
    id: cookie-2
  - type: js_global
    key: BillyPix
    id: global-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. BillyPix appears to be a tracking/pixel service used on Dutch
      webshops; the exact product category is inferred from the name and cookie pattern (uid/sid/session).
      The website URL is a guess.
    corpus: nl-webshops, nl-browser-full-sample
    support: 77
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie __billypix_session_id
    page:
      url: https://example.test/
      cookies:
      - name: __billypix_session_id
    expect: {}
  - name: cookie __billypix_sid
    page:
      url: https://example.test/
      cookies:
      - name: __billypix_sid
    expect: {}
  - name: cookie __billypix_uid
    page:
      url: https://example.test/
      cookies:
      - name: __billypix_uid
    expect: {}
  - name: global BillyPix
    page:
      url: https://example.test/
      js_globals:
        BillyPix: ''
    expect: {}
- id: heap
  name: Heap
  vendor: heap
  website: https://www.heap.io
  categories:
  - analytics
  signals:
  - type: js_global
    key: heap
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. window.heap is Heap's own global. The _cs_cu storage key and
      _cs_s_ctx cookie look like Contentsquare (_cs_ prefix); they are co-occurring, probably because
      Heap is often paired with Contentsquare, and are excluded. Contentsquare already exists in the rule
      set; these _cs_ tokens could be added there instead.
    corpus: nl-webshops, nl-browser-full-sample
    support: 27
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global heap
    page:
      url: https://example.test/
      js_globals:
        heap: ''
    expect: {}
- id: kickbite
  name: KickBite
  vendor: kickbite
  website: https://kickbite.io
  categories:
  - analytics
  signals:
  - type: cookie
    regex: (?i)^_kbuid$
    id: cookie-0
  - type: js_global
    key: _kbuid
    id: global-1
  - type: resource_url
    contains: //tr.kickbite.io/
    id: host-2
  - type: storage
    regex: (?i)^_kbuid$
    id: storage-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The _kbuid cookie, storage key and global co-occur with the
      tr.kickbite.io host on 10 sites. getCookieByName and u.js are too generic to use as signals. I'm
      identifying KickBite as a visitor tracking/attribution tool from the domain name and the kb prefix,
      not from product knowledge, hence medium confidence.
    corpus: nl-webshops, nl-browser-full-sample
    support: 28
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie _kbuid
    page:
      url: https://example.test/
      cookies:
      - name: _kbuid
    expect: {}
  - name: global _kbuid
    page:
      url: https://example.test/
      js_globals:
        _kbuid: ''
    expect: {}
  - name: host tr.kickbite.io
    page:
      url: https://example.test/
      html: <script src="https://tr.kickbite.io/x.js"></script>
    expect: {}
  - name: storage _kbuid
    page:
      url: https://example.test/
      storage:
      - key: _kbuid
    expect: {}
