# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: npm/flowbite
  name: Flowbite
  vendor: flowbite
  website: https://flowbite.com
  categories:
  - css-framework
  signals:
  - type: js_global
    key: FlowbiteInstances
    id: global-0
  - type: js_global
    key: initClipboards
    id: global-1
  - type: js_global
    key: initCollapses
    id: global-2
  - type: js_global
    key: initDatepickers
    id: global-3
  - type: js_global
    key: initDials
    id: global-4
  - type: js_global
    key: initDismisses
    id: global-5
  - type: js_global
    key: initDrawers
    id: global-6
  - type: js_global
    key: initFlowbite
    id: global-7
  - type: js_global
    key: initInputCounters
    id: global-8
  - type: js_global
    key: initPopovers
    id: global-9
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The tokens are the globals exposed by the Flowbite UI library
      (Tailwind CSS components), which is published on npm as flowbite. Generic tokens such as initTooltips,
      Dial, InputCounter and CopyClipboard were left out because other libraries could produce them.
    corpus: nl-webshops, nl-browser-full-sample
    support: 56
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global FlowbiteInstances
    page:
      url: https://example.test/
      js_globals:
        FlowbiteInstances: ''
    expect: {}
  - name: global initClipboards
    page:
      url: https://example.test/
      js_globals:
        initClipboards: ''
    expect: {}
  - name: global initCollapses
    page:
      url: https://example.test/
      js_globals:
        initCollapses: ''
    expect: {}
  - name: global initDatepickers
    page:
      url: https://example.test/
      js_globals:
        initDatepickers: ''
    expect: {}
  - name: global initDials
    page:
      url: https://example.test/
      js_globals:
        initDials: ''
    expect: {}
  - name: global initDismisses
    page:
      url: https://example.test/
      js_globals:
        initDismisses: ''
    expect: {}
  - name: global initDrawers
    page:
