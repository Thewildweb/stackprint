    regex: (?i)^_br_uid_[0-9]+$
    id: cookie-0
  - type: resource_url
    regex: (?i)/br\-trk\-[0-9]+\.js(?:[?#]|$)
    id: file-1
  - type: js_global
    key: BrTrk
    id: global-2
  - type: js_global
    key: br_data
    id: global-3
  - type: resource_url
    contains: //cdn.brcdn.com/
    id: host-4
  - type: resource_url
    contains: //p-eu.brsrvr.com/
    id: host-5
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Bloomreach (brsrvr/brcdn) search and merchandising tracking;
      urlLength/subUrlLength globals are generic-looking so left out.
    corpus: nl-webshops, nl-browser-full-sample
    support: 22
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
