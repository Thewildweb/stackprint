# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: algolia-insights
  name: Algolia Insights (search-insights)
  vendor: algolia
  website: https://www.algolia.com
  categories:
  - search
  signals:
  - type: js_global
    key: AlgoliaAnalytics
    id: global-0
  - type: js_global
    key: AlgoliaAnalyticsObject
    id: global-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. AlgoliaAnalyticsObject is the documented global name from the
      Algolia Insights loader snippet. Existing rule npm/algoliasearch is the client library; this global
      is specific to the Insights/analytics script, so a separate entry is reasonable. It could alternatively
      be merged into an Algolia rule if one is added. AlgoliaAnalytics is the window global created by
      Algolia's search-insights library, wh
    corpus: nl-webshops, nl-browser-full-sample
    support: 96
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global AlgoliaAnalytics
    page:
      url: https://example.test/
      js_globals:
        AlgoliaAnalytics: ''
    expect: {}
  - name: global AlgoliaAnalyticsObject
    page:
      url: https://example.test/
      js_globals:
        AlgoliaAnalyticsObject: ''
    expect: {}
- id: bloomreach-discovery
  name: Bloomreach Discovery
  vendor: bloomreach
  website: https://www.bloomreach.com
  categories:
  - search
  signals:
