# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: abtasty
  name: AB Tasty
  vendor: abtasty
  website: https://www.abtasty.com
  categories:
  - ab-testing
  signals:
  - type: cookie
    regex: (?i)^abtasty$
    id: cookie-0
  - type: cookie
    regex: (?i)^abtastysession$
    id: cookie-1
  - type: js_global
    key: ABTasty
    id: global-2
  - type: js_global
    key: ABTastyClickTracking
    id: global-3
  - type: js_global
    key: ABTastyPageView
    id: global-4
  - type: js_global
    key: ABTastyStartTest
    id: global-5
  - type: js_global
    key: _abtasty
    id: global-6
  - type: resource_url
    contains: //dcinfos-cache.abtasty.com/
    id: host-7
  - type: resource_url
    contains: //try.abtasty.com/
    id: host-8
  - type: storage
    regex: (?i)^abtastydata$
    id: storage-9
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. AB Tasty is an A/B testing and personalization platform; tokens
      clearly vendor-specific. ABTasty is the well-known window global of the AB Tasty client-side tag.
      Not in the existing rule set. The cookie name 'ABTasty' is AB Tasty's own. A/B testing is not in
      the rule set. The contrast set shows a lift of 24 on Dutch webshops, which fits a conversion-optimisation
      tool.
    corpus: nl-webshops, nl-browser-full-sample
    support: 33
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie abtasty
    page:
      url: https://example.test/
      cookies:
      - name: abtasty
    expect: {}
  - name: cookie abtastysession
    page:
      url: https://example.test/
      cookies:
      - name: abtastysession
    expect: {}
  - name: global ABTasty
    page:
      url: https://example.test/
      js_globals:
        ABTasty: ''
    expect: {}
  - name: global ABTastyClickTracking
    page:
      url: https://example.test/
      js_globals:
        ABTastyClickTracking: ''
    expect: {}
  - name: global ABTastyPageView
    page:
      url: https://example.test/
      js_globals:
        ABTastyPageView: ''
    expect: {}
  - name: global ABTastyStartTest
    page:
      url: https://example.test/
      js_globals:
        ABTastyStartTest: ''
    expect: {}
  - name: global _abtasty
    page:
      url: https://example.test/
      js_globals:
        _abtasty: ''
    expect: {}
  - name: host dcinfos-cache.abtasty.com
    page:
      url: https://example.test/
      html: <script src="https://dcinfos-cache.abtasty.com/x.js"></script>
    expect: {}
  - name: host try.abtasty.com
    page:
      url: https://example.test/
      html: <script src="https://try.abtasty.com/x.js"></script>
    expect: {}
  - name: storage abtastydata
    page:
      url: https://example.test/
      storage:
      - key: abtastydata
    expect: {}
