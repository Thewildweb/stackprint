# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: artlogic
  name: Artlogic
  vendor: artlogic
  website: https://www.artlogic.net
  categories:
  - cms
  signals:
  - type: resource_url
    contains: //static-assets.artlogic.net/
    id: host-0
  - type: resource_url
    regex: (?i)^https?://[^/]+/lib/archimedes/styles/
    first_party: true
    id: path-1
  - type: resource_url
    regex: (?i)^https?://[^/]+/lib/g/[0-9]+\.[0-9]+/styles/
    first_party: true
    id: path-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Artlogic is a CMS/platform for art galleries with an ecommerce
      cart (cart_session storage). Tokens clearly carry the vendor name. Artlogic provides websites and
      e-commerce for art galleries. The path contains the vendor name. The global useConsentMode and the
      file responsive_purchase_format_options.css co-occur on the same sites and likely belong to the
      platform, but they are less clearly vendor-s
    corpus: nl-webshops, nl-browser-full-sample
    support: 19
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host static-assets.artlogic.net
    page:
      url: https://example.test/
      html: <script src="https://static-assets.artlogic.net/x.js"></script>
    expect: {}
  - name: path /lib/archimedes/styles/
    page:
      url: https://example.test/
      html: <script src="/lib/archimedes/styles/x.js"></script>
    expect: {}
  - name: path /lib/g/#.#/styles/
    page:
      url: https://example.test/
      html: <script src="/lib/g/1.1/styles/x.js"></script>
    expect: {}
- id: artlogic-websites
  name: Artlogic Websites
  vendor: artlogic
  website: https://www.artlogic.net
