- id: jrny-cms
  name: JRNY CMS
  vendor: jrny
  website: https://jrny.nl
  categories:
  - cms
  signals:
  - type: js_global
    key: syvEvent
    id: global-0
  - type: meta
    key: generator
    regex: (?i)^\s*jrny\s+cms
    id: meta-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The generator meta is clear. The syvEvent global is probably
      the platform's own, but the product link is inferred. The cookie names are generic and were left
      out. getAllValues is also generic.
    corpus: nl-webshops, nl-browser-full-sample
    support: 20
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global syvEvent
    page:
      url: https://example.test/
      js_globals:
        syvEvent: ''
    expect: {}
  - name: meta generator=jrny cms
    page:
      url: https://example.test/
      html: <meta name="generator" content="jrny cms">
    expect: {}
- id: prismic
  name: Prismic
  vendor: prismic
  website: https://prismic.io
  categories:
  - cms
  signals:
  - type: resource_url
    regex: (?i)/prismic\.js(?:[?#]|$)
    id: file-0
  - type: resource_url
    regex: (?i)/prismic\.min\.js(?:[?#]|$)
    id: file-1
  - type: js_global
    key: PrismicToolbar
    id: global-2
  - type: js_global
    key: prismic
    id: global-3
  - type: resource_url
    contains: //images.prismic.io/
    id: host-4
  - type: resource_url
    contains: //static.cdn.prismic.io/
    id: host-5
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Prismic is a headless CMS. Hosts and globals are vendor-owned
      and specific. The /prismic/ path is weaker evidence since a first-party directory could be site-specific,
      so it is left out. prismic.min.js is the Prismic JS kit file name. Prismic is a headless CMS and
      is not in the rule set.
    corpus: nl-webshops, nl-browser-full-sample
    support: 59
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file prismic.js
    page:
      url: https://example.test/
      html: <script src="/assets/prismic.js"></script>
    expect: {}
  - name: file prismic.min.js
    page:
      url: https://example.test/
      html: <script src="/assets/prismic.min.js"></script>
    expect: {}
  - name: global PrismicToolbar
    page:
      url: https://example.test/
      js_globals:
        PrismicToolbar: ''
    expect: {}
  - name: global prismic
    page:
      url: https://example.test/
      js_globals:
        prismic: ''
    expect: {}
  - name: host images.prismic.io
    page:
      url: https://example.test/
      html: <script src="https://images.prismic.io/x.js"></script>
    expect: {}
  - name: host static.cdn.prismic.io
    page:
      url: https://example.test/
      html: <script src="https://static.cdn.prismic.io/x.js"></script>
    expect: {}
