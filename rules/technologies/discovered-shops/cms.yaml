    id: cookie-0
  - type: js_global
    key: ARTLOGIC_ASSET_SUFFIX
    id: global-1
  - type: js_global
    key: Artlogic
    id: global-2
  - type: js_global
    key: __artlogicReady
    id: global-3
  - type: js_global
    key: artlogic_websites_core
    id: global-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Artlogic is an art-gallery website/CMS platform; the 17 sites
      share many platform-specific globals. Generic globals like showForms and secureEval were left out.
    corpus: nl-webshops, nl-browser-full-sample
    support: 18
