# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: npm/@formkit/vue
  name: FormKit
  vendor: formkit
  website: https://formkit.com
  categories:
  - forms
  signals:
  - type: js_global
    key: __FORMKIT_CONFIGS__
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. __FORMKIT_CONFIGS__ is the global FormKit (the Vue form framework,
      npm @formkit/vue) uses to hold its configs. Support is 459 sites corpus-wide, and the lift of 7.2
      on Dutch webshops suggests a shared platform that uses it.
    corpus: nl-webshops, nl-browser-full-sample
    support: 24
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global __FORMKIT_CONFIGS__
    page:
      url: https://example.test/
      js_globals:
        __FORMKIT_CONFIGS__: ''
    expect: {}
