- id: bloomreach-engagement
  name: Bloomreach Engagement (Exponea)
  vendor: bloomreach
  website: https://www.bloomreach.com
  categories:
  - customer-data-platform
  signals:
  - type: cookie
    regex: (?i)^__exponea_etc__$
