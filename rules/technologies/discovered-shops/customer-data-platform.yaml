  - type: storage
    regex: (?i)^__exponea_last_session_start_timestamp__$
    id: storage-16
  - type: storage
    regex: (?i)^__exponea_tracking_definition__$
    id: storage-17
  provenance:
    method: mined
    basis: 'Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed
      tokens only, then replayed on the corpora. Exponea was rebranded as Bloomreach Engagement. Omitted
