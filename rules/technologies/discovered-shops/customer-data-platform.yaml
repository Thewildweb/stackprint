  - type: resource_url
    regex: (?i)/exponea\.min\.js(?:[?#]|$)
    id: file-2
  - type: js_global
    key: exponea
    id: global-3
  - type: js_global
    key: webxpClient
    id: global-4
  - type: js_global
    key: webxpClientInitialConfig
    id: global-5
  - type: resource_url
