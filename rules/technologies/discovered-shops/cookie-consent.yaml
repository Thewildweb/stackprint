- id: laravel-cookie-consent
  name: Laravel Cookie Consent
  vendor: spatie
  website: https://github.com/spatie/laravel-cookie-consent
  categories:
  - cookie-consent
  signals:
  - type: js_global
    key: laravelCookieConsent
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. laravelCookieConsent is the window object from spatie/laravel-cookie-consent,
      which ships with a COOKIE_DOMAIN constant in its inline script. COOKIE_DOMAIN is generic enough
      to be shared with other products, so it was left out of the signals.
    corpus: nl-webshops, nl-browser-full-sample
    support: 41
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global laravelCookieConsent
    page:
      url: https://example.test/
      js_globals:
        laravelCookieConsent: ''
    expect: {}
- id: ws-eucookie
  name: WS EuCookie (webshop cookie plugin)
  vendor: unknown
  categories:
  - cookie-consent
  signals:
  - type: js_global
    key: EuCookie
    id: global-0
  - type: resource_url
    regex: (?i)^https?://[^/]+/plugins/ws[0-9]+_eucookie/
    first_party: true
    id: path-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Plugin directory suggests a plugin-based shop platform (ws<N>_eucookie)
      used by Dutch webshops. The vendor and the platform are not identifiable from the tokens. main-v#.#.#.js
      is too generic, so it is left out.
    corpus: nl-webshops, nl-browser-full-sample
    support: 9
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global EuCookie
    page:
      url: https://example.test/
      js_globals:
        EuCookie: ''
    expect: {}
  - name: path /plugins/ws#_eucookie/
    page:
      url: https://example.test/
      html: <script src="/plugins/ws1_eucookie/x.js"></script>
    expect: {}
