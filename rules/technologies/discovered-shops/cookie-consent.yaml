# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: appconsent
  name: AppConsent
  vendor: appconsent
  website: https://www.appconsent.io
  categories:
  - cookie-consent
  signals:
  - type: cookie
    regex: (?i)^appconsent$
    id: cookie-0
  - type: js_global
    key: __unifiedSdkApi
    id: global-1
  - type: js_global
    key: webpackChunkappconsent
    id: global-2
  - type: resource_url
    contains: //cdn.appconsent.io/
    id: host-3
  - type: resource_url
    contains: //collector.appconsent.io/
    id: host-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. AppConsent is a French TCF consent management platform. cdn.blazimg.com
      appears to be the CDN of a shared site platform, not AppConsent, so it is left out.
    corpus: nl-webshops, nl-browser-full-sample
    support: 30
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie appconsent
    page:
      url: https://example.test/
      cookies:
      - name: appconsent
    expect: {}
  - name: global __unifiedSdkApi
    page:
      url: https://example.test/
      js_globals:
        __unifiedSdkApi: ''
    expect: {}
  - name: global webpackChunkappconsent
    page:
      url: https://example.test/
      js_globals:
        webpackChunkappconsent: ''
    expect: {}
  - name: host cdn.appconsent.io
    page:
      url: https://example.test/
      html: <script src="https://cdn.appconsent.io/x.js"></script>
    expect: {}
  - name: host collector.appconsent.io
    page:
      url: https://example.test/
      html: <script src="https://collector.appconsent.io/x.js"></script>
    expect: {}
