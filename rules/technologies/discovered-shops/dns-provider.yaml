# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: hostedby-dns
  name: HostedBy DNS
  vendor: hostedby
  website: https://hostedby.eu
  categories:
  - dns-provider
  signals:
  - type: dns
    key: NS
    regex: (?:^|[ .])hostedby\.be$
    id: dns-0
  - type: dns
    key: NS
    regex: (?:^|[ .])hostedby\.eu$
    id: dns-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The rule set already has 'hostedby-eu' (HostedBy), a hosting
      entry, which may cover the same vendor. This DNS entry could be merged into it. Both nameserver
      domains appear on about 1,000 sites each in the corpus, so they are not one company's own infrastructure.
    corpus: nl-webshops, nl-browser-full-sample
    support: 65
    mined_run: review-2026-11-shops
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns ns:hostedby.be
    page:
      url: https://example.test/
      dns:
        NS:
        - ns1.hostedby.be
    expect: {}
  - name: dns ns:hostedby.eu
    page:
      url: https://example.test/
      dns:
        NS:
        - ns1.hostedby.eu
    expect: {}
