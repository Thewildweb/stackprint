# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: adobe-audience-manager
  name: Adobe Audience Manager (Demdex)
  vendor: adobe
  website: https://business.adobe.com/products/audience-manager/adobe-audience-manager.html
  categories:
  - customer-data-platform
  signals:
  - type: cookie
    regex: (?i)^demdex$
    id: cookie-0
  - type: cookie
    regex: (?i)^dpm$
    id: cookie-1
  - type: resource_url
    contains: //dpm.demdex.net/
    id: host-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Reshdr x-tid and dcs are response headers from demdex and are
      not included as signals; they are less specific. Co-occurrence with google-tag is incidental.
    corpus: nl-browser-full-sample
    support: 46
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie demdex
    page:
      url: https://example.test/
      cookies:
      - name: demdex
    expect: {}
  - name: cookie dpm
    page:
      url: https://example.test/
      cookies:
      - name: dpm
    expect: {}
  - name: host dpm.demdex.net
    page:
      url: https://example.test/
      html: <script src="https://dpm.demdex.net/x.js"></script>
    expect: {}
