# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: amplitude
  name: Amplitude
  vendor: amplitude
  website: https://amplitude.com
  categories:
  - analytics
  signals:
  - type: cookie
    regex: (?i)^amp_[0-9a-f]+$
    id: cookie-0
  - type: js_global
    key: analyticsConnectorInstances
    id: global-1
  - type: storage
    regex: (?i)^amp_unsent_[0-9a-f]+$
    id: storage-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Amplitude Analytics browser SDK. The amp_ cookie prefix could
      in rare cases collide with other products, but it co-occurs with the other two Amplitude-specific
      tokens.
    corpus: nl-browser-full-sample
    support: 71
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie amp_*
    page:
      url: https://example.test/
      cookies:
      - name: amp_abcdef12
    expect: {}
  - name: global analyticsConnectorInstances
    page:
      url: https://example.test/
      js_globals:
        analyticsConnectorInstances: ''
    expect: {}
  - name: storage amp_unsent_*
    page:
      url: https://example.test/
      storage:
      - key: amp_unsent_abcdef12
    expect: {}
