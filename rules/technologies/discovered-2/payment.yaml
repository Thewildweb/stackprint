# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: adyen
  name: Adyen
  vendor: adyen
  website: https://www.adyen.com
  categories:
  - payment
  signals:
  - type: js_global
    key: AdyenCheckout
    id: global-0
  - type: resource_url
    contains: //checkoutshopper-live.adyen.com/
    id: host-1
  - type: resource_url
    contains: //checkoutshopper-live.adyen.com/checkoutshopper/
    id: hostdir-2
  - id: version-url
    type: resource_url
    regex: /checkoutshopper/sdk/([0-9.]+)/
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Adyen payment SDK. The best_label google-tag is only co-occurrence.
      The SDK version is visible in the URL path. Adyen is not in the rule set. The best_label npm/core-js
      with precision 1 is likely just a co-occurring bundled library, not ownership of the token.
    corpus: nl-browser-full-sample
    support: 66
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global AdyenCheckout
    page:
      url: https://example.test/
      js_globals:
        AdyenCheckout: ''
    expect: {}
  - name: host checkoutshopper-live.adyen.com
    page:
      url: https://example.test/
      html: <script src="https://checkoutshopper-live.adyen.com/x.js"></script>
    expect: {}
  - name: hostdir checkoutshopper-live.adyen.com/checkoutshopper/
    page:
      url: https://example.test/
      html: <script src="https://checkoutshopper-live.adyen.com/checkoutshopper/x.js"></script>
    expect: {}
