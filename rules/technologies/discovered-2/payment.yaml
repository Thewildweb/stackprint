- id: paypal
  name: PayPal Checkout (JS SDK)
  vendor: paypal
  website: https://developer.paypal.com/sdk/js/
  categories:
  - payment
  signals:
  - type: data_attr
    regex: (?i)^data\-uid\-auto$
    id: data-0
  - type: resource_url
    contains: //www.paypalobjects.com/
    id: host-1
  - type: resource_url
    contains: //www.paypal.com/sdk/
    id: hostdir-2
  - type: resource_url
    contains: //www.paypal.com/xoplatform/
    id: hostdir-3
  - type: resource_header
    key: paypal-debug-id
    id: reshdr-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The stripe rule exists but no PayPal rule does; npm/@paypal/paypal-js
      is only the npm library, while this cluster covers the SDK loaded from paypal.com. Left out the
      generic www.paypal.com host (also used for links) and disable-set-cookie (generic header name).
      paypalobjects.com is owned by PayPal. The existing npm/@paypal/paypal-js rule covers only the npm
      package, not PayPal buttons and checkout
    corpus: nl-browser-full-sample
    support: 82
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-uid-auto
    page:
      url: https://example.test/
      html: <div data-uid-auto="1"></div>
    expect: {}
  - name: host www.paypalobjects.com
    page:
      url: https://example.test/
      html: <script src="https://www.paypalobjects.com/x.js"></script>
    expect: {}
  - name: hostdir www.paypal.com/sdk/
    page:
      url: https://example.test/
      html: <script src="https://www.paypal.com/sdk/x.js"></script>
    expect: {}
  - name: hostdir www.paypal.com/xoplatform/
    page:
      url: https://example.test/
      html: <script src="https://www.paypal.com/xoplatform/x.js"></script>
    expect: {}
  - name: reshdr paypal-debug-id
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - paypal-debug-id
          - '1'
    expect: {}
