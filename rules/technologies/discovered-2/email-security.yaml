- id: denit-spamx
  name: DENIT SpamExperts (spamx)
  vendor: denit
  website: https://www.denit.nl
  categories:
  - email-security
  signals:
  - type: dns
    key: TXT
    contains: include:spf.spamx.denit.net
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Support of 1571 sites suggests a Dutch hosting-related mail
      filter. The jquery co-occurrence is incidental. The domain denit.net appears to belong to DENIT,
      a Dutch hosting provider. The existing spamexperts rule might already cover it, but no matching
      signal is shown, so a separate entry is proposed.
    corpus: nl-browser-full-sample
    support: 44
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns spf-include:spf.spamx.denit.net
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:spf.spamx.denit.net ~all
    expect: {}
- id: flexfilter
  name: FlexFilter
  vendor: flexfilter
  website: https://flexfilter.nl
  categories:
  - email-security
  signals:
  - type: dns
    key: MX
    regex: (?:^|[ .])srv1\.flexfilter\.nl$
    id: dns-0
  - type: dns
    key: MX
    regex: (?:^|[ .])srv2\.flexfilter\.nl$
    id: dns-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Flexfilter appears to be a Dutch email spam-filtering gateway,
      based on the MX hostnames. Both tokens have large support (~1400 sites), consistent with a shared
      filtering service. The jquery co-occurrence is incidental.
    corpus: nl-browser-full-sample
    support: 46
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns mx:srv1.flexfilter.nl
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.srv1.flexfilter.nl
    expect: {}
  - name: dns mx:srv2.flexfilter.nl
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.srv2.flexfilter.nl
    expect: {}
