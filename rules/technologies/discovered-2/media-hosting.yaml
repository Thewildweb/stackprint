# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: cloudinary
  name: Cloudinary
  vendor: cloudinary
  website: https://cloudinary.com
  categories:
  - media-hosting
  signals:
  - type: resource_url
    contains: //res.cloudinary.com/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. res.cloudinary.com is Cloudinary's default asset delivery host.
      The samples come from one church platform, but the host is the vendor's own domain and appears on
      3798 sites. The Server header value 'Cloudinary' is specific to the vendor's delivery network. It
      identifies assets served from Cloudinary, not the site's own web server.
    corpus: nl-browser-full-sample
    support: 116
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host res.cloudinary.com
    page:
      url: https://example.test/
      html: <script src="https://res.cloudinary.com/x.js"></script>
    expect: {}
