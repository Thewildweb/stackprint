# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: readspeaker-webreader
  name: ReadSpeaker webReader
  vendor: readspeaker
  website: https://www.readspeaker.com
  categories:
  - accessibility
  signals:
  - type: data_attr
    regex: (?i)^data\-rsevent\-id$
    id: data-0
  - type: resource_url
    regex: (?i)/readspeaker\.styles\-button\.css(?:[?#]|$)
    id: file-1
  - type: js_global
    key: ReadSpeaker
    id: global-2
  - type: js_global
    key: ReadSpeakerDefer
    id: global-3
  - type: js_global
    key: ReadSpeakerJIT
    id: global-4
  - type: js_global
    key: rsConf
    id: global-5
  - type: js_global
    key: rspkr
    id: global-6
  - type: resource_url
    contains: //cdn-eu.readspeaker.com/
    id: host-7
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. ReadSpeaker webReader text-to-speech accessibility widget. The
      generic file name webreader.js is excluded because it is generic and the vendor host and globals
      identify the product better.
    corpus: nl-browser-full-sample
    support: 79
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-rsevent-id
    page:
      url: https://example.test/
      html: <div data-rsevent-id="1"></div>
    expect: {}
  - name: file readspeaker.styles-button.css
    page:
      url: https://example.test/
      html: <script src="/assets/readspeaker.styles-button.css"></script>
    expect: {}
  - name: global ReadSpeaker
    page:
      url: https://example.test/
      js_globals:
        ReadSpeaker: ''
    expect: {}
  - name: global ReadSpeakerDefer
    page:
      url: https://example.test/
      js_globals:
        ReadSpeakerDefer: ''
    expect: {}
  - name: global ReadSpeakerJIT
    page:
      url: https://example.test/
      js_globals:
        ReadSpeakerJIT: ''
    expect: {}
  - name: global rsConf
    page:
      url: https://example.test/
      js_globals:
        rsConf: ''
    expect: {}
  - name: global rspkr
    page:
      url: https://example.test/
      js_globals:
        rspkr: ''
    expect: {}
  - name: host cdn-eu.readspeaker.com
    page:
      url: https://example.test/
      html: <script src="https://cdn-eu.readspeaker.com/x.js"></script>
    expect: {}
