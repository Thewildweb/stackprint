# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: cdnfonts
  name: CDNFonts
  vendor: cdnfonts
  website: https://www.cdnfonts.com
  categories:
  - font
  signals:
  - type: resource_url
    contains: //fonts.cdnfonts.com/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. fonts.cdnfonts.com is a dedicated web font CDN used by many
      sites (1665 support). Host alone is sufficient; the hostdir is redundant.
    corpus: nl-browser-full-sample
    support: 48
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host fonts.cdnfonts.com
    page:
      url: https://example.test/
      html: <script src="https://fonts.cdnfonts.com/x.js"></script>
    expect: {}
- id: cloudflare-fonts
  name: Cloudflare Fonts
  vendor: cloudflare
  website: https://developers.cloudflare.com/fonts/
  categories:
  - font
  signals:
  - type: resource_url
    regex: (?i)^https?://[^/]+/cf\-fonts/s/
    first_party: true
    id: path-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Cloudflare Fonts (the Google Fonts optimisation) serves font
      files from /cf-fonts/s/ and /cf-fonts/v/ on the site's own host. It is a distinct feature from the
      Cloudflare CDN rule (86.6% co-occurrence with cloudflare supports this).
    corpus: nl-browser-full-sample
    support: 35
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: path /cf-fonts/s/
    page:
      url: https://example.test/
      html: <script src="/cf-fonts/s/x.js"></script>
    expect: {}
- id: cufon
  name: Cufón
  vendor: cufon
  website: https://github.com/sorccu/cufon
  categories:
  - font
  signals:
  - type: resource_url
    regex: (?i)/cufon\-yui\.js(?:[?#]|$)
    id: file-0
  - type: js_global
    key: Cufon
    id: global-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Cufón is a legacy text-to-canvas/VML font replacement library,
      not on npm. Cufon global and cufon-yui.js are both distinctive.
    corpus: nl-browser-full-sample
    support: 72
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file cufon-yui.js
    page:
      url: https://example.test/
      html: <script src="/assets/cufon-yui.js"></script>
    expect: {}
  - name: global Cufon
    page:
      url: https://example.test/
      js_globals:
        Cufon: ''
    expect: {}
