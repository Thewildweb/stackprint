- id: basenet
  name: BaseNet
  vendor: basenet
  website: https://www.basenet.nl
  categories:
  - email-provider
  signals:
  - type: dns
    key: MX
    regex: (?:^|[ .])mx1\.basenet\.nl$
    id: dns-0
  - type: dns
    key: TXT
    contains: include:_spf.basenet.nl
    id: dns-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. BaseNet (basenet.nl) is a Dutch hosting and email provider.
      The 1400-1700 sites on its MX and SPF include indicate a broad customer base, so this is an email
      provider rule rather than a single company's own infrastructure. The jquery co-occurrence is incidental.
    corpus: nl-browser-full-sample
    support: 59
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns mx:mx1.basenet.nl
    page:
      url: https://example.test/
      dns:
        MX:
        - 10 mx.mx1.basenet.nl
    expect: {}
  - name: dns spf-include:_spf.basenet.nl
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:_spf.basenet.nl ~all
    expect: {}
