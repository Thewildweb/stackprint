# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: mapbox-gl-js
  name: Mapbox GL JS
  vendor: mapbox
  website: https://www.mapbox.com/mapbox-gl-js
  categories:
  - maps
  signals:
  - type: resource_url
    regex: (?i)/mapbox\-gl\.css(?:[?#]|$)
    id: file-0
  - type: resource_url
    regex: (?i)/mapbox\-gl\.js(?:[?#]|$)
    id: file-1
  - type: js_global
    key: mapboxgl
    id: global-2
  - type: resource_url
    contains: //api.mapbox.com/
    id: host-3
  - type: resource_url
    contains: //api.mapbox.com/mapbox-gl-js/
    id: hostdir-4
  - id: version-url
    type: resource_url
    regex: api\.mapbox\.com/mapbox-gl-js/v([0-9][0-9.]*)/mapbox-gl\.(?:js|css)
    version: \1
    version_confidence: medium
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Mapbox GL JS is a well-known mapping library. The version is
      visible in the CDN path.
    corpus: nl-browser-full-sample
    support: 120
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file mapbox-gl.css
    page:
      url: https://example.test/
      html: <script src="/assets/mapbox-gl.css"></script>
    expect: {}
  - name: file mapbox-gl.js
    page:
      url: https://example.test/
      html: <script src="/assets/mapbox-gl.js"></script>
    expect: {}
  - name: global mapboxgl
    page:
      url: https://example.test/
      js_globals:
        mapboxgl: ''
    expect: {}
  - name: host api.mapbox.com
    page:
      url: https://example.test/
      html: <script src="https://api.mapbox.com/x.js"></script>
    expect: {}
  - name: hostdir api.mapbox.com/mapbox-gl-js/
    page:
      url: https://example.test/
      html: <script src="https://api.mapbox.com/mapbox-gl-js/x.js"></script>
    expect: {}
