- id: commentsplugin
  name: Comments Plugin (Wix app)
  vendor: commentsplugin
  website: https://www.commentsplugin.com
  categories:
  - social
  signals:
  - type: resource_url
    contains: //app.commentsplugin.com/
    id: host-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Host co-occurs almost exclusively with Wix (0.999), so it is
      a Wix marketplace app serving a comments widget. The widget-wix path suggests the Wix integration.
      Category chosen as social since the app adds user comments.
    corpus: nl-browser-full-sample
    support: 58
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host app.commentsplugin.com
    page:
      url: https://example.test/
      html: <script src="https://app.commentsplugin.com/x.js"></script>
    expect: {}
