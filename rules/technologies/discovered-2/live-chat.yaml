- id: shopify-inbox
  name: Shopify Inbox
  vendor: shopify
  website: https://www.shopify.com/inbox
  categories:
  - live-chat
  signals:
  - type: data_attr
    regex: (?i)^data\-external\-identifier$
    id: data-0
  - type: data_attr
    regex: (?i)^data\-ternary\-color$
    id: data-1
  - type: resource_url
    regex: (?i)/inbox\-chat\-loader\.js(?:[?#]|$)
    id: file-2
  - type: resource_url
    regex: (?i)/shopifychatv[0-9]+widget\.js(?:[?#]|$)
    id: file-3
  - type: storage
    regex: (?i)^shopifychatdata$
    id: storage-4
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The cluster is Shopify Inbox, the chat widget on Shopify stores.
      The file and storage tokens are specific to it. Other data-* attributes (data-shop-domain, data-vertical-position,
      etc.) are likely generic Shopify or Inbox config and are left out. bugsnag-anonymous-id is a generic
      Bugsnag token.
    corpus: nl-browser-full-sample
    support: 159
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-external-identifier
    page:
      url: https://example.test/
      html: <div data-external-identifier="1"></div>
    expect: {}
  - name: data data-ternary-color
    page:
      url: https://example.test/
      html: <div data-ternary-color="1"></div>
    expect: {}
  - name: file inbox-chat-loader.js
    page:
      url: https://example.test/
      html: <script src="/assets/inbox-chat-loader.js"></script>
    expect: {}
  - name: file shopifychatv#widget.js
    page:
      url: https://example.test/
      html: <script src="/assets/shopifychatv1widget.js"></script>
    expect: {}
  - name: storage shopifychatdata
    page:
      url: https://example.test/
      storage:
      - key: shopifychatdata
    expect: {}
