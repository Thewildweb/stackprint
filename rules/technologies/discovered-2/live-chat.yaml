# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: crisp
  name: Crisp
  vendor: crisp
  website: https://crisp.chat
  categories:
  - live-chat
  signals:
  - type: js_global
    key: $crisp
    id: global-0
  - type: js_global
    key: CRISP_WEBSITE_ID
    id: global-1
  - type: resource_url
    contains: //client.crisp.chat/
    id: host-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Crisp live chat widget, not in the rule set. The hostdir tokens
      are redundant given the host signal, so they are omitted.
    corpus: nl-browser-full-sample
    support: 39
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global $crisp
    page:
      url: https://example.test/
      js_globals:
        $crisp: ''
    expect: {}
  - name: global CRISP_WEBSITE_ID
    page:
      url: https://example.test/
      js_globals:
        CRISP_WEBSITE_ID: ''
    expect: {}
  - name: host client.crisp.chat
    page:
      url: https://example.test/
      html: <script src="https://client.crisp.chat/x.js"></script>
    expect: {}
