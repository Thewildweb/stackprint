# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: mod-pagespeed
  name: mod_pagespeed
  vendor: apache
  website: https://www.modpagespeed.com
  categories:
  - cache
  signals:
  - type: data_attr
    regex: (?i)^data\-pagespeed\-url\-hash$
    id: data-0
  - type: js_global
    key: pagespeed
    id: global-1
  - type: header
    key: x-mod-pagespeed
    id: header-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The X-Mod-Pagespeed header is specific to the PageSpeed optimization
      module for Apache/Nginx. Its value usually carries a version, but only the header name is observed
      here, so no version rule is given. mod_pagespeed and ngx_pagespeed (also PageSpeed Service, Apache/Nginx
      modules) add these markers server-side. They are a server-side optimisation module, not a specific
      host.
    corpus: nl-browser-full-sample
    support: 55
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-pagespeed-url-hash
    page:
      url: https://example.test/
      html: <div data-pagespeed-url-hash="1"></div>
    expect: {}
  - name: global pagespeed
    page:
      url: https://example.test/
      js_globals:
        pagespeed: ''
    expect: {}
  - name: header x-mod-pagespeed
    page:
      url: https://example.test/
      headers:
      - - x-mod-pagespeed
        - '1'
    expect: {}
- id: nitropack
  name: NitroPack
  vendor: nitropack
  website: https://nitropack.io
  categories:
  - cache
  signals:
  - type: cookie
    regex: (?i)^nitrocachedpage$
    id: cookie-0
  - type: data_attr
    regex: (?i)^data\-nitro\-empty\-id$
    id: data-1
  - type: data_attr
    regex: (?i)^data\-nitro\-marker\-id$
    id: data-2
  - type: resource_url
    regex: (?i)/nitro\-min\-noimport\-[0-9a-f]+\-stylesheet\.css(?:[?#]|$)
    id: file-3
  - type: js_global
    key: IS_NITROPACK
    id: global-4
  - type: js_global
    key: NITROPACK_STATE
    id: global-5
  - type: js_global
    key: NitroPack
    id: global-6
  - type: js_global
    key: NitroScrollHelper
    id: global-7
  - type: js_global
    key: nitroData
    id: global-8
  - type: resource_url
    contains: //to.getnitropack.com/
    id: host-9
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. proxyPurgeOnly omitted as less clearly vendor-named; the other
      tokens are clearly NitroPack's. NitroPack is a site speed/caching optimization service. Generic
      globals like baseURI, remainingCount, preloadRequests excluded. The co-occurrence with Cloudflare
      is incidental.
    corpus: nl-browser-full-sample
    support: 76
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie nitrocachedpage
    page:
      url: https://example.test/
      cookies:
      - name: nitrocachedpage
    expect: {}
  - name: data data-nitro-empty-id
    page:
      url: https://example.test/
      html: <div data-nitro-empty-id="1"></div>
    expect: {}
  - name: data data-nitro-marker-id
    page:
      url: https://example.test/
      html: <div data-nitro-marker-id="1"></div>
    expect: {}
  - name: file nitro-min-noimport-*-stylesheet.css
    page:
      url: https://example.test/
      html: <script src="/assets/nitro-min-noimport-abcdef12-stylesheet.css"></script>
    expect: {}
  - name: global IS_NITROPACK
    page:
      url: https://example.test/
      js_globals:
        IS_NITROPACK: ''
    expect: {}
  - name: global NITROPACK_STATE
    page:
      url: https://example.test/
      js_globals:
        NITROPACK_STATE: ''
    expect: {}
  - name: global NitroPack
    page:
      url: https://example.test/
      js_globals:
        NitroPack: ''
    expect: {}
  - name: global NitroScrollHelper
    page:
      url: https://example.test/
      js_globals:
        NitroScrollHelper: ''
    expect: {}
  - name: global nitroData
    page:
      url: https://example.test/
      js_globals:
        nitroData: ''
    expect: {}
  - name: host to.getnitropack.com
    page:
      url: https://example.test/
      html: <script src="https://to.getnitropack.com/x.js"></script>
    expect: {}
- id: runcache
  name: RunCache
  vendor: runcloud
  website: https://runcloud.io
  categories:
  - cache
  signals:
  - type: resource_header
    key: x-runcache-type
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. x-runcache-type appears to come from RunCache by RunCloud, a
      server-side WordPress page cache. It is seen as a sub-resource header, so it identifies the cache
      vendor serving the asset. Identification rests on my own knowledge, not on the single token provided.
    corpus: nl-browser-full-sample
    support: 42
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-runcache-type
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-runcache-type
          - '1'
    expect: {}
