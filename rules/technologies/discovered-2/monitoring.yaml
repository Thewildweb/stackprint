- id: dynatrace
  name: Dynatrace OneAgent
  vendor: dynatrace
  website: https://www.dynatrace.com
  categories:
  - monitoring
  signals:
  - type: resource_header
    key: x-oneagent-js-injection
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The header is Dynatrace-specific. It appears as a sub-resource
      header (reshdr), so it likely comes from a third-party asset or API response served behind OneAgent.
      It indicates Dynatrace is used by that third party, not necessarily the site itself, hence medium
      confidence. The high co-occurrence with google-tag is probably because that script is loaded from
      Google-served resources.
    corpus: nl-browser-full-sample
    support: 32
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr x-oneagent-js-injection
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-oneagent-js-injection
          - '1'
    expect: {}
- id: npm/tracekit
  name: TraceKit
  vendor: tracekit
  website: https://github.com/csnover/TraceKit
  categories:
  - monitoring
  signals:
  - type: js_global
    key: TraceKit
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The global is specific to TraceKit. Its co-occurrence with core-js
      is probably because the two are bundled together. It may also come from Raven.js, which embeds TraceKit,
      so detection means TraceKit is present rather than that a specific product is used.
    corpus: nl-browser-full-sample
    support: 50
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global TraceKit
    page:
      url: https://example.test/
      js_globals:
        TraceKit: ''
    expect: {}
