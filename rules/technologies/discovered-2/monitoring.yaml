      url: https://example.test/
      js_globals:
        __tsUtils$gblCfg: ''
    expect: {}
  - name: global appInsights
    page:
      url: https://example.test/
      js_globals:
        appInsights: ''
    expect: {}
  - name: host dc.services.visualstudio.com
    page:
      url: https://example.test/
      html: <script src="https://dc.services.visualstudio.com/x.js"></script>
    expect: {}
  - name: host js.monitor.azure.com
    page:
      url: https://example.test/
      html: <script src="https://js.monitor.azure.com/x.js"></script>
    expect: {}
  - name: storage ai_buffer
    page:
      url: https://example.test/
      storage:
      - key: ai_buffer
    expect: {}
  - name: storage ai_sentbuffer
    page:
      url: https://example.test/
      storage:
      - key: ai_sentbuffer
    expect: {}
