- id: azure-application-insights
  name: Azure Application Insights
  vendor: microsoft
  website: https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview
  categories:
  - monitoring
  signals:
  - type: cookie
    regex: (?i)^ai_session$
    id: cookie-0
  - type: cookie
    regex: (?i)^ai_user$
    id: cookie-1
  - type: js_global
    key: __dynProto$Gbl
    id: global-2
  - type: js_global
    key: __tsUtils$gblCfg
    id: global-3
  - type: js_global
    key: appInsights
    id: global-4
  - type: resource_url
    contains: //dc.services.visualstudio.com/
    id: host-5
  - type: resource_url
    contains: //js.monitor.azure.com/
    id: host-6
  - type: storage
    regex: (?i)^ai_buffer$
    id: storage-7
  - type: storage
    regex: (?i)^ai_sentbuffer$
    id: storage-8
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The x-ms-* response headers are generic Azure Blob Storage headers,
      so they are not used as signals. They appear because the SDK is served from blob storage. The global
      'Microsoft' is too generic to use. ai_buffer and ai_sentbuffer are the well-known Application Insights
      SDK storage keys. x-ms-copy-source is an Azure Blob Storage header, which is generic to Azure storage
      and is left out. dc.servic
    corpus: nl-browser-full-sample
    support: 114
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie ai_session
    page:
      url: https://example.test/
      cookies:
      - name: ai_session
    expect: {}
  - name: cookie ai_user
    page:
      url: https://example.test/
      cookies:
      - name: ai_user
    expect: {}
  - name: global __dynProto$Gbl
