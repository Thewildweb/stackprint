    id: file-0
  - type: resource_url
    contains: //d2wy8f7a9ursnm.cloudfront.net/
    id: host-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The CDN path carries only the major version (v8, v4), so the
      version capture is the major number. The hostdir token was left out because the host is already
      a signal.
