- id: akamai-mpulse
  name: Akamai mPulse
  vendor: akamai
  website: https://www.akamai.com/products/mpulse-real-user-monitoring
  categories:
  - monitoring
  signals:
  - type: js_global
    key: BOOMR_API_key
    id: global-0
  - type: js_global
    key: BOOMR_mq
    id: global-1
  - type: resource_url
    contains: //c.go-mpulse.net/
    id: host-2
  - type: resource_url
    contains: //s.go-mpulse.net/
    id: host-3
  - type: resource_url
    contains: //s2.go-mpulse.net/
    id: host-4
  - type: resource_url
    contains: //c.go-mpulse.net/api/
    id: hostdir-5
  - type: resource_url
    contains: //s.go-mpulse.net/boomerang/
    id: hostdir-6
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. go-mpulse.net is owned by Akamai (mPulse, formerly SOASTA).
      The BOOMR globals also appear with the open-source Boomerang library, so only the BOOMR_API_key
      and BOOMR_mq globals are kept as supporting signals. The customappheader reshdr is excluded as too
      generic.
    corpus: nl-browser-full-sample
    support: 37
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global BOOMR_API_key
    page:
      url: https://example.test/
      js_globals:
        BOOMR_API_key: ''
    expect: {}
  - name: global BOOMR_mq
    page:
      url: https://example.test/
      js_globals:
        BOOMR_mq: ''
    expect: {}
  - name: host c.go-mpulse.net
    page:
      url: https://example.test/
      html: <script src="https://c.go-mpulse.net/x.js"></script>
    expect: {}
  - name: host s.go-mpulse.net
    page:
      url: https://example.test/
      html: <script src="https://s.go-mpulse.net/x.js"></script>
    expect: {}
  - name: host s2.go-mpulse.net
    page:
      url: https://example.test/
      html: <script src="https://s2.go-mpulse.net/x.js"></script>
