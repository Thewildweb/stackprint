# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: friendly-captcha
  name: Friendly Captcha
  vendor: friendly-captcha
  website: https://friendlycaptcha.com
  categories:
  - captcha
  signals:
  - type: data_attr
    regex: (?i)^data\-\-frc\-frame\-id$
    id: data-0
  - type: js_global
    key: frcaptcha
    id: global-1
  - type: js_global
    key: friendlyChallenge
    id: global-2
  - type: resource_url
    contains: //eu.frcapi.com/
    id: host-3
  - type: storage
    regex: (?i)^frc_sc$
    id: storage-4
  - type: storage
    regex: (?i)^frc_sid$
    id: storage-5
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The hostdir token duplicates the host signal, so it is omitted.
      The high co-occurrence with one-com-web-editor suggests that site builder bundles the captcha in
      its forms. The high co-occurrence with jQuery is likely because the sites are mostly WordPress sites,
      where the Friendly Captcha plugin is common; the global itself is specific to the product.
    corpus: nl-browser-full-sample
    support: 115
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data--frc-frame-id
    page:
      url: https://example.test/
      html: <div data--frc-frame-id="1"></div>
    expect: {}
  - name: global frcaptcha
    page:
      url: https://example.test/
      js_globals:
        frcaptcha: ''
    expect: {}
  - name: global friendlyChallenge
    page:
      url: https://example.test/
      js_globals:
        friendlyChallenge: ''
    expect: {}
  - name: host eu.frcapi.com
    page:
      url: https://example.test/
      html: <script src="https://eu.frcapi.com/x.js"></script>
    expect: {}
  - name: storage frc_sc
    page:
      url: https://example.test/
      storage:
      - key: frc_sc
    expect: {}
  - name: storage frc_sid
    page:
      url: https://example.test/
      storage:
      - key: frc_sid
    expect: {}
- id: siteground-captcha
  name: SiteGround CAPTCHA
  vendor: siteground
  website: https://www.siteground.com
  categories:
  - captcha
  signals:
  - type: resource_header
    key: sg-captcha
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The sg-captcha header comes from SiteGround's anti-bot challenge,
      which I recognise as SiteGround's own; the single observed token does not confirm that. Seen as
      a reshdr, it shows that a loaded asset was served from SiteGround infrastructure. It does not prove
      that the site itself is hosted there. The existing 'siteground' hosting rule might be a better home
      for it, but the id given is a separate
    corpus: nl-browser-full-sample
    support: 52
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr sg-captcha
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - sg-captcha
          - '1'
    expect: {}
