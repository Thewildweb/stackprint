- id: brizy
  name: Brizy
  vendor: brizy
  website: https://www.brizy.io
  categories:
  - page-builder
  signals:
  - type: data_attr
    regex: (?i)^data\-brz\-custom\-id$
    id: data-0
  - type: data_attr
    regex: (?i)^data\-brz\-group$
    id: data-1
  - type: data_attr
    regex: (?i)^data\-brz\-link\-type$
    id: data-2
  - type: js_global
    key: BrizyLibs
    id: global-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The data-brz-* attributes and BrizyLibs global are Brizy page
      builder. __CONFIG__, data-uniq-id and data-generated-css are generic or ambiguous, so they were
      left out.
    corpus: nl-browser-full-sample
    support: 48
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: data data-brz-custom-id
    page:
      url: https://example.test/
      html: <div data-brz-custom-id="1"></div>
    expect: {}
  - name: data data-brz-group
    page:
      url: https://example.test/
      html: <div data-brz-group="1"></div>
    expect: {}
  - name: data data-brz-link-type
    page:
      url: https://example.test/
      html: <div data-brz-link-type="1"></div>
    expect: {}
  - name: global BrizyLibs
    page:
      url: https://example.test/
      js_globals:
        BrizyLibs: ''
    expect: {}
- id: pagefly
