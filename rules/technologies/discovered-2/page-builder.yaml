  vendor: pagefly
  website: https://pagefly.io
  categories:
  - page-builder
  signals:
  - type: resource_url
    regex: (?i)/pagefly\-accordion\.js(?:[?#]|$)
    id: file-0
  - type: resource_url
    regex: (?i)/pagefly\-click\-action\-element\.js(?:[?#]|$)
    id: file-1
  - type: resource_url
    regex: (?i)/pagefly\-dialog\-element\.js(?:[?#]|$)
    id: file-2
  - type: js_global
    key: PAGEFLY_CRO
    id: global-3
  - type: js_global
    key: __pagefly_heatmap_config__
    id: global-4
  - type: storage
    regex: (?i)^pf_shop_domain$
