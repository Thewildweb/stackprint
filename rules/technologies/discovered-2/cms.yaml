- id: artisteer
  name: Artisteer
  vendor: extensoft
  website: https://www.artisteer.com
  categories:
  - cms
  signals:
  - type: comment
    regex: (?i)^\s*created\s+by\s+artisteer\s+v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+
    id: comment-0
  - type: resource_url
    regex: (?i)/script\.responsive\.js(?:[?#]|$)
    id: file-1
  - type: js_global
    key: ThemeLightbox
    id: global-2
  - type: js_global
    key: artButtonSetup
    id: global-3
  - type: js_global
    key: fixRssIconLineHeight
    id: global-4
  - type: js_global
    key: setHMenuOpenDirection
    id: global-5
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Artisteer is a theme generator for WordPress, Joomla, Drupal
      and others, so it is a theme generator rather than a CMS. Category 'cms' is the closest fit and
      the tokens identify generated themes across platforms. The comment version is normalised, so no
      version is extracted.
    corpus: nl-browser-full-sample
    support: 141
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: comment created by artisteer v#.#.#.#
    page:
      url: https://example.test/
      html: <!-- created by artisteer v1.1.1.1 -->
    expect: {}
  - name: file script.responsive.js
    page:
      url: https://example.test/
      html: <script src="/assets/script.responsive.js"></script>
    expect: {}
  - name: global ThemeLightbox
    page:
      url: https://example.test/
