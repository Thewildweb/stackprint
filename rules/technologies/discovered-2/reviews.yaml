- id: kiyoh
  name: Kiyoh
  vendor: kiyoh
  website: https://www.kiyoh.com
  categories:
  - reviews
  signals:
  - type: resource_url
    contains: //www.kiyoh.com/
    id: host-0
  - type: resource_url
    contains: //www.kiyoh.com/assets/
    id: hostdir-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Kiyoh is a Dutch customer review platform (Customer Feedback
      Company group). Widget loaded from www.kiyoh.com/assets/js/widget.js.
    corpus: nl-browser-full-sample
    support: 65
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host www.kiyoh.com
    page:
      url: https://example.test/
      html: <script src="https://www.kiyoh.com/x.js"></script>
    expect: {}
  - name: hostdir www.kiyoh.com/assets/
    page:
      url: https://example.test/
      html: <script src="https://www.kiyoh.com/assets/x.js"></script>
    expect: {}
