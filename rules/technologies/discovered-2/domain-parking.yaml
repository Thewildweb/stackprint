- id: afternic
  name: Afternic Domain For Sale Page
  vendor: godaddy
  website: https://www.afternic.com
  categories:
  - domain-parking
  signals:
  - type: dns
    key: NS
    regex: (?:^|[ .])afternic\.com$
    id: dns-0
  - type: resource_url
    regex: (?i)/scc\-afternic\-c[0-9]+\.min\.js(?:[?#]|$)
    id: file-1
  - type: resource_url
    regex: (?i)^https?://[^/]+/forsale/imgs/afternic/
    first_party: true
    id: path-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The cluster is Afternic (GoDaddy) domain-for-sale landing pages.
      The Akamai Bot Manager tokens (bm_*, ak_bm_tab_id, aksb.min.js, ds-aksb-a.akamaihd.net) are Akamai's,
      shared by many sites, so they are excluded. The x-arc header and the market and _ga cookies are
      too generic or unclear to use. Afternic is a GoDaddy-owned domain aftermarket; its nameservers are
      the vendor's own domain. Fits domain-p
    corpus: nl-browser-full-sample
    support: 99
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns ns:afternic.com
    page:
      url: https://example.test/
      dns:
        NS:
        - ns1.afternic.com
    expect: {}
  - name: file scc-afternic-c#.min.js
    page:
      url: https://example.test/
      html: <script src="/assets/scc-afternic-c1.min.js"></script>
    expect: {}
  - name: path /forsale/imgs/afternic/
    page:
      url: https://example.test/
      html: <script src="/forsale/imgs/afternic/x.js"></script>
    expect: {}
