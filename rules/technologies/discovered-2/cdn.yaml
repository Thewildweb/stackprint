# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: azure-front-door
  name: Azure Front Door
  vendor: microsoft
  website: https://azure.microsoft.com/products/frontdoor
  categories:
  - cdn
  signals:
  - type: header
    key: x-azure-ref
    id: header-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The header is shared by Azure Front Door and Azure CDN (Microsoft
      edge), so it is labeled as Azure Front Door. The co-occurrence with google-tag is incidental.
    corpus: nl-browser-full-sample
    support: 41
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: header x-azure-ref
    page:
      url: https://example.test/
      headers:
      - - x-azure-ref
        - '1'
    expect: {}
- id: cm4all-c4t
  name: CM4all C4T CDN
  vendor: ionos
  website: https://www.cm4all.com
  categories:
  - cdn
  signals:
  - type: comment
    regex: (?i)^\s*com\.cm[0-9]+all\.wdn\.button
    id: comment-0
  - type: resource_url
    contains: //cdn-eu.c4t.cc/
    id: host-1
  - type: resource_url
    regex: (?i)^https?://[^/]+/\.cm[0-9]+all/widgetres\.php/com\.cm[0-9]+all\.wdn\.button/
    first_party: true
    id: path-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The existing rule cm4all (CM4all) is a site builder. These tokens
      likely belong to it, so this may be better added to that rule (existing_tech_id cm4all). I chose
      a new entry only for the c4t.cc CDN, but the widgetres.php paths are clearly CM4all. 'deferred'
      global is generic and was left out.
    corpus: nl-browser-full-sample
    support: 182
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: comment com.cm#all.wdn.button
    page:
      url: https://example.test/
      html: <!-- com.cm1all.wdn.button -->
    expect: {}
  - name: host cdn-eu.c4t.cc
    page:
      url: https://example.test/
      html: <script src="https://cdn-eu.c4t.cc/x.js"></script>
    expect: {}
  - name: path /.cm#all/widgetres.php/com.cm#all.wdn.button/
    page:
      url: https://example.test/
      html: <script src="/.cm1all/widgetres.php/com.cm1all.wdn.button/x.js"></script>
    expect: {}
