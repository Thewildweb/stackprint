# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: akamai-bot-manager
  name: Akamai Bot Manager
  vendor: akamai
  website: https://www.akamai.com/products/bot-manager
  categories:
  - security
  signals:
  - type: cookie
    regex: (?i)^_abck$
    id: cookie-0
  - type: cookie
    regex: (?i)^ak_bmsc$
    id: cookie-1
  - type: cookie
    regex: (?i)^bm_sz$
    id: cookie-2
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. The cookie is Akamai-specific. It is set by Akamai Bot Manager,
      and sometimes on sites with Akamai Kona or edge services, so it identifies Akamai bot protection
      rather than the CDN as a whole. The co-occurrence with nextjs is incidental, since large sites use
      both. The _abck and bm_sz cookies are well-known Akamai Bot Manager cookies. They co-occur on 1957
      sites, and the high precision with google
    corpus: nl-browser-full-sample
    support: 206
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: cookie _abck
    page:
      url: https://example.test/
      cookies:
      - name: _abck
    expect: {}
  - name: cookie ak_bmsc
    page:
      url: https://example.test/
      cookies:
      - name: ak_bmsc
    expect: {}
  - name: cookie bm_sz
    page:
      url: https://example.test/
      cookies:
      - name: bm_sz
    expect: {}
- id: dmca-badge
  name: DMCA Protection Badge
  vendor: dmca-com
  website: https://www.dmca.com
  categories:
  - security
  signals:
  - type: resource_url
    regex: (?i)/dmcabadgehelper\.min\.js(?:[?#]|$)
    id: file-0
  - type: resource_url
    contains: //images.dmca.com/
    id: host-1
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. DMCA.com content protection badge widely embedded across sites
      (mostly WordPress). Category security is the closest available fit.
    corpus: nl-browser-full-sample
    support: 61
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: file dmcabadgehelper.min.js
    page:
      url: https://example.test/
      html: <script src="/assets/dmcabadgehelper.min.js"></script>
    expect: {}
  - name: host images.dmca.com
    page:
      url: https://example.test/
      html: <script src="https://images.dmca.com/x.js"></script>
    expect: {}
- id: flowguard
  name: Flowguard
  vendor: flowguard
  website: https://flowguard.network
  categories:
  - security
  signals:
  - type: resource_header
    key: fg-stream
    id: reshdr-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Identification is from the header token names only. Flowguard
      appears to be a proxy or protection service, so category security is a best guess. Neither token
      appears on a sub-resource host, so this identifies the vendor serving the asset, not the site's
      own infrastructure.
    corpus: nl-browser-full-sample
    support: 36
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: reshdr fg-stream
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - fg-stream
          - '1'
    expect: {}
- id: npm/@thumbmarkjs/thumbmarkjs
  name: ThumbmarkJS
  vendor: thumbmarkjs
  website: https://www.thumbmarkjs.com
  categories:
  - security
  signals:
  - type: js_global
    key: ThumbmarkJS
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. ThumbmarkJS is an open-source browser fingerprinting library.
      It is probably bundled in a popular WordPress plugin (74.6% co-occurrence with wordpress), but the
      global itself is specific to the library. The npm package name is from memory and not confirmed
      by the observations.
    corpus: nl-browser-full-sample
    support: 73
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global ThumbmarkJS
    page:
      url: https://example.test/
      js_globals:
        ThumbmarkJS: ''
    expect: {}
