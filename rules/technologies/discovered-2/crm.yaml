- id: gripp
  name: Gripp
  vendor: gripp
  website: https://www.gripp.com
  categories:
  - crm
  signals:
  - type: dns
    key: TXT
    contains: include:_spf.gripp.com
    id: dns-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Gripp is Dutch CRM/project management/invoicing software. The
      SPF include indicates use of the product's email sending. The co-occurrence with jQuery is incidental.
    corpus: nl-browser-full-sample
    support: 48
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: dns spf-include:_spf.gripp.com
    page:
      url: https://example.test/
      dns:
        TXT:
        - v=spf1 include:_spf.gripp.com ~all
    expect: {}
