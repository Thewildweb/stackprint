# Discovered from crawl data: LLM-reviewed (llm + corpus replay), signals limited to
# observed tokens, replay-validated. Generated by the review pipeline; edit by
# regenerating or move a rule to a curated file before hand edits.
- id: awin
  name: Awin
  vendor: awin
  website: https://www.awin.com
  categories:
  - affiliate
  signals:
  - type: js_global
    key: AWIN
    id: global-0
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Only the global token is listed; it is fairly distinctive to
      Awin's affiliate tracking. The co-occurrence with google-tag is likely because of the sites' marketing
      stacks and does not suggest the global belongs to gtag.
    corpus: nl-browser-full-sample
    support: 36
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: global AWIN
    page:
      url: https://example.test/
      js_globals:
        AWIN: ''
    expect: {}
- id: tradetracker
  name: TradeTracker
  vendor: tradetracker
  website: https://tradetracker.com
  categories:
  - affiliate
  signals:
  - type: comment
    regex: (?i)^\s*begin\s+tradetracker\s+supertag\s+code
    id: comment-0
  - type: js_global
    key: TTInstanceRef
    id: global-1
  - type: js_global
    key: TradeTrackerTag
    id: global-2
  - type: js_global
    key: _TradeTrackerTagOptions
    id: global-3
  - type: js_global
    key: oTradeTrackerTag
    id: global-4
  - type: resource_url
    contains: //static.tradetracker.net/
    id: host-5
  - type: resource_url
    contains: //tm.tradetracker.net/
    id: host-6
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. TradeTracker is an affiliate marketing network; its SuperTag
      is a tracking script that loads from tm.tradetracker.net. TradeTracker is an affiliate network;
      publishers embed banner material from static.tradetracker.net. The hostdir token is redundant with
      the host.
    corpus: nl-browser-full-sample
    support: 126
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: comment begin tradetracker supertag code
    page:
      url: https://example.test/
      html: <!-- begin tradetracker supertag code -->
    expect: {}
  - name: global TTInstanceRef
    page:
      url: https://example.test/
      js_globals:
        TTInstanceRef: ''
    expect: {}
  - name: global TradeTrackerTag
    page:
      url: https://example.test/
      js_globals:
        TradeTrackerTag: ''
    expect: {}
  - name: global _TradeTrackerTagOptions
    page:
      url: https://example.test/
      js_globals:
        _TradeTrackerTagOptions: ''
    expect: {}
  - name: global oTradeTrackerTag
    page:
      url: https://example.test/
      js_globals:
        oTradeTrackerTag: ''
    expect: {}
  - name: host static.tradetracker.net
    page:
      url: https://example.test/
      html: <script src="https://static.tradetracker.net/x.js"></script>
    expect: {}
  - name: host tm.tradetracker.net
    page:
      url: https://example.test/
      html: <script src="https://tm.tradetracker.net/x.js"></script>
    expect: {}
- id: upfluence
  name: Upfluence
  vendor: upfluence
  website: https://www.upfluence.com
  categories:
  - affiliate
  signals:
  - type: resource_url
    contains: //tracking.upfluence.co/
    id: host-0
  - type: resource_url
    contains: //upf.ai/
    id: host-1
  - type: resource_header
    key: x-upfluence-version
    id: reshdr-2
  - type: storage
    regex: (?i)^_upf_fingerprint$
    id: storage-3
  provenance:
    method: mined
    basis: Frequent unexplained tokens, identified and selected by an LLM reviewer from the observed tokens
      only, then replayed on the corpora. Cluster is the Upfluence influencer marketing/affiliate tracking
      script. It also loads FingerprintJS from openfpcdn.io, Quantserve, and arttrk.com (Affilizz/other
      trackers), which are shared or other products and were left out.
    corpus: nl-browser-full-sample
    support: 48
    mined_run: review-2026-11-2
    reviewed_by: llm + corpus replay; pending maintainer spot check
  tests:
  - name: host tracking.upfluence.co
    page:
      url: https://example.test/
      html: <script src="https://tracking.upfluence.co/x.js"></script>
    expect: {}
  - name: host upf.ai
    page:
      url: https://example.test/
      html: <script src="https://upf.ai/x.js"></script>
    expect: {}
  - name: reshdr x-upfluence-version
    page:
      url: https://example.test/
      resources:
      - url: https://cdn.example.org/a.js
        headers:
        - - x-upfluence-version
          - '1'
    expect: {}
  - name: storage _upf_fingerprint
    page:
      url: https://example.test/
      storage:
      - key: _upf_fingerprint
    expect: {}
