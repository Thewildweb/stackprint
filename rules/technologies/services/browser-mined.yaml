- id: aspnet
  name: ASP.NET
  vendor: microsoft
  categories: [programming-language]
  signals:
    - {id: session-cookie, type: cookie, exact: asp.net_sessionid, ignore_case: true}
    - {id: version-header, type: header, key: x-aspnet-version, regex: '^([0-9.]+)', version: '\1', version_confidence: high}
  provenance:
    method: convention
    basis: ASP.NET names its session cookie ASP.NET_SessionId and may send X-AspNet-Version.
  tests:
    - name: session cookie
      page: {url: "https://example.test/", headers: [["Set-Cookie", "ASP.NET_SessionId=abc; path=/; HttpOnly"]]}
      expect: {}

- id: amazon-cloudfront
  name: Amazon CloudFront
  vendor: amazon
  categories: [cdn]
  signals:
    - {id: cf-id, type: header, key: x-amz-cf-id}
  provenance:
    method: convention
    basis: Responses served through CloudFront carry X-Amz-Cf-Id and X-Amz-Cf-Pop. Only the page's own response counts; CloudFront-served third-party assets say nothing about the site.
  tests:
    - name: page served by cloudfront
      page: {url: "https://example.test/", headers: [["X-Amz-Cf-Id", "abc=="], ["X-Amz-Cf-Pop", "AMS1-C1"]]}
      expect: {}

- id: bunny-cdn
  name: Bunny CDN
  vendor: bunnyway
  categories: [cdn]
  signals:
    - {id: pullzone, type: header, key: cdn-pullzone}
  provenance:
    method: mined
    basis: Responses through a Bunny CDN pull zone carry CDN-PullZone and related CDN-* headers; found as a co-occurring unexplained header group.
    corpus: nl-browser-2026-09 (30,002 Dutch homepages, browser capture)
    support: 3456
    mined_run: mine-2026-11-22-browser-30k
