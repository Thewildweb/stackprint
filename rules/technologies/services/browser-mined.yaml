# Technologies first found as frequent unexplained tokens in browser
# captures (request hosts, JS globals, cookies, response headers). Each signal
# is a vendor-owned host or a token that co-occurred with the vendor's host
# on (nearly) every page in the mining run.

- id: squarespace
  name: Squarespace
  vendor: squarespace
  website: https://www.squarespace.com
  categories: [site-builder]
  signals:
    - {id: static, type: resource_url, contains: //static1.squarespace.com/}
    - {id: assets, type: resource_url, contains: //assets.squarespace.com/}
    - {id: rollups-global, type: js_global, key: SQUARESPACE_ROLLUPS}
    - {id: cvr-cookie, type: cookie, key: ss_cvr, confidence: 80}
  provenance:
    method: mined
    basis: >-
      Squarespace sites load their platform assets from vendor-owned
      static1/assets.squarespace.com; SQUARESPACE_ROLLUPS and the ss_cvr cookie
      co-occur with those hosts. Found as unexplained hosts/globals.
    corpus: nl-browser-2026-09 (30,002 Dutch homepages, browser capture)
    support: 501
    mined_run: mine-2026-11-22-browser-30k
    reviewed_by: pending maintainer review
  tests:
    - name: static host
      page: {url: "https://example.test/", html: '<script src="https://static1.squarespace.com/static/vta/abc/scripts/site-bundle.js"></script>'}
      expect: {}
    - name: global only
      page: {url: "https://example.test/", js_globals: {SQUARESPACE_ROLLUPS: ""}}
      expect: {}

